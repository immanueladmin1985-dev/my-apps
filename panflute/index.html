<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>난장이의 팬플룻 교실</title>
<meta name="theme-color" content="#F2ECE3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="팬플룻 교실">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="음정을 듣고 알려 주는 팬플룻 단계별 연습실">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="vendor/fonts/GowunDodum.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 글꼴은 앱 안에 넣어 둠(인터넷 없이 처음 열어도 같은 모양). 앱에 쓰는 글자와 자주 쓰는 한글 2350자만 남긴 파일, 라이선스는 vendor/fonts/OFL-*.txt */
@font-face{font-family:'Gowun Dodum';src:url(vendor/fonts/GowunDodum.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Song Myung';src:url(vendor/fonts/SongMyung.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Nanum Pen Script';src:url(vendor/fonts/NanumPenScript.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Great Vibes';src:url(vendor/fonts/GreatVibes.woff2) format('woff2');font-display:swap}
:root{
  --fs:18px;
  --serif:'Song Myung','Noto Serif KR','Noto Serif CJK KR',serif;
  --sans:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hand:'Great Vibes','Nanum Pen Script',cursive;
  --bg:#F2ECE3; --bg-deep:#E7DED1; --surface:#FFFCF7; --surface-2:#F6F0E7; --line:#E2D7C7; --paper:#FFFDF8;
  --ink:#3A2E24; --ink-2:#6D5F51; --ink-3:#A29382;
  --peony:#8A5A3B; --peony-ink:#FFF8EF; --peony-soft:#F1E5D6;
  --btn:#6E4A31;
  --bamboo:#C9A46A; --bamboo-2:#E9D5A9; --bamboo-dark:#8C6A3A;
  --jade:#5B8C68; --jade-soft:#E1ECE1; --warm:#BE733A; --warm-soft:#F6E6D5; --cool:#52779D; --cool-soft:#E1E9F1; --bad:#AE4F45;
  --s1:#F1E5D6; --s1i:#8A5A3B; --s2:#EEE6D3; --s2i:#806A3B; --s3:#E2E9DE; --s3i:#56775C; --s4:#ECE2DD; --s4i:#7A5250;
  --pearl:linear-gradient(135deg,#FBF7F0 0%,#EEE3D2 100%);
  --shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.07);
  --nav-h:70px; --hdr-h:60px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1D1814; --bg-deep:#16120F; --surface:#27211B; --surface-2:#2F2820; --line:#3E352B; --paper:#2A231D;
  --ink:#F2EAE0; --ink-2:#C4B6A6; --ink-3:#8A7D6F;
  --peony:#D9B27C; --peony-ink:#2A1E12; --peony-soft:#3A3024;
  --btn:#D9B27C;
  --bamboo:#D2AE72; --bamboo-2:#E9D5A9; --bamboo-dark:#8C6A3A;
  --jade:#8FC29C; --jade-soft:#26372B; --warm:#E3A06A; --warm-soft:#3E2E21; --cool:#8EB1D6; --cool-soft:#243142; --bad:#E08A80;
  --s1:#3A3024; --s1i:#D9B27C; --s2:#363020; --s2i:#D7C08A; --s3:#26372B; --s3i:#9CCBA6; --s4:#382C2A; --s4i:#D6A9A3;
  --pearl:linear-gradient(135deg,#2E2620 0%,#3A2F25 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(var(--fs) * var(--k,1));height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:root[data-theme="dark"] body{background:var(--bg)}
:focus-visible{outline:3px solid var(--peony);outline-offset:2px;border-radius:10px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-weight:400}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 80% at 50% 36%,#FCF8F1 0%,#F0E6D7 58%,#E3D4BF 100%);color:#3A2E24;overflow:hidden;
  padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);transition:opacity .8s ease,visibility .8s}
#splash.out{opacity:0;visibility:hidden}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
.sp-emblem{position:relative;width:min(190px,50vw);margin-bottom:16px;opacity:0;transform:translateY(10px);animation:spEmb 1.2s .05s ease forwards}
.sp-emblem svg{width:100%;height:auto;display:block}
@keyframes spEmb{to{opacity:1;transform:none}}
.sp-title{position:relative;text-align:center;font-family:var(--serif);line-height:1.15}
.sp-small{display:block;font-size:clamp(20px,5.6vw,28px);letter-spacing:.22em;margin-bottom:.25em;color:#8C7660}
.sp-big{display:block;font-size:clamp(40px,12.5vw,64px);letter-spacing:.04em}
.sp-ch{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(10px) scale(1.35);animation:resolve 1.05s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes resolve{60%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
.sp-big .sp-ch{background:linear-gradient(100deg,#3A2E24 0%,#3A2E24 38%,#B8915A 45%,#F1DDB0 50%,#B8915A 55%,#3A2E24 62%,#3A2E24 100%);
  background-size:320% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:resolve 1.05s cubic-bezier(.2,.7,.2,1) forwards,sheen 1.6s 1.25s ease-in-out forwards}
@keyframes sheen{to{background-position:0% 0}}
.sp-line{width:0;height:1px;margin:16px auto 10px;background:linear-gradient(90deg,transparent,#B8915A,transparent);animation:spLine 1s 1.2s ease forwards}
@keyframes spLine{to{width:min(240px,62vw)}}
.sp-credit{font-family:var(--hand);font-size:clamp(32px,9vw,42px);color:#8A5A3B;clip-path:inset(0 100% 0 0);animation:write 1.4s 1.75s steps(30,end) forwards;padding:0 6px}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.sp-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:.78rem;color:#9C8B78;opacity:0;animation:spEmb .6s 2.4s forwards}
@media (prefers-reduced-motion:reduce){
  .sp-ch,.sp-big .sp-ch{animation:fadeIn .8s forwards;filter:none;transform:none}
  .sp-credit{animation:fadeIn .8s .6s forwards;clip-path:none;opacity:0}
  .sp-line{animation:none;width:min(240px,62vw)}
}
@keyframes fadeIn{to{opacity:1}}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;min-height:calc(var(--hdr-h) + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 10px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#hdr h1{flex:1;font-size:1.12rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
#hdr h1.brand{font-family:var(--serif);font-weight:400;font-size:1.25rem;letter-spacing:.02em}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--bg-deep)}
.icon-btn svg{width:26px;height:26px}
#view{flex:1;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));width:100%;max-width:640px;margin:0 auto}
body.has-nav #view{padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
body.has-dock #view{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
body.has-nav.has-dock #view{padding-bottom:calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px))}
.screen{animation:scrIn .28s ease}
@keyframes scrIn{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.04)}
#nav button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);font-size:.78rem;font-weight:700}
#nav button svg{width:27px;height:27px}
#nav button.on{color:var(--peony)}
#nav button.on svg{transform:translateY(-1px)}

/* dock: fixed bottom action bar for practice screens */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 70%,color-mix(in srgb,var(--bg) 0%,transparent));display:flex;gap:10px;justify-content:center}
body.has-nav .dock{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:12px}
.dock>*{max-width:560px}

/* ---------- Buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:14px;font-weight:700;font-size:1rem;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--btn);color:var(--peony-ink);border-color:transparent}
.btn.soft{background:var(--peony-soft);color:var(--peony);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.big{min-height:64px;font-size:1.12rem;border-radius:20px}
.btn.wide{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.stop{background:var(--ink);color:var(--surface)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row>.grow{flex:1}
.row.wrap>.btn.grow{flex:1 1 40%}
.stack{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.mt{margin-top:14px}.mt2{margin-top:24px}.mb{margin-bottom:14px}

.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.flat{box-shadow:none;border:1.5px solid var(--line)}
.card+.card{margin-top:14px}
.sec-title{font-family:var(--serif);font-size:1.3rem;margin:26px 2px 10px}
.label{font-size:.86rem;color:var(--ink-2);font-weight:700;margin:0 0 6px 2px;display:block}

.seg{display:flex;background:var(--bg-deep);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:46px;border-radius:11px;font-weight:700;color:var(--ink-2);font-size:.95rem;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--btn);color:var(--peony-ink);border-color:var(--btn)}
.switch{position:relative;width:60px;height:34px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span::after{content:'';position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--jade)}
.switch input:checked+span::after{transform:translateX(26px)}
.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;min-height:64px;width:100%;text-align:left;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
button.li:active{background:var(--surface-2)}
.li .t{font-weight:700}
.li .d{font-size:.84rem;color:var(--ink-2);line-height:1.4}
.li .grow{flex:1;min-width:0}
.li .chev{color:var(--ink-3);width:20px;height:20px;flex:none}
.li-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.li-ic svg{width:26px;height:26px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:54px;height:54px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:1.5rem;font-weight:700;display:grid;place-items:center}
.stepper button:active{background:var(--bg-deep)}
.stepper .val{min-width:96px;text-align:center}
.stepper .val b{display:block;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stepper .val small{color:var(--ink-2);font-size:.8rem}
input[type=range]{width:100%;accent-color:var(--peony);height:36px}
select.sel{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-weight:700}
input.txt,textarea.txt{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px}

/* ---------- Home ---------- */
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;background:var(--pearl);background-size:200% 100%;color:var(--ink);box-shadow:var(--shadow)}
:root[data-theme="dark"] .hero{color:#F6EFE8}
.hero .greet{position:relative;font-family:var(--serif);font-size:1.45rem;line-height:1.3;padding-right:96px}
.hero .stat{margin-top:6px;font-size:.95rem;opacity:.85;padding-right:80px}
img.fart{display:block;width:100%;height:auto}
.sp-emblem img.fart{filter:drop-shadow(0 6px 14px rgba(90,60,30,.18))}
/* 첫 화면 그림: 왼쪽 빈 곳에 인사말, 오른쪽에 팬플룻 */
.hero.pic{background:linear-gradient(90deg,rgba(242,236,227,.82) 0%,rgba(242,236,227,.45) 50%,rgba(242,236,227,0) 72%),url(hero.webp) 100% 70%/cover no-repeat,var(--surface);min-height:clamp(170px,46vw,260px);display:flex;flex-direction:column;justify-content:space-between;padding:20px}
.hero.pic .greet{padding-right:0;max-width:56%;text-shadow:0 1px 0 rgba(255,250,240,.6)}
.hero.pic .row{align-self:flex-start}
.hero.pic .btn{align-self:flex-start;box-shadow:0 4px 12px rgba(80,50,20,.18)}
:root[data-theme="dark"] .hero.pic{background:linear-gradient(90deg,rgba(29,24,20,.55) 0%,rgba(29,24,20,.25) 45%,rgba(29,24,20,0) 70%),url(hero-dark.webp) 100% 70%/cover no-repeat,#1D1814}
:root[data-theme="dark"] .hero.pic .greet{text-shadow:none}
@media (orientation:landscape) and (max-height:600px){
  .hero.pic{min-height:clamp(140px,40vh,210px);padding:16px 20px}
  .hero.pic .greet{max-width:48%}
  #view .ob{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:28px;align-items:center;align-content:center;min-height:auto;padding:4px 8px}
  #view .ob>*{grid-column:2}
  #view .ob-art{grid-column:1;grid-row:1/span 6;width:min(170px,34vh);margin:0}
  #view #obOpts{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  #view .ob .micgate .mg-ic{display:none}
  #view .ob .micgate .card{padding:14px 16px}
  #view .ob .micgate .btn.big{min-height:50px}
  #view .ob h2{font-size:1.5rem}
  #view .ob .lead{margin-top:6px}
  #view .ob .tipbox.mt2{margin-top:10px}
  #view .ob-dots{margin:8px 0;justify-content:flex-start}
  .sp-emblem{width:min(150px,30vh);margin-bottom:6px}
  .sp-big{font-size:clamp(32px,11vh,56px)}
  .sp-small{font-size:clamp(16px,5vh,24px)}
  .sp-line{margin:10px auto 6px}
  .sp-credit{font-size:clamp(26px,8vh,38px)}
}
.hero .btn{margin-top:14px;background:var(--btn);border:0;color:var(--peony-ink)}

.banner{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:14px 14px;margin-top:14px;background:var(--warm-soft)}
.banner.info{background:var(--cool-soft)}
.banner svg{width:26px;height:26px;flex:none;margin-top:2px}
.banner .grow{flex:1}
.banner b{display:block}
.stage{margin-top:22px}
.stage-h{display:flex;align-items:center;gap:12px;margin:0 4px 10px}
.stage-h .pip{width:40px;height:40px;flex:none}
.stage-h .n{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.stage-h h2{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
.stage-h p{margin:0;font-size:.84rem;color:var(--ink-2)}

/* 홈: 단계 접기, 별표로 자주 하는 연습 고정 */
details.stage{margin-top:14px}
.stage-h .grow{flex:1;min-width:0}
details.stage>summary{list-style:none;cursor:pointer;padding:8px 6px;border-radius:14px}
details.stage>summary::-webkit-details-marker{display:none}
details.stage>summary:active{background:var(--surface-2)}
.stage-h .sg-chev{width:22px;height:22px;color:var(--ink-3);transition:transform .2s;transform:rotate(90deg);flex:none}
details.stage:not([open]) .sg-chev{transform:none}
details.stage:not([open])>summary{background:var(--surface);border:1px solid var(--line)}
.stage.pinned{margin-top:16px}
.pin-ic{width:40px;height:40px;display:grid;place-items:center;color:var(--bamboo)}
.pin-ic svg{width:28px;height:28px;fill:currentColor}
.pin-hint{margin:12px 4px 0;display:flex;align-items:center;gap:6px}
.pin-hint svg{width:16px;height:16px;flex:none}
.li.li-pin{padding:0;gap:0}
.li-main{display:flex;align-items:center;gap:14px;flex:1;min-width:0;padding:13px 4px 13px 16px;min-height:64px;text-align:left}
.li-main:active{background:var(--surface-2)}
.pin{width:52px;align-self:stretch;display:grid;place-items:center;color:var(--line);flex:none}
.pin svg{width:22px;height:22px}
.pin.on{color:var(--bamboo)}
.pin.on svg{fill:currentColor}
/* 홈: 단계별 탭 */
.stg-tabs{margin-top:16px}
.stg-tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;min-height:54px;font-size:.92rem}
.stg-tabs button small{font-size:.66rem;color:var(--ink-3)}
.stg-tabs button.on small{color:var(--peony)}
/* 연습곡 찾기 */
.sg-search{display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;min-height:50px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.sg-search svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.sg-search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:1rem;min-height:46px}
.sg-search button{width:40px;height:40px;display:grid;place-items:center;color:var(--ink-3)}
.song-w{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.song-w:first-child{border-top:0}
.song-w .song{border-top:0;flex:1;min-width:0}

/* ---------- Notes ---------- */
.nt{position:relative;display:inline-block}
.nt .od{position:absolute;left:50%;transform:translateX(-50%);font-size:max(5px,.12em);line-height:1;letter-spacing:.1em;white-space:nowrap}
.nt .od.up{top:-4%}
.nt .od.dn{bottom:-6%}

/* ---------- Pipe map ---------- */
.pipes-wrap{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:4px 2px 6px;-webkit-overflow-scrolling:touch}
.pipes-wrap svg{display:block}
.pipe-hit{cursor:pointer}
.pipe-lbl{font-family:var(--sans);font-weight:700;fill:var(--ink)}
.pipe-no{font-family:var(--sans);fill:var(--ink-3)}

/* ---------- Tuner ---------- */
.tuner{padding:16px 14px 18px;text-align:center;position:relative}
.tuner svg.gauge{width:100%;max-width:420px;display:block;margin:0 auto}
.t-note{font-family:var(--serif);font-size:5rem;line-height:1.05;margin-top:-6px;position:relative;min-height:1em}
.t-oct{font-size:1rem;color:var(--ink-2);height:1.4em;font-weight:700;margin-top:-4px}
.t-sub{font-size:1rem;color:var(--ink-2);margin-top:8px;font-variant-numeric:tabular-nums}
.t-hint{margin-top:10px;min-height:3.1em;font-size:1.02rem;font-weight:700;padding:8px 12px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.t-hint.good{background:var(--jade-soft);color:var(--jade)}
.t-hint.high{background:var(--warm-soft);color:var(--warm)}
.t-hint.low{background:var(--cool-soft);color:var(--cool)}
canvas.trace{width:100%;height:120px;display:block;border-radius:14px;background:var(--surface-2)}
.meter{position:relative;height:46px;border-radius:14px;background:linear-gradient(90deg,var(--cool-soft),var(--surface-2) 40%,var(--surface-2) 60%,var(--warm-soft));overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--jade-soft);border-left:2px solid var(--jade);border-right:2px solid var(--jade);opacity:.9}
.meter .mk{position:absolute;top:6px;bottom:6px;width:10px;margin-left:-5px;border-radius:6px;background:var(--ink);transition:left .08s linear,opacity .2s}
.meter .lab{position:absolute;bottom:2px;font-size:.7rem;color:var(--ink-3);font-weight:700}

/* ---------- Big target card ---------- */
.target{text-align:center;padding:18px 14px}
.target .q{font-size:.95rem;color:var(--ink-2);font-weight:700}
.target .big{font-family:var(--serif);font-size:4.6rem;line-height:1.05;margin:8px 0 4px}
.target .pno{font-size:1rem;color:var(--ink-2);font-weight:700}
.target.ok{animation:okPulse .5s}
@keyframes okPulse{30%{background:var(--jade-soft)}}
.fb{min-height:2.6em;margin-top:10px;font-weight:700;font-size:1.02rem}
.fb.good{color:var(--jade)}.fb.high{color:var(--warm)}.fb.low{color:var(--cool)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--jade)}.dots i.cur{background:var(--peony)}.dots i.skip{background:var(--ink-3)}
.seq{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px;scrollbar-width:none;scroll-behavior:smooth}
.seq::-webkit-scrollbar{display:none}
.seq .sn{flex:none;min-width:52px;height:60px;padding:0 8px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.25rem;border:2px solid transparent;position:relative}
.seq .sn small{font-size:.66rem;color:var(--ink-3);font-weight:700;margin-top:2px}
.seq .sn.cur{border-color:var(--peony);background:var(--peony-soft);transform:scale(1.06)}
.seq .sn.ok{background:var(--jade-soft);color:var(--jade)}
.seq .sn.mid{background:var(--warm-soft);color:var(--warm)}
.seq .sn.miss{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.seq .sn.rest{opacity:.55}
.result{text-align:center}
.result .score{font-family:var(--serif);font-size:3.2rem;line-height:1.1}
.result .stars{font-size:2rem;letter-spacing:.1em;color:var(--bamboo)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-top:12px}
.kv div{background:var(--surface-2);border-radius:14px;padding:10px 12px;text-align:center}
.kv b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.kv span{font-size:.8rem;color:var(--ink-2);font-weight:700}

/* ---------- Ring ---------- */
.ring{position:relative;width:min(240px,64vw);aspect-ratio:1;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.ring .in span{font-size:.9rem;color:var(--ink-2);font-weight:700}
.breath{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:10px auto;display:grid;place-items:center}
.breath .ball{position:absolute;width:42%;height:42%;border-radius:50%;background:var(--pearl);box-shadow:0 0 0 10px color-mix(in srgb,var(--peony) 10%,transparent);transition:transform linear}
.breath .txt{position:relative;text-align:center;font-weight:700;font-size:1.15rem}
.breath .txt b{display:block;font-size:2.4rem;font-family:var(--serif);font-weight:400}

/* ---------- Metronome ---------- */
.beats{display:flex;gap:12px;justify-content:center;margin:18px 0 8px}
.beats i{width:30px;height:30px;border-radius:50%;background:var(--line);transition:transform .06s,background .06s}
.beats i.acc{width:38px;height:38px;margin-top:-4px}
.beats i.on{background:var(--btn);transform:scale(1.18)}
.bpm-big{display:block;margin:0 auto;font-family:var(--serif);font-size:4.8rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bpm-name{text-align:center;color:var(--ink-2);font-weight:700}
.tap{width:100%;min-height:72px;border-radius:20px;background:var(--surface-2);border:2px dashed var(--line);font-weight:700;font-size:1.05rem;color:var(--ink-2)}
.tap:active{background:var(--peony-soft)}

/* ---------- Timing lane ---------- */
.lane{position:relative;height:90px;border-radius:16px;background:var(--surface-2);overflow:hidden}
.lane .ctr{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--jade)}
.lane .band{position:absolute;top:0;bottom:0;background:var(--jade-soft)}
.lane .hit{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;opacity:.85;transition:opacity 4s}
.lane .lb{position:absolute;bottom:4px;font-size:.72rem;font-weight:700;color:var(--ink-3)}
.pulse{width:120px;height:120px;border-radius:50%;margin:14px auto;background:var(--surface-2);display:grid;place-items:center;font-family:var(--serif);font-size:2.4rem;transition:transform .05s,background .05s}
.pulse.on{background:var(--peony-soft);transform:scale(1.08)}

/* ---------- Play-along roll ---------- */
.roll{position:relative;height:170px;border-radius:18px;background:var(--surface-2);overflow:hidden}
.roll .head{position:absolute;left:28%;top:0;bottom:0;width:3px;background:var(--peony);z-index:2;border-radius:2px}
.roll .strip{position:absolute;left:0;top:0;bottom:0;will-change:transform}
.roll .nb{position:absolute;height:34px;border-radius:10px;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;padding-left:8px;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden}
.roll .nb.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.roll .nb.mid{background:var(--warm-soft);border-color:var(--warm);color:var(--warm)}
.roll .nb.miss{border-color:var(--bad);color:var(--bad)}
.roll .nb.now{border-color:var(--peony);box-shadow:0 0 0 3px color-mix(in srgb,var(--peony) 25%,transparent)}
.roll .live{position:absolute;left:28%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ink);z-index:3;transition:top .06s linear}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:4rem;z-index:4;background:color-mix(in srgb,var(--surface-2) 70%,transparent)}

/* ---------- Song list ---------- */
.song{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line);min-height:72px}
.song:first-child{border-top:0}
.song .ttl{font-weight:700;font-size:1.05rem}
.song .meta{font-size:.82rem;color:var(--ink-2)}
.song .lv{display:flex;gap:3px;flex:none}
.song .lv i{width:8px;height:18px;border-radius:3px;background:var(--line)}
.song .lv i.on{background:var(--bamboo)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);margin-right:4px}

/* ---------- Sheet / modal ---------- */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(10,14,16,.45);animation:fadeIn .2s forwards;opacity:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:88vh;overflow:auto;animation:sheetIn .26s ease;max-width:640px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-family:var(--serif);font-size:1.4rem;margin-bottom:6px}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:90;
  background:var(--ink);color:var(--surface);padding:13px 20px;border-radius:16px;font-weight:700;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Mic gate ---------- */
.micgate{position:relative;margin-top:6px}
.micgate .card{text-align:center;padding:24px 20px}
.mg-ic{width:84px;height:84px;margin:4px auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--peony-soft);color:var(--peony)}
.mg-ic.warn{background:var(--warm-soft);color:var(--warm)}
.mg-ic svg{width:42px;height:42px}
.micgate h3{font-family:var(--serif);font-size:1.45rem;line-height:1.3}
.micgate p{color:var(--ink-2);margin:10px 0 0}
.steps{counter-reset:st;text-align:left;margin:16px 0 0;padding:0;list-style:none}
.steps li{position:relative;padding:12px 12px 12px 56px;background:var(--surface-2);border-radius:14px;margin-top:8px;min-height:54px;line-height:1.45}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:12px;top:11px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700}
.kbd{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;white-space:nowrap}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-weight:700;font-size:.85rem;background:var(--surface-2)}
.status-pill i{width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.status-pill.ok i{background:var(--jade)}.status-pill.no i{background:var(--bad)}.status-pill.ask i{background:var(--warm)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--peony);animation:rot 1s linear infinite;margin:10px auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Onboarding ---------- */
.ob{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;padding:10px 4px}
.ob h2{font-family:var(--serif);font-size:1.9rem;line-height:1.3}
.ob-art{width:min(170px,46vw);margin:0 auto 6px}
.ob-art svg{width:100%;height:auto;display:block}
.ob .lead{font-size:1.05rem;color:var(--ink-2);margin-top:10px}
.ob-dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.ob-dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:.2s}
.ob-dots i.on{width:26px;background:var(--btn)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);margin-top:10px;min-height:64px}
.opt.on{border-color:var(--peony);background:var(--peony-soft)}
.opt .t{font-weight:700}
.opt .d{font-size:.84rem;color:var(--ink-2)}
.level{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.level i{display:block;height:100%;width:0;background:var(--jade);border-radius:7px;transition:width .08s}

/* ---------- Basics guide ---------- */
.acc{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px;min-height:64px;font-weight:700;font-size:1.05rem;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary .num{width:34px;height:34px;border-radius:50%;background:var(--btn);color:var(--peony-ink);display:grid;place-items:center;flex:none;font-size:.95rem}
.acc[open] summary{border-bottom:1px solid var(--line)}
.acc .body{padding:4px 18px 18px;color:var(--ink);line-height:1.7}
.acc .body ul{padding-left:1.1em;margin:8px 0}
.acc .body li{margin:6px 0}
.tipbox{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:.92rem}

/* ---------- Records ---------- */
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--bamboo);min-height:3px}
.bars .b.today i{background:var(--peony)}
.bars .b span{font-size:.66rem;color:var(--ink-3);font-weight:700}
.habit{display:flex;align-items:center;gap:10px;padding:6px 0}
.habit .nm{width:64px;font-weight:700}
.habit .tr{flex:1;position:relative;height:16px;background:var(--surface-2);border-radius:8px}
.habit .tr::before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink-3)}
.habit .tr i{position:absolute;top:2px;bottom:2px;border-radius:6px}
.habit .v{width:58px;text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* ---------- Recording ---------- */
.rec-btn{width:88px;height:88px;border-radius:50%;margin:0;flex:none;display:grid;place-items:center;background:var(--btn);color:var(--peony-ink);box-shadow:0 0 0 10px var(--peony-soft)}
.rec-btn.on{animation:recP 1.4s infinite}
.rec-btn svg{width:44px;height:44px}
@keyframes recP{50%{box-shadow:0 0 0 18px var(--peony-soft)}}
.rec-time{text-align:center;font-family:var(--serif);font-size:2.2rem;font-variant-numeric:tabular-nums}

/* ---------- 내 곡 만들기: 음 길이 칸, 계이름 버튼 ---------- */
.ed-pal{gap:6px}
.ed-durs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--bg-deep);border-radius:14px;padding:4px}
.ed-durs button{min-height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--ink-2);font-weight:700}
.ed-durs button small{font-size:.66rem;line-height:1.1}
.ed-durs button.on{background:var(--surface);color:var(--peony);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.ed-durs button[disabled]{opacity:.35}
.ed-dot{font-size:1.6rem;line-height:.8;height:25px;display:grid;place-items:center}
.ed-keys{display:flex;gap:4px;align-items:stretch}
.ed-sol{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;position:relative;padding-top:13px}
.ed-sol button{min-height:48px;border-radius:12px;background:linear-gradient(90deg,#9A7642,#EBD8AC 30%,#CFAA6E 62%,#8E6B3A);color:#3A2812;font-weight:700;font-size:1.05rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);padding:0 2px;white-space:nowrap}
.ed-sol button:active{transform:translateY(2px)}
.ed-sol button[disabled]{opacity:.3}
.ed-oname{position:absolute;left:0;right:0;top:-1px;text-align:center;font-size:.68rem;font-weight:700;color:var(--ink-3);line-height:1.2}
.ed-oct{width:44px;flex:none;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:1rem;color:var(--ink-2);margin-top:13px}
.ed-oct[disabled]{opacity:.35}
.ed-acts .btn[disabled]{opacity:.4}
.stf-edit{cursor:crosshair}
.stf-edit .stf-empty{place-items:end center;padding:0 12px 8px;pointer-events:none;font-size:.8rem;text-align:center}

/* ---------- Landscape ---------- */
@media (orientation:landscape) and (max-height:600px){
  :root{--nav-h:56px;--hdr-h:50px}
  #view{max-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .t-note{font-size:4rem}
  .target .big{font-size:3.4rem}
  .ob{min-height:auto}
}
@media (min-width:900px){ .split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start} #view{max-width:1000px} }

/* ---------- 한 화면 맞춤 ---------- */
body.fitmode #view{padding-bottom:0!important;padding-top:4px}
.screen.fit{display:flex;flex-direction:column;gap:9px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen.fit::-webkit-scrollbar{display:none}
.screen.fit>*,.col>*{flex:none}
.col{display:flex;flex-direction:column;gap:9px;min-height:0}
.fx{flex:1 1 auto!important;min-height:0}
.cq{container-type:size}
.screen.fit .card{padding:12px 14px}
.screen.fit .card+.card{margin-top:0}
.screen.fit .seg button{min-height:42px}
.screen.fit .chip{min-height:40px}
.screen.fit .mt{margin-top:0}
.screen.fit .micgate .card{padding:18px 16px}
.target.fx{display:flex;flex-direction:column;align-items:center;justify-content:center;container-type:size;padding:8px 10px}
.target.fx .big{font-size:clamp(2.2rem,30cqh,4.6rem);margin:2px 0}
.target.fx .fb{min-height:1.3em;margin-top:6px}
.target.fx .dots{margin-top:6px}
.meter.slim{height:32px}
.screen.fit .pm-card{padding:4px 4px 0}
.tuner.fx{container-type:size;display:flex;flex-direction:column;justify-content:center;padding:10px}
.tuner.fx svg.gauge{max-height:46cqh;width:auto;max-width:100%}
.tuner.fx .t-note{font-size:clamp(2.4rem,20cqh,5rem)}
.tuner.fx .t-hint{min-height:2.4em;margin-top:6px}
.ring-box{container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-box .ring{width:auto;height:min(230px,62cqh);aspect-ratio:1;margin:0 auto}
.ring-box .fb{min-height:1.3em;margin-top:4px}
.breath-box{container-type:size;display:grid;place-items:center}
.breath-box .breath{width:auto;height:min(260px,88cqh);aspect-ratio:1;margin:0}
.info-big{font-family:var(--serif);font-size:clamp(2.4rem,38cqh,4.6rem);line-height:1.05}
.row.between{justify-content:space-between}
.ibtns{display:flex;gap:6px}
.ibtns .btn{flex:1;min-height:50px;padding:0 4px;font-size:.8rem;flex-direction:column;gap:2px;border-radius:12px}
.ibtns .btn svg{width:19px;height:19px}
.ibtns .btn.on{background:var(--peony-soft);border-color:var(--peony);color:var(--peony)}
.cur-row{display:flex;align-items:baseline;gap:10px;padding:0 4px;min-height:2.2rem}
.cur-row b{font-family:var(--serif);font-size:2.1rem;font-weight:400;line-height:1}
.cur-row .s{color:var(--ink-2);font-weight:700;font-size:.88rem;white-space:nowrap}
.cur-row .fb{margin:0 0 0 auto;min-height:0;font-size:.84rem;text-align:right;line-height:1.3}
.kv.tight{margin-top:0;grid-template-columns:repeat(4,1fr);gap:6px}
.kv.tight div{padding:6px 4px;border-radius:12px}
.kv.tight b{font-size:1.08rem}
.kv.tight span{font-size:.7rem}
.stepper.sm button{width:44px;height:44px;font-size:1.25rem;border-radius:12px}
.stepper.sm .val{min-width:56px}
.stepper.sm .val b{font-size:1.45rem}
.tap.sm{min-height:52px;font-size:.92rem}
.pulse.sm{width:46px;height:46px;margin:0;font-size:1rem;flex:none}
.lane.fx{min-height:64px;height:auto}
.screen.fit .beats{margin:2px 0}
.lenbars{display:flex;align-items:flex-end;gap:6px;position:relative;padding-top:6px}
.lenbars .lb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.lenbars .lb i{display:block;width:100%;border-radius:6px 6px 3px 3px;min-height:4px}
.lenbars .lb span{font-size:.7rem;color:var(--ink-3);font-weight:700}
.lenbars .guide{position:absolute;left:0;right:0;border-top:2px dashed var(--jade);opacity:.7}
.phase{position:relative;border-radius:14px;background:var(--surface-2);min-height:70px;overflow:hidden}
.phase .zone{position:absolute;top:0;bottom:0;background:var(--jade-soft);border-left:2px solid var(--jade);border-right:2px solid var(--jade)}
.phase .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink-3)}
.phase .lbl{position:absolute;bottom:4px;font-size:.7rem;font-weight:700;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.phase .pd{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;opacity:.85}
.helpbody{line-height:1.7}
.helpbody p{margin:8px 0}
.helpbody ul{padding-left:1.1em;margin:6px 0}

/* ---------- 흐르는 악보 ---------- */
.stf-lane{position:relative;overflow:hidden;border-radius:16px;background:var(--paper);border:1px solid var(--line);min-height:118px}
.stf-scroll{position:absolute;left:0;top:0;height:100%;will-change:transform}
.stf-scroll.anim{transition:transform .34s cubic-bezier(.3,.7,.3,1)}
.stf-svg{display:block}
.stf-fix{position:absolute;left:0;top:0;height:100%;z-index:2}
.stf-fade{position:absolute;top:0;bottom:0;left:0;z-index:1;background:linear-gradient(90deg,var(--paper) 74%,transparent)}
.stf-line{position:absolute;top:6%;bottom:6%;width:2px;z-index:3;background:var(--peony);border-radius:2px;box-shadow:0 0 0 5px color-mix(in srgb,var(--peony) 12%,transparent)}
.stf-live{position:absolute;z-index:4;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;border:3px solid var(--ink);transition:top .06s linear,opacity .15s;opacity:0}
.stf-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:.9rem;z-index:5}
.sl{stroke:var(--ink-3);stroke-width:1}
.bar{stroke:var(--ink-3);stroke-width:1.2}
.bar.end{stroke:var(--ink);stroke-width:3}
.tsg{font-family:var(--serif);font-size:20px;fill:var(--ink);text-anchor:middle}
.clef{fill:none;stroke:var(--ink);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.clef-dot{fill:var(--ink)}
.n .hd{fill:var(--ink);stroke:var(--ink)}
.n .hd.ho{fill:var(--paper)}
.n .st,.n .lg,.n .tie{stroke:var(--ink);stroke-width:1.4;fill:none}
.n .fl,.n .dt,.n .rs,.n .acc{fill:var(--ink)}
.n .rq{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.n .lb{font-family:var(--sans);font-size:13px;font-weight:700;fill:var(--ink-2);text-anchor:middle}
.n .acc{font-size:15px}
.n .ott{font-size:8px;fill:var(--ink-2);font-style:italic}
.n.cur .hd,.n.cur .fl,.n.cur .dt{fill:var(--peony);stroke:var(--peony)}
.n.cur .hd.ho{fill:var(--peony-soft)}
.n.cur .st{stroke:var(--peony)}
.n.cur .lb{fill:var(--peony);font-size:15px}
.n.ok .hd,.n.ok .fl{fill:var(--jade);stroke:var(--jade)} .n.ok .st{stroke:var(--jade)} .n.ok .lb{fill:var(--jade)}
.n.mid .hd,.n.mid .fl{fill:var(--warm);stroke:var(--warm)} .n.mid .st{stroke:var(--warm)} .n.mid .lb{fill:var(--warm)}
.n.miss .hd,.n.miss .fl{fill:var(--bad);stroke:var(--bad)} .n.miss .st{stroke:var(--bad)} .n.miss .lb{fill:var(--bad)}
.n.past{opacity:.35}
.stf-lane.nolabel .lb{display:none}
.slur{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.stf-lane .count{z-index:6}
.bigcount{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.bigcount b{font-family:var(--serif);font-weight:400;font-size:min(42vmin,260px);line-height:1;color:var(--peony);text-shadow:0 4px 18px color-mix(in srgb,var(--peony) 25%,transparent)}
.bigcount b.beat{animation:cntBeat calc(60s / 120) ease-out}
.bigcount span{font-weight:700;color:var(--ink-2);background:var(--surface);padding:6px 14px;border-radius:99px;box-shadow:var(--shadow)}
@keyframes cntBeat{0%{transform:scale(1.25);opacity:.4}100%{transform:scale(1);opacity:1}}

/* ---------- 한 줄씩 보는 악보 (노래방 자막처럼) ---------- */
.ln-lane{position:relative;overflow:hidden;border-radius:16px;background:var(--paper);border:1px solid var(--line);min-height:118px}
.ln-rows{position:absolute;inset:0}
.ln-row{position:absolute;left:0;right:0;display:flex;align-items:center;padding-left:4px;transition:opacity .35s ease,background-color .3s}
.ln-row.off{opacity:0;pointer-events:none}
.ln-row.act{background:color-mix(in srgb,var(--peony-soft) 55%,transparent)}
.ln-row svg{display:block;flex:none}
.ln-bar{position:absolute;width:4px;margin-left:-2px;border-radius:2px;background:var(--peony);z-index:3;opacity:0;pointer-events:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--peony) 16%,transparent)}
.ln-lane .n.past{opacity:1}
.ln-lane .n.past:not(.ok):not(.mid):not(.miss) .hd:not(.ho),.ln-lane .n.past:not(.ok):not(.mid):not(.miss) .fl,.ln-lane .n.past:not(.ok):not(.mid):not(.miss) .dt{fill:var(--cool)}
.ln-lane .n.past:not(.ok):not(.mid):not(.miss) .hd,.ln-lane .n.past:not(.ok):not(.mid):not(.miss) .st{stroke:var(--cool)}
.ln-lane .n.past:not(.ok):not(.mid):not(.miss) .lb{fill:var(--cool)}
.ln-lane .n.cur .hd{filter:drop-shadow(0 0 3px var(--peony))}
.ln-lane .n.cur .lb{font-size:16px}
.ln-lane .count{z-index:6}
.ln-lane.nolabel .lb{display:none}
.ln-lane .stf-live{z-index:4}

/* ---------- 가로 화면: 꼭 필요한 것만 ---------- */
@media (orientation:landscape) and (max-height:600px){
  .land-hide{display:none!important}
  #hdr{min-height:calc(46px + env(safe-area-inset-top,0px))}
  #hdr .icon-btn{width:42px;height:42px}
  .dock{padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
  .dock .btn.big{min-height:46px;font-size:1rem}
  .screen.fit{gap:7px}
  /* 음정 보기: 위쪽 큰 칸 안에서 바늘(왼쪽)과 음 이름(오른쪽)을 나란히 */
  .tuner.fx{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;column-gap:12px}
  .tuner.fx>svg.gauge{grid-column:1;grid-row:1/span 4;max-height:96cqh}
  .tuner.fx>div{grid-column:2}
  .tuner.fx .t-note{margin-top:0;font-size:clamp(2.4rem,34cqh,4.4rem)}
  .target.fx .big{font-size:clamp(2rem,38cqh,3.6rem)}
  .ring-box .ring{height:min(200px,78cqh)}
  .cur-row b{font-size:1.7rem}
  .stf-lane,.ln-lane{min-height:88px}
}
@media (max-height:700px){.stf-lane,.ln-lane{min-height:96px}.sm-hide{display:none!important}}

/* ---------- 키·빠르기 조절 ---------- */
.ctl-row{display:flex;gap:6px}
.sctl{flex:1;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px 4px 3px 10px;min-height:46px;min-width:0}
.sctl .sl-l{font-size:.72rem;font-weight:700;color:var(--ink-3);white-space:nowrap}
.sctl button{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:0;font-size:1.2rem;font-weight:700;color:var(--ink);flex:none;touch-action:manipulation}
.sctl b{flex:1;text-align:center;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.presets{display:flex;gap:6px}
.presets .chip{flex:1;justify-content:center;padding:0 4px;font-size:.84rem}
.syls{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden;min-height:30px}
.syls span{flex:none;padding:4px 8px;border-radius:10px;font-size:.74rem;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.syls span.ok{background:var(--jade-soft);color:var(--jade)}
.syls span.no{background:var(--warm-soft);color:var(--warm)}
.bd-steps{display:flex;gap:8px;justify-content:center;margin-top:8px}
.bd-steps span{padding:6px 12px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:.86rem;color:var(--ink-3)}
.bd-steps span.on{background:var(--peony-soft);color:var(--peony)}
.bd-steps span.done{background:var(--jade-soft);color:var(--jade)}

/* ---------- 오늘의 연습 순서 막대 (머리줄 안) ---------- */
#rtbar{display:flex;align-items:center;gap:4px;flex:none;max-width:58vw;padding:3px 4px 3px 10px;border-radius:99px;background:var(--peony-soft);color:var(--peony);font-size:.78rem;font-weight:700;white-space:nowrap}
#rtbar.due{background:var(--peony);color:var(--peony-ink);animation:okPulse 1.6s infinite}
#rtbar .rt-t{overflow:hidden;text-overflow:ellipsis;max-width:9em}
#rtbar button{min-height:32px;padding:0 9px;border-radius:99px;background:var(--surface);color:var(--ink);font-weight:700;font-size:.76rem}
#rtbar button[data-rt="stop"]{width:30px;padding:0;background:transparent;color:inherit;font-size:1.1rem}
@media (max-width:560px){#hdr:has(#rtbar) #hTitle{display:none}#hdr #rtbar{flex:1 1 0;min-width:0;overflow:hidden;max-width:none;justify-content:flex-start}#rtbar .rt-t{flex:1;min-width:0;max-width:none}}
body.focusmode #rtbar{position:fixed;right:calc(max(8px,env(safe-area-inset-right,0px)) + var(--fbarw,140px) + 8px);top:calc(4px + env(safe-area-inset-top,0px));z-index:41;box-shadow:var(--shadow);max-width:40vw}
.rt-li{gap:6px;padding:8px 8px 8px 14px;min-height:56px}
.rt-li .icon-btn{width:38px;height:38px;font-size:1.1rem}
/* ---------- 연습 달력 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal i{font-style:normal;text-align:center;font-size:.8rem;font-weight:700;aspect-ratio:1;display:grid;place-items:center;border-radius:10px;position:relative;color:var(--ink-2)}
.cal .cal-w{aspect-ratio:auto;font-size:.68rem;color:var(--ink-3)}
.cal .cal-d{background:var(--surface-2)}
.cal .l1{background:color-mix(in srgb,var(--jade) 22%,var(--surface))}
.cal .l2{background:color-mix(in srgb,var(--jade) 45%,var(--surface))}
.cal .l3{background:var(--jade);color:#fff}
.cal .today{outline:2px solid var(--peony);outline-offset:-2px}
.cal em{position:absolute;right:3px;top:1px;font-style:normal;font-size:.6rem}

/* ---------- 반주 녹음 단계 안내 ---------- */
.bk-steps{list-style:none;margin:0;padding:0;counter-reset:bk;display:flex;flex-direction:column;gap:6px}
.bk-steps li{position:relative;padding:6px 8px 6px 42px;border-radius:12px;line-height:1.3}
.bk-steps li::before{counter-increment:bk;content:counter(bk);position:absolute;left:8px;top:7px;width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.bk-steps li b{display:block;font-size:.95rem}
.bk-steps li span{font-size:.78rem;color:var(--ink-2)}
.bk-steps li.on{background:var(--peony-soft)}
.bk-steps li.on::before{background:var(--peony);color:var(--peony-ink)}
.bk-steps li.done::before{content:'✓';background:var(--jade);color:#fff}

/* ---------- 설정 탭 ---------- */
.st-tabs{position:sticky;top:calc(var(--hdr-h) + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);padding:6px 0 8px;margin:0 -2px}
.st-tabs .chip{min-height:40px}
.sec-title.st-h{margin-top:10px}
.grid2.set-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}

/* ---------- 설정 요약 줄 ---------- */
.optbar{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:6px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--ink-3);font-size:.8rem;color:var(--ink-2);text-align:left;font-weight:700}
.optbar svg{width:18px;height:18px;flex:none;color:var(--peony)}
.optbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.optbar b{color:var(--peony);white-space:nowrap}

/* ---------- 결과 줄 ---------- */
.rbar{position:fixed;left:50%;top:calc(var(--hdr-h) + 8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;width:min(640px,calc(100vw - 20px));display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--peony);box-shadow:0 10px 30px rgba(40,25,10,.22);animation:rbIn .3s ease}
@keyframes rbIn{from{opacity:0;transform:translate(-50%,-10px)}}
.rbar .rb-t{flex:1 1 220px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;min-width:0}
.rbar .rb-t b{font-size:.95rem}
.rbar .rb-sc{font-family:var(--serif);font-size:1.5rem;line-height:1;color:var(--peony)}
.rbar .rb-st{color:var(--bamboo);letter-spacing:.05em}
.rbar .rb-t small{flex-basis:100%;color:var(--ink-2);font-size:.76rem}
.rbar .rb-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rbar .rb-x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.rbar .rb-x svg{width:20px;height:20px}
body.focusmode .rbar{top:calc(6px + env(safe-area-inset-top,0px));left:calc(50% - 40px)}

/* ---------- 소리 정보 줄 ---------- */
.sinfo{display:grid;grid-template-columns:1.3fr 1fr 1.1fr .95fr .8fr;}.sinfo.noclr{grid-template-columns:1.3fr 1fr 1.1fr .8fr}.sinfo{gap:4px;font-variant-numeric:tabular-nums;min-height:44px}
.sinfo:empty{display:none}
.sinfo>span{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:3px;padding:4px 7px;border-radius:10px;background:var(--surface);border:1px solid var(--line);line-height:1.2;min-width:0;overflow:hidden}
.sinfo i{flex-basis:100%;font-style:normal;font-size:.7rem;font-weight:700;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinfo b{font-size:1.08rem}
.sinfo small{font-size:.72rem;color:var(--ink-2);font-weight:700}
.sinfo em{flex-basis:100%;font-style:normal;font-size:.74rem;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.sinfo{grid-template-columns:1.3fr 1fr 1.1fr .9fr}.sinfo .si-d{display:none}.sinfo.noclr .si-d{display:flex}} /* 좁은 세로 화면: ‘오늘’ 칸은 기록 탭에서 봄 */
.sinfo .good{color:var(--jade)}.sinfo .high{color:var(--warm)}.sinfo .low{color:var(--cool)}.sinfo .bad{color:var(--bad)}
.lbn{font-size:9px;fill:var(--cool);font-weight:700}.lbp{fill:var(--cool)}
.nx-h{color:var(--cool);font-weight:700}
.fs-lock svg,.fs-done svg{width:15px;height:15px;vertical-align:-2px}.fs-lock{color:var(--ink-3)}.fs-done{color:var(--jade)}
.fs-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px}
.fs-ring{width:min(62vw,240px,34vh);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;border:8px solid var(--line);background:var(--surface-2);transition:border-color .25s,background .25s}
.fs-ring b{font-family:var(--serif);font-size:clamp(1.3rem,6vw,1.9rem)}.fs-ring span{font-size:.85rem;color:var(--ink-2)}
.fs-ring.air{border-color:var(--warm);background:var(--warm-soft)}.fs-ring.tone{border-color:var(--jade);background:var(--jade-soft)}.fs-ring.over,.fs-ring.other{border-color:var(--cool);background:var(--cool-soft)}
.fs-main .kv{width:100%;max-width:380px;margin-top:0}
.fs-tip{min-height:2.6em;font-weight:700;color:var(--ink-2);max-width:30em}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 8px;border-radius:14px;border:1px dashed var(--line);color:var(--ink-3)}
.bdg i svg{width:26px;height:26px}.bdg b{font-size:.92rem}.bdg span{font-size:.72rem;line-height:1.3}
.bdg.on{border:1px solid var(--bamboo);background:var(--peony-soft);color:var(--ink)}.bdg.on i{color:var(--bamboo-dark)}
.brm{font-family:var(--serif);font-size:26px;font-weight:700;fill:var(--cool);text-anchor:middle}

/* ---------- 빠르기 숫자 입력·즐겨찾기 ---------- */
/* 숫자를 눌러 직접 적는 칸: 밑줄 대신 옅은 입력 칸 모양 */
.sctl b.tapnum,.stepper b.tapnum{cursor:pointer;border-radius:9px;padding:5px 4px;background:var(--paper);border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.sctl b.tapnum:active,.stepper b.tapnum:active{background:var(--surface-2)}
.bpm-big.tapnum{cursor:pointer;border-radius:18px;padding:2px 18px;position:relative}
.bpm-big.tapnum:active{background:var(--surface-2)}
.bpm-big.tapnum::after{content:'✎';position:absolute;right:-.05em;top:.15em;font-family:var(--sans);font-size:.28em;color:var(--ink-3);line-height:1}
.favrow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;min-height:34px;padding:1px 0}
.favrow::-webkit-scrollbar{display:none}
.favrow button,.favedit .fv{flex:none;min-height:32px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.favrow .fv.on,.favedit .fv.on{border-color:var(--peony);color:var(--peony);background:var(--peony-soft)}
.favrow .fv-add{display:inline-flex;align-items:center;gap:3px;color:var(--peony)}
.favrow .fv-add svg{width:15px;height:15px}
.fv-empty{font-size:.74rem;color:var(--ink-3);white-space:nowrap}
.favedit{display:flex;flex-wrap:wrap;gap:6px}
.favedit .fv{display:inline-flex;align-items:center;padding:0 2px 0 12px;gap:2px}
.favedit .fv button{font:inherit;color:inherit;min-height:36px}
.favedit .fx-x{width:32px;font-size:1.1rem;color:var(--ink-3)}
.tmp-in{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:8px}
.tmp-in button{width:52px;height:56px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:1rem}
.tmp-in input{width:120px;height:64px;border-radius:16px;border:2px solid var(--peony);background:var(--surface);text-align:center;font-family:var(--serif);font-size:2.2rem}

/* ---------- 악상기호 ---------- */
.am{fill:var(--ink)}
.al{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.n.cur .am{fill:var(--peony)} .n.cur .al{stroke:var(--peony);fill:none}
.n.aok .am{fill:var(--jade)} .n.aok .al{stroke:var(--jade);fill:none}
.n.abad .am{fill:var(--bad)} .n.abad .al{stroke:var(--bad);fill:none}
.slur.aok{stroke:var(--jade);stroke-width:2.4} .slur.abad{stroke:var(--bad);stroke-width:2.4}
.nlt{font-family:var(--serif);font-size:9px;font-style:italic;fill:var(--ink-2)}
.nlb{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.nlg.aok .nlt{fill:var(--jade)} .nlg.aok .nlb{stroke:var(--jade)} .nlg.abad .nlt{fill:var(--bad)} .nlg.abad .nlb{stroke:var(--bad)}
.tgls{display:flex;gap:6px}
.tgls .chip{flex:1;justify-content:center;padding:0 4px;font-size:.82rem;min-height:40px}
.sel-row{display:flex;gap:6px}

/* ---------- 듣는 장치 ---------- */
.outrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.outrow>span{font-size:.86rem;font-weight:700;color:var(--ink-2)}
.outb{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;min-height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font:inherit;font-size:.86rem;font-weight:700;color:var(--ink);white-space:nowrap;max-width:62%;overflow:hidden}

<script>
'use strict';
/* ================= 기본 도구 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad2 = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const median = a => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) * (x - m)))); };
const fmtSec = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad2(s % 60); };
const hasBatchim = w => { const ch = String(w).trim().slice(-1); if (ch === '#') return true; const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 && c % 28 !== 0; };
const iE = w => (hasBatchim(w) ? '이에요' : '예요');
const eul = w => (hasBatchim(w) ? '을' : '를');

/* 같은 앱이 두 곳(홈 화면 앱과 브라우저 탭 등)에 열려 있을 때, 오래된 창이 저장하면서
   다른 창에서 바꾼 설정(마이크·소음값 등)을 옛값으로 덮어쓰지 않도록 세 갈래로 합침.
   이 창에서 바꾼 값만 이 창 것을 쓰고, 나머지는 저장소의 새 값을 씀. 객체는 그 자리에서 고침. */
function merge3(mine, base, theirs) {
  const keys = new Set([...Object.keys(mine), ...Object.keys(theirs || {})]);
  keys.forEach(k => {
    const m = mine[k], b = base ? base[k] : undefined, t = theirs ? theirs[k] : undefined;
    if (isObj(m) && isObj(t)) { merge3(m, isObj(b) ? b : {}, t); return; }
    if (same(m, b)) { if (t === undefined) delete mine[k]; else mine[k] = t; return; }
    if (same(t, b)) return;
    if (Array.isArray(m) && Array.isArray(t) && byId(m) && byId(t)) { mine[k] = mergeById(m, Array.isArray(b) && byId(b) ? b : [], t); return; }
    if (k === 'sessions' && Array.isArray(m) && Array.isArray(t)) { const seen = new Set(m.map(x => x.t + x.f)); mine[k] = m.concat(t.filter(x => !seen.has(x.t + x.f))).sort((x, y) => x.t - y.t); }
  });
  return mine;
}
/* id가 있는 항목 목록(듣는 장치 등)은 통째로 덮지 않고 항목마다 합침: 한 창에서 잰 스피커 지연을
   다른 창이 자기 목록으로 덮어 '아직 안 잼'으로 되돌리던 문제를 막음 */
const byId = a => a.every(x => isObj(x) && typeof x.id === 'string');
function mergeById(m, b, t) {
  const inB = id => b.some(x => x.id === id);
  const out = [];
  t.forEach(x => { const mx = m.find(y => y.id === x.id); if (mx) out.push(merge3(mx, b.find(y => y.id === x.id) || {}, x)); else if (!inB(x.id)) out.push(x); });
  m.forEach(x => { if (!t.some(y => y.id === x.id) && !inB(x.id)) out.push(x); });
  return out;
}
function syncDB() { // 저장소가 다른 창 때문에 바뀌었으면 이 창의 DB에 합침
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw || raw === lastRaw) return false;
    const base = normalizeDB(lastRaw ? JSON.parse(lastRaw) : {}); // 기본값을 채운 모습끼리 비교해야 아직 저장 안 된 기본값을 '바꾼 값'으로 착각하지 않음
    merge3(DB, base, JSON.parse(raw)); normalizeDB(DB); lastRaw = raw; refreshPipes && refreshPipes();
    return true;
  } catch (e) { return false; }
}

const KO = ['도', '도#', '레', '레#', '미', '파', '파#', '솔', '솔#', '라', '라#', '시'];
const EN = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const KEY_PC = { C: 0, G: 7, F: 5, D: 2 };
const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const pc = m => ((m % 12) + 12) % 12;
const m2f = m => S().a4 * Math.pow(2, (m - 69) / 12);
const f2m = f => 69 + 12 * Math.log2(f / S().a4);
const octOf = m => Math.floor(m / 12) - 1;
function relOct(m) { return Math.floor((m - REF()) / 12); }
function octTag(m) { const d = relOct(m); return d <= -2 ? '아주 낮은' : d === -1 ? '낮은' : d === 0 ? (m === REF() ? '가온' : '') : d === 1 ? '높은' : '아주 높은'; }
function nName(m) { const st = S().noteStyle; return st === 'en' ? EN[pc(m)] + octOf(m) : st === 'both' ? KO[pc(m)] + ' ' + EN[pc(m)] : KO[pc(m)]; }
function nFull(m) { const t = octTag(m); return (t ? t + ' ' : '') + KO[pc(m)]; }
function nHTML(m, cls = '') {
  if (S().noteStyle === 'en') return `<span class="nt ${cls}">${esc(nName(m))}</span>`;
  const o = relOct(m);
  const dots = o === 0 ? '' : `<span class="od ${o > 0 ? 'up' : 'dn'}">${'●'.repeat(Math.min(2, Math.abs(o)))}</span>`;
  return `<span class="nt ${cls}">${esc(nName(m))}${dots}</span>`;
}
function inKey(m, key) { return MAJOR.includes(pc(m - (KEY_PC[key] || 0))); }
function flutePipes() {
  const f = S().flute; const arr = []; let m = f.low;
  let guard = 0; while (!inKey(m, f.key) && guard++ < 12) m++;
  while (arr.length < clamp(f.pipes, 8, 32)) { if (inKey(m, f.key)) arr.push(m); m++; }
  return arr;
}
let PIPES = flutePipes();

const pipeNo = m => PIPES.indexOf(m) + 1; // 0이면 관 없음

function bendFrom(m) { // 관에 없는 음: 어느 관을 꺾어야 하는지

}

/* ================= 음정 인식 (YIN) ================= */
let _yd = new Float32Array(1), _cm = new Float32Array(1);

  const W = buf.length >> 1;

    d[tau] = s;

  const TH = Math.max(0.15, best + 0.1);

  for (let t = tMin; t <= tMax; t++) {
    if (cm[t] < TH) {

      for (let u = t + 1; u <= lim && cm[u] < TH; u++) if (cm[u] < cm[tau]) tau = u;
      break;
    }

  if (tau < 0) return null;
  let better = tau;
  // 위치 보정은 정규화 전 차이 함수로 함(정규화 값으로 하면 잡음이 있을 때 한쪽으로 치우침)

/* ================= 마이크 허용 안내 (게이트) ================= */
// 마이크가 필요한 화면에서 호출. 준비되면 onReady() 실행. 해제 함수 반환.
function withMic(host, onReady) {
  const gate = document.createElement('div'); gate.className = 'micgate'; host.prepend(gate);
  let done = false, busy = false;
  const finish = () => { if (done) return; done = true; unsub(); gate.remove(); onReady(); };

    gate.innerHTML = gateHTML(st);
    $$('[data-mg]', gate).forEach(b => b.addEventListener('click', onBtn));
  }
  async function tryAcquire(msg) {
    busy = true; gate.innerHTML = `<div class="card"><div class="spin"></div><p>${msg || '마이크를 연결하고 있어요…'}</p></div>`;
    const ok = await Mic.acquire(); busy = false;
    if (done) return;
    if (ok) finish(); else showState(Mic.state === 'on' ? 'error' : Mic.state);
  }
  async function render() {
    if (done || busy) return;
    if (Mic.running()) { finish(); return; }
    if (!Mic.secure()) { showState('insecure'); return; }
    if (Mic.embeddedBlocked()) { showState('embedded'); return; }
    const q = await Mic.query();
    if (done || busy) return;
    if (q === 'granted') { tryAcquire(); return; }
    if (q === 'denied') { showState('denied'); return; }
    if (['nodevice', 'busy', 'error', 'dismissed'].includes(Mic.state)) { showState(Mic.state); return; }
    showState('prompt');
  }

    const a = e.currentTarget.dataset.mg;

}

/* 지금 상태를 글로 */
async function micStatusText() {
  if (!Mic.secure()) return { cls: 'no', t: '파일로 열려 있어 사용할 수 없음' };
  if (Mic.running()) return { cls: 'ok', t: '연결됨' };
  const q = await Mic.query();
  return q === 'granted' ? { cls: 'ok', t: '허용됨' } : q === 'denied' ? { cls: 'no', t: '막혀 있음' } : { cls: 'ask', t: '아직 허용 안 함' };
}

function wrongMsg(m, tgt) {
  const d = tgt - m; const dir = d > 0 ? '더 높은' : '더 낮은';

/* 습관 기록: 한 음을 안정적으로 불었을 때 평균 센트를 쌓아 둠 */
function recordHabit(m, c) {
  if (!PIPES.includes(m) || Math.abs(c) > 45) return;
  const h = DB.habit[m] || { n: 0, sum: 0 }; h.n++; h.sum += c; if (h.n > 400) { h.sum *= 0.5; h.n = Math.round(h.n * 0.5); }
  DB.habit[m] = h; saveDB();
}

const itemKey = it => it.id + (it.p ? ':' + it.p.mode : '');
function pinnedList() { const v = pref('pinned', []); return Array.isArray(v) ? v.slice() : []; }
function homeTab() { return clamp(+pref('homeTab', 1) || 1, 1, STAGES.length); }

function homeItemHTML(it, n) { const k = itemKey(it); return `<div class="li li-pin"><button class="li-main" data-go="${it.id}" data-p='${it.p ? JSON.stringify(it.p) : ''}'><span class="li-ic" style="background:var(--s${n});color:var(--s${n}i)">${ICONS[it.ic]}</span><span class="grow"><span class="t">${it.t}</span><br><span class="d">${it.d}</span></span></button><button type="button" class="pin" data-pin="${k}" aria-label="${esc(it.t)} 자주 하는 연습에 넣기" aria-pressed="false">${ICONS.star}</button></div>`; }
function suggestToday() {
  if (!DB.sessions.length) return { id: 'basics', t: '소리 내기 안내부터 보기' };
  if (!DB.badges.sound1) return { id: 'firstsound', t: '첫 소리 내기 도우미' };
  const nf = nextFirstSong(); if (nf && DB.sessions.length < 40) { const s = getSong(nf); if (s) return { id: 'follow', p: { id: nf }, t: `오늘의 첫 곡: ${s.t}` }; }
  const cycle = [{ id: 'longtone', t: '오늘의 추천: 롱톤 10초 도전' }, { id: 'scale', t: '오늘의 추천: 음계 오르내리기' }, { id: 'songs', p: { mode: 'follow' }, t: '오늘의 추천: 곡 따라 불기' }, { id: 'match', t: '오늘의 추천: 음 맞추기 10문제' }];
  const d = new Date(); return cycle[(d.getDate() + d.getMonth()) % cycle.length];
}

    };

      if (e.target.checked) unMic = withMic($('#liveBox', el), () => { unSub = Mic.sub(fr => { pm.setLive(fr.voiced && PIPES.includes(fr.midi) ? fr.midi : null, fr.cents); }); });
      else { if (unMic) unMic(); if (unSub) unSub(); unMic = unSub = null; pm.setLive(null); Mic.release(300); }
    };
    return () => { if (playing) playing.cancel = true; if (unMic) unMic(); if (unSub) unSub(); };
  }
});

defScreen('tuner', {

  help: `<p>관을 불면 가장 가까운 음과, 그 음보다 얼마나 높거나 낮은지(센트)를 보여 드려요. 바늘이 가운데 초록 칸에 오면 음이 맞은 거예요.</p><p>아래 관 줄에서 관을 누르면 그 음을 목표 음으로 정하고 소리를 들려 드려요. 같은 관을 한 번 더 누르면 목표 음을 지워요. 길게 분 음은 ‘기록’의 ‘내 음정 습관’에 모여요.</p><ul><li><b>기준음</b>을 켜면 목표 음을 낮은 소리로 계속 울려 줘요. 그 소리에 귀를 맞추며 불어 보세요.</li><li>아래 <b>소리 맑기</b> 칸은 바람 새는 소리가 얼마나 섞였는지 알려 줘요. ‘맑아요’가 나오도록 입술 모양을 다듬어 보세요.</li></ul>`,
  render(el) {

      <div class="pf-bot"><div class="tn-tgt" id="tTgt"></div><div class="pm-row" id="tPm"></div></div>`;
    const g = $('svg.gauge', el), nEl = $('#tNote', el), oEl = $('#tOct', el), sEl = $('#tSub', el), hEl = $('#tHint', el), tg = $('#tTgt', el);
    trace = Trace($('#tTrace', el));
    pm = PipeMap($('#tPm', el), { fit: true, onTap: m => { setTarget(target === m ? 0 : m); if (target) playTone(target, 1.2); } });
    function paintTgt() {
      tg.innerHTML = target ? `<span class="grow small"><span class="muted">목표</span> <b>${esc(nFull(target))}</b></span><button type="button" class="btn sm${Drone.on() ? ' primary' : ''}" id="tDrone" aria-pressed="${Drone.on()}">기준음 ${Drone.on() ? '켬' : '끔'}</button><button type="button" class="btn sm" id="tHear">${ICONS.ear}듣기</button><button type="button" class="btn sm ghost" id="tClr">지우기</button>` : `<span class="grow small muted">관을 누르면 목표 음으로 정해요</span>`;
      const hr = $('#tHear', tg); if (hr) hr.onclick = () => playTone(target, 1.5);
      const dr = $('#tDrone', tg); if (dr) dr.onclick = () => { Drone.set(!Drone.on()); paintTgt(); toast(Drone.on() ? '목표 음을 낮게 계속 울려요. 그 소리에 맞춰 불어 보세요' : '기준음을 껐어요'); };
      const cl = $('#tClr', tg); if (cl) cl.onclick = () => setTarget(0);
      pm.setTarget(target || null);

    function setTarget(m) { target = m; setPref('tunerTarget', m); TGT.m = m; paintTgt(); }
    TGT.m = target; paintTgt();
    let shownM = 0, cand = 0, candN = 0, holdM = 0, holdC = [], lastV = 0;

      });
    });
    return () => { unMic(); if (unSub) unSub(); if (trace) trace.destroy(); };
  }
});

defScreen('latency', {
  title: '소리 지연 맞추기',
  help: `<p>폰은 소리를 내고, 내가 듣고, 다시 마이크로 듣는 데 시간이 걸려요. 이 시간을 재 두면 텅잉·박자 판정과 반주 녹음이 정확해져요.</p><ul><li><b>불어서 재기</b>: ‘틱’ 소리에 맞춰 ‘투’ 하고 16번 불어요. 이어폰(블루투스 포함)으로 들을 때도 쓸 수 있고, 0.5초 가까이 늦어도 잴 수 있어요.</li><li><b>자동으로 재기</b>: 폰 스피커 소리를 마이크로 다시 들어 재요. 스피커로 들을 때만 쓰세요.</li><li>값은 <b>듣는 장치</b>마다 따로 저장돼요. 이어폰을 바꿔 끼면 장치를 먼저 고르세요.</li></ul>`,
  render(el) {
    let unMic = null, unOn = null, unSub = null, tk = null, timer = 0;
    const cur = () => { const o = curOut(); return typeof o.lat === 'number' ? `${Math.round(o.lat * 1000)}ms (측정함)` : `${Math.round(latencySec() * 1000)}ms (추정값)`; };
    const unHook = onOut(() => render());
    function render() {
      stopAll();
      el.innerHTML = `<div class="outrow"><span>듣는 장치</span>${outBtnHTML(1)}</div>
        <div class="card mt"><span class="label">입력 마이크</span>${micSelHTML()}</div>
        <div class="card center mt"><div class="small muted">‘${esc(curOut().name)}’ 소리 지연</div><div id="lCur" style="font-family:var(--serif);font-size:2.2rem">${cur()}</div></div>
        <div class="card mt"><b>불어서 재기 (추천)</b><p class="small muted" style="margin:6px 0 0">평소 연습할 때와 같은 이어폰으로 들으면서, 화면은 보지 말고 ‘틱’ 소리에만 맞춰 팬플룻으로 ‘투’ 하고 16번 불어 주세요. 처음 4번은 준비 소리예요.</p><button class="btn primary wide mt" id="lMan">${ICONS.tongue}불어서 재기</button></div>
        <div class="card mt"><b>자동으로 재기 (스피커로 들을 때만)</b><p class="small muted" style="margin:6px 0 0">폰 스피커에서 ‘틱’ 소리를 8번 내고 마이크로 다시 들어 잽니다. 이어폰은 빼고 소리를 크게 해 주세요.</p><button class="btn wide mt" id="lAuto">${ICONS.sound}자동으로 재기</button></div>
        <div id="lRun"></div>
        <button class="btn ghost wide mt" id="lReset">이 장치의 측정값 지우기</button>`;
      fillMicSel($('[data-micsel]', el));
      $('#lAuto', el).onclick = () => run('auto'); $('#lMan', el).onclick = () => run('manual');
      $('#lReset', el).onclick = () => { const o = curOut(); o.lat = null; o.rep = null; if (o.id === S().outs[0].id) S().latency = null; saveDB(); render(); toast('측정값을 지웠어요'); };
    }
    function stopAll() { if (tk) tk.stop(); tk = null; if (unOn) unOn(); if (unSub) unSub(); unOn = unSub = null; clearTimeout(timer); }
    function run(mode) {
      stopAll(); const box = $('#lRun', el); box.innerHTML = ''; if (unMic) unMic();
      unMic = withMic(box, () => {
        const auto = mode === 'auto', N = auto ? 8 : 16, PRE = auto ? 0 : 4, bpm = auto ? 100 : 80, I = 60 / bpm;
        box.innerHTML = `<div class="card mt center"><div class="spin"></div><div id="lMsg">${auto ? '틱 소리를 내고 있어요. 조용히 기다려 주세요…' : '준비 소리 4번 뒤에, ‘틱’에 맞춰 ‘투’ 하고 불어 주세요'}</div><div class="small muted" id="lCnt" style="min-height:1.4em"></div></div>`;
        const clicks = [], ons = [];
        if (auto) unOn = Mic.onOnset(t => ons.push(t));
        else { const filt = OnsetPitchFilter(t => { ons.push(t); const c = $('#lCnt', el); if (c) c.textContent = `${ons.length}번 들었어요`; }); unOn = Mic.onOnset(t => filt.onset(t)); unSub = Mic.sub(fr => filt.frame(fr)); }
        tk = new Ticker({ bpm, beats: 4, vol: auto ? 1.6 : 1, onSched: ev => { if (ev.idx >= PRE && ev.idx < PRE + N) clicks.push(ev.time); if (ev.idx >= PRE + N - 1) tk.sound = false; }, onBeat: ev => { const c = $('#lCnt', el); if (c && !auto && ev.idx < PRE) c.textContent = `준비 ${PRE - ev.idx}`; else if (c && !auto && ev.idx === PRE && !ons.length) c.textContent = ''; } });
        tk.start();
        timer = setTimeout(() => {
          stopAll(); const msg = $('#lMsg', el), spn = $('.spin', box); if (spn) spn.remove();

function scaleSeq(t, lo, hi, pat, dir) {
  const D = playDegs(t); let up = [], dn = [];
  if (pat === 'step') { for (let d = lo; d <= hi; d++) up.push(d); dn = up.slice().reverse(); }
  else if (pat === 'third') { for (let d = lo; d + 2 <= hi; d++) up.push(d, d + 2); for (let d = hi; d - 2 >= lo; d--) dn.push(d, d - 2); }
  else { up = [0, 2, 4, 7, 9, 11, 14, 16, 18, 21].map(k => lo + k).filter(d => d <= hi); dn = up.slice().reverse(); }
  const ds = dir === 'up' ? up : dir === 'down' ? dn : up.concat(dn.slice(1));
  return ds.filter(d => D.includes(d)).map(d => degNote(t, d));
}

        if (syl !== 'free') { r.ok = r.hard === SYLT[syl].hard; st.n++; if (r.ok) st.atkOk++; }
        st.recs.push(r); if (st.recs.length > 40) st.recs.shift(); paintKv();
      };
      const filt = OnsetPitchFilter(t => {
        const per = 60 / tk.bpm / sub; const ta = t - lat; let best = null, bd = 9;
        for (const e of expected) { const d = ta - e.t; if (Math.abs(d) < Math.abs(bd)) { bd = d; best = e; } }
        if (best && Math.abs(bd) <= per / 2) {
          best.hit = true; const ms = bd * 1000; let col;
          if (Math.abs(ms) <= 50) { st.ex++; col = 'var(--jade)'; say('good', '정확해요!'); } else if (Math.abs(ms) <= 100) { st.good++; col = 'var(--bamboo)'; say('good', '좋아요'); } else if (ms < 0) { st.early++; col = 'var(--cool)'; say('low', `빨라요 · ${Math.round(-ms)}ms 일찍`); } else { st.late++; col = 'var(--warm)'; say('high', `늦어요 · ${Math.round(ms)}ms 늦게`); }
          const dot = document.createElement('i'); dot.className = 'hit'; dot.style.left = (50 + clamp(ms / 150, -1, 1) * 45) + '%'; dot.style.background = col; dot.style.top = (20 + Math.random() * 60) + '%';
          lane.appendChild(dot); requestAnimationFrame(() => dot.style.opacity = 0.15); setTimeout(() => dot.remove(), 6000);
        }
        finishRec({ t });
      });
      unOn = Mic.onOnset(t => filt.onset(t));
      unSub = Mic.sub(fr => {
        filt.frame(fr);
        const per = 60 / tk.bpm / sub; while (expected.length && expected[0].t < fr.t - lat - per) expected.shift();
      });
    }
    function stop() {
      running = false; if (tk) tk.stop(); tk = null; if (unSub) unSub(); if (unOn) unOn(); if (unAtk) unAtk(); unSub = unOn = unAtk = null;
      btn.className = 'btn primary big wide'; btn.innerHTML = ICONS.play + '다시 시작';
      $$('#tgBeats i', el).forEach(d => d.classList.remove('on'));
      const n = st.ex + st.good + st.early + st.late; if (n) { sessionNote(`${syl === 'free' ? '' : SYL_OPTS.find(x => x[0] === syl)[1] + ' '}정확 ${st.ex}/${n}, ${bpm}`); say('', `정확 ${st.ex} · 좋음 ${st.good} · 빠름 ${st.early} · 늦음 ${st.late}`); }
    }
    return () => { stop(); if (unMic) unMic(); };
  }
});
