defScreen('leap', {
  title: '관 건너뛰기', practice: 'leap', wake: true, fit: true, drone: true,
  help: `<p>두 음을 차례로 불어요. 첫 음을 맞힌 뒤 두 번째 관으로 얼마나 빨리, 정확하게 옮기는지 재요.</p><ul><li>2도는 바로 옆 관, 8도(옥타브)는 같은 이름의 높거나 낮은 음이에요.</li><li><b>섞어서</b>는 2도부터 8도까지 골고루, 위아래로 섞어 나와요.</li><li>머리는 그대로 두고 손으로 팬플룻을 옮기세요. 1초 안쪽으로 옮기면 곡을 불 때도 끊기지 않아요.</li></ul>`,
  render(el) {
    let gap = pref('lpGap2', 'mix'), N = 10;
    let unMic = null, unSub = null, unOn = null, judge = null;
    const optTxt = () => `키 ${keyTxt(exKey())} · ${gap === 'mix' ? '섞어서 (2~8도)' : (+gap + 1) + '도'}`;
    function setup() {
      optsSheet('관 건너뛰기 설정', `<div class="ctl-row">${stepCtlHTML('lpKey', '키', keyTxt(exKey()))}</div>
        <div><span class="label">건너뛰는 거리</span><div class="chips" id="lpG" style="flex-wrap:wrap">${[1, 2, 3, 4, 5, 6, 7].map(g => `<button class="chip ${String(g) === gap ? 'on' : ''}" data-g="${g}">${g + 1}도</button>`).join('')}<button class="chip ${gap === 'mix' ? 'on' : ''}" data-g="mix">섞어서 (2~8도)</button></div></div>
        <p class="small muted" style="margin:0">머리는 그대로 두고 손으로 팬플룻을 옮기세요. 관 번호를 손이 기억하도록 천천히 반복해 보세요.</p>`, (sh, mark) => {
        keyCtl(sh, 'lpKey', mark);
        $('#lpG', sh).addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; gap = b.dataset.g; setPref('lpGap2', gap); mark(); $$('#lpG .chip', sh).forEach(c => c.classList.toggle('on', c === b)); });
      }, el, run);
    }
    function makePairs() {
      const t = exTonic(), D = playDegs(t); const pairs = [];
      for (let k = 0; k < N; k++) {
        const g = gap === 'mix' ? 1 + Math.floor(Math.random() * 7) : +gap;
        const cand = D.filter(a => D.includes(a + g) || D.includes(a - g)); if (!cand.length) continue;
        const a = cand[Math.floor(Math.random() * cand.length)]; const opts = [a + g, a - g].filter(b => D.includes(b)); const b = opts[Math.floor(Math.random() * opts.length)];
        pairs.push([degNote(t, a), degNote(t, b), g]);
      }
      return pairs;
    }
    function run() {
      cleanup(); setOpts(optTxt, setup); const pairs = makePairs(); if (!pairs.length) { toast('이 키에서는 고른 거리로 낼 수 있는 음이 없어요'); el.innerHTML = '<div class="card muted">위의 설정 줄을 눌러 키나 거리를 바꿔 주세요.</div>'; return; }
      const NN = pairs.length; let pi = 0; const res = [];
      el.innerHTML = `<div class="pf-gate" id="lpGate"></div><div class="card target fx pf-main"><div class="q" id="lpQ">첫 음부터 불어 보세요</div>
        <div class="big"><span id="lpA"></span> <span style="color:var(--ink-3);font-size:.6em">→</span> <span id="lpB"></span></div><div class="pno" id="lpP"></div><div class="fb" id="lpFb">&nbsp;</div><div class="dots" id="lpD">${pairs.map(() => '<i></i>').join('')}</div></div>
        <div class="pf-mid">${meterHTML(true)}</div><div class="pf-bot"><div class="pm-row" id="lpPm" data-drop="2"></div></div>`;
      const A = $('#lpA', el), B = $('#lpB', el), P = $('#lpP', el), fb = $('#lpFb', el), meter = $('.meter', el), dots = $$('#lpD i', el);
      const pm = PipeMap($('#lpPm', el), { fit: true, onTap: m => playTone(m, 0.8) });
      setDock(`<button class="btn big grow" id="lpHear">${ICONS.ear}들어 보기</button><button class="btn big grow" id="lpSkip">건너뛰기</button>`);
      $('#lpHear').onclick = () => { const [a, b] = pairs[pi] || pairs[NN - 1]; const c = AudioEng.ensure(); playTone(a, 0.7, c.currentTime + 0.05); playTone(b, 0.9, c.currentTime + 0.85); };
      $('#lpSkip').onclick = () => { if (judge) { judge.skip(); if (judge) judge.skip(); } };
      function ask() {
        if (pi >= NN) return finish();
        const [a, b, g] = pairs[pi]; dots.forEach((d, i) => d.classList.toggle('cur', i === pi));
        A.innerHTML = nHTML(a); B.innerHTML = nHTML(b); A.style.opacity = 1; B.style.opacity = .45;
        P.textContent = `${g + 1}도 ${b > a ? '위로' : '아래로'} · ${pipeInfo(a)} → ${pipeInfo(b)}`; pm.setTarget([pipeFor(a), pipeFor(b)].filter(Boolean)); $('#lpQ', el).textContent = '첫 음부터 불어 보세요'; fb.className = 'fb'; fb.innerHTML = '&nbsp;';
        let cA = null, skipped = false;
        judge = new WaitJudge({ targets: [{ m: a }, { m: b }], holdMs: 220,
          onHit: (i, c) => { if (c === null) skipped = true; if (i === 0) { cA = c; A.style.opacity = .45; B.style.opacity = 1; pm.setTarget([pipeFor(b)].filter(Boolean)); $('#lpQ', el).textContent = '이제 두 번째 음!'; } },
          onDone: s => {
            const sw = skipped ? null : Math.max(0.05, (s[1].ms - 220) / 1000);
            res.push({ a, b, g, cA, cB: s[1] ? s[1].c : null, sw, skipped });
            dots[pi].classList.remove('cur'); dots[pi].classList.add(skipped ? 'skip' : 'ok');
            if (!skipped) { chime(); fb.className = 'fb good'; fb.textContent = `옮기는 데 ${sw.toFixed(1)}초`; }
            pi++; judge = null; setTimeout(ask, skipped ? 200 : 900);
          },
          onWrong: (w, t) => { fb.className = 'fb ' + (w < t ? 'low' : 'high'); fb.textContent = wrongMsg(w, t); } });
      }
      unMic = withMic($('#lpGate', el), () => {
        unOn = Mic.onOnset(() => judge && judge.onset());
        unSub = Mic.sub(fr => { if (judge) judge.feed(fr); meterTo(meter, fr); pm.setLive(fr.voiced && PIPES.includes(fr.midi) ? fr.midi : null, fr.cents); });
        ask();
      });
      function finish() {
        cleanup(); setDock(`<button class="btn primary big wide" id="lpAgain">${ICONS.refresh}한 번 더</button>`).querySelector('#lpAgain').onclick = run;
        const ok = res.filter(r => !r.skipped);
        const byG = {}; ok.forEach(r => { (byG[r.g + 1] = byG[r.g + 1] || []).push(r.sw); });
        sessionNote(`${ok.length}/${NN}, 평균 ${ok.length ? mean(ok.map(r => r.sw)).toFixed(1) : '-'}초`);
        resultSheet('관 건너뛰기 결과', `<div class="result"><div class="score">${ok.length} / ${NN}</div>
          <div class="kv"><div><b>${ok.length ? mean(ok.map(r => r.sw)).toFixed(1) + '초' : '-'}</b><span>평균 옮기는 시간</span></div><div><b>${ok.length ? '±' + mean(ok.map(r => Math.abs(r.cB || 0))).toFixed(0) : '-'}</b><span>두 번째 음 오차(센트)</span></div></div>
          ${Object.keys(byG).length > 1 ? `<div class="list mt">${Object.keys(byG).sort((a, b) => a - b).map(k => `<div class="li" style="min-height:40px;padding:6px 14px"><span class="grow">${k}도</span><span class="small muted">${byG[k].length}번 · 평균 ${mean(byG[k]).toFixed(1)}초</span></div>`).join('')}</div>` : ''}
          <p class="small muted">1초 안쪽으로 옮기면 곡을 불 때도 끊기지 않아요.</p></div>`, [{ id: 'set', label: '설정 바꾸기' }, { id: 'again', label: '한 번 더', primary: true }], id => id === 'again' ? run() : setup());
      }
    }
    function cleanup() { if (unMic) unMic(); if (unSub) unSub(); if (unOn) unOn(); unMic = unSub = unOn = null; judge = null; }
    run();
    return cleanup;
  }
});

    function stop() { if (tk) tk.stop(); tk = null; btn.className = 'btn primary big wide'; btn.innerHTML = ICONS.play + '시작'; $$('#mtBeats i', el).forEach(d => d.classList.remove('on')); }
    render();
    return () => { stop(); clearTimeout(holdT); clearInterval(holdI); };
  }

function legatoPlan(size, t, lo, hi, dir) {
  const rng = (a, b) => { const r = []; const st = a <= b ? 1 : -1; for (let d = a; st > 0 ? d <= b : d >= b; d += st) r.push(d); return r; };

  const groups = dir === 'up' ? ups : dir === 'down' ? dns : ups.concat(dns);

  return { notes, slurs, gOf, gFirst };
}

const ARTIC_KINDS = [['s', '스타카토'], ['t', '테누토'], ['>', '악센트'], ['n', '논레가토'], ['l', '레가토'], ['mix', '섞어서']];
const ARTIC_TIP = { s: '점이 붙은 음은 음 길이의 절반 이하로 짧게 끊어요', t: '가로줄 음은 길이를 끝까지 채우고, 음마다 혀로 새로 시작해요', '>': '꺾쇠(>) 음만 앞뒤 음보다 확실히 세게 시작해요', n: 'non leg.: 음마다 혀로 시작하고, 다음 음 앞에 아주 짧은 틈을 둬요', l: '이음줄로 묶인 음 사이를 끊지 않고 한 숨에 이어요', mix: '마디마다 다른 기호가 나와요. 기호를 보고 바꿔 불어요' };
function articDrill(kind, mel, t) {

/* ================= 부점 리듬 (앞부점·뒷부점, 음계로 오르내리기) ================= */
const DOT_RH = [['f8', '앞 ♪.♬'], ['b8', '뒤 ♬♪.'], ['f4', '앞 ♩.♪'], ['b4', '뒤 ♪♩.']];
const DOT_NAME = { f8: '앞부점 ♪.♬ (¾ + ¼박)', b8: '뒷부점 ♬♪. (¼ + ¾박)', f4: '앞부점 ♩.♪ (1½ + ½박)', b4: '뒷부점 ♪♩. (½ + 1½박)' };
function dotPlan(rh, mel, t) {
  const r = { f8: [.75, .25], b8: [.25, .75], f4: [1.5, .5], b4: [.5, 1.5] }[rh] || [.75, .25];
  let ds = mel === 'one' ? Array(16).fill(0) : mel === 'step' ? [0, 1, 2, 3, 4, 5, 6, 7, 7, 6, 5, 4, 3, 2, 1, 0] : [0, 2, 1, 3, 2, 4, 3, 5, 4, 6, 5, 7, 7, 5, 6, 4, 5, 3, 4, 2, 3, 1, 2, 0];
  const D = playDegs(t); ds = ds.map(d => D.includes(d) ? d : 0);
  return ds.map((d, i) => ({ m: degNote(t, d), d: r[i % 2] }));
}

const IC_PAUSE = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
const BkDB = {
  db: null,
  open() {

  },
  put(s, v) { return this.tx(s, 'readwrite', st => st.put(v)); },

const BkCache = { id: null, buf: null, sp: {} };

/* 음 높이는 그대로 두고 빠르기만 바꾸기 (WSOLA: 비슷한 파형끼리 겹쳐 이어 붙임) */
async function timeStretch(buf, sp, onProg) {
  const sr = buf.sampleRate, chN = buf.numberOfChannels, len = buf.length;
  const N = Math.round(sr * 0.048) & ~1, H = N >> 1, tol = Math.round(sr * 0.012);
  const inp = []; for (let c = 0; c < chN; c++) inp.push(buf.getChannelData(c));
  let mono = inp[0]; if (chN > 1) { mono = new Float32Array(len); for (let c = 0; c < chN; c++) { const x = inp[c]; for (let i = 0; i < len; i++) mono[i] += x[i]; } }
  const outLen = Math.ceil(len / sp) + N; const out = []; for (let c = 0; c < chN; c++) out.push(new Float32Array(outLen));
  const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
  const corr = (a, b, L, st) => { let s = 0; for (let i = 0; i < L; i += st) s += mono[a + i] * mono[b + i]; return s; };
  let prev = 0, op = 0, k = 0;
  while (true) {
    const ideal = Math.round(k * H * sp); if (ideal + N + tol >= len || op + N >= outLen) break;
    let ip = ideal;
    if (k > 0) {
      const nat = prev + H; const lo = Math.max(-tol, -ideal), hi = Math.min(tol, len - N - ideal - 1);
      if (nat + H < len) {
        let best = 0, bv = -Infinity;
        for (let d = lo; d <= hi; d += 8) { const v = corr(nat, ideal + d, H, 4); if (v > bv) { bv = v; best = d; } }
        const c0 = best; bv = -Infinity;
        for (let d = Math.max(lo, c0 - 7); d <= Math.min(hi, c0 + 7); d++) { const v = corr(nat, ideal + d, H, 2); if (v > bv) { bv = v; best = d; } }
        ip = ideal + best;
      }
    }
    for (let c = 0; c < chN; c++) { const x = inp[c], y = out[c]; for (let i = 0; i < N; i++) y[op + i] += x[ip + i] * win[i]; }
    prev = ip; op += H; k++;
    if (k % 300 === 0) { if (onProg) onProg(ideal / len); await new Promise(r => setTimeout(r, 0)); }

/* ----- 섞어 듣기 (반주 ↔ 내 소리 비율, 박자 맞춤, 섞은 파일 내려받기) ----- */
defScreen('bkmix', {
  title: '섞어 듣기', practice: 'backing', wake: true, fit: true,
  help: `<ul><li><b>비율 막대</b>를 왼쪽으로 옮기면 반주가, 오른쪽으로 옮기면 내 소리가 커져요.</li><li>내 소리가 반주보다 늦게 들리면 <b>박자 맞춤</b>을 −로, 일찍 들리면 +로 조절하세요. 10ms씩 바뀌고 길게 누르면 빨리 바뀌어요. 같은 이어폰에서 자주 어긋나면 설정에서 소리 지연을 다시 재 주세요.</li><li><b>섞은 파일</b>은 지금 비율과 박자 맞춤으로 섞어서 WAV 파일로 내려받아요.</li><li>그래프는 내 음정이에요. 선이 계단처럼 고르게 이어지면 음이 안정된 거예요.</li></ul>`,
  render(el, p) {
    const B = bkData(), tk = B.takes.find(x => x.id === p.id), tr = tk && B.tracks.find(x => x.id === tk.trackId);

    el.innerHTML = `<div class="card fx col" style="gap:8px;padding:10px 12px">
        <div class="row between small" style="gap:8px"><b class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tr.name)}</b><span class="muted" style="white-space:nowrap">${bkTakeDate(tk.t)} · ${Math.round(tk.speed * 100)}%</span></div>
        <canvas class="trace fx" id="bmTr" style="height:100%;min-height:64px"></canvas>
        <div class="bp-bar" id="bmBar"><div class="fill" id="bmFill"></div><i id="bmHead"></i></div>
        <div class="row between small"><b id="bmT">0:00</b><span class="muted" id="bmMsg">불러오는 중…</span><span class="muted">${fmtSec(tk.dur)}</span></div></div>
      <div class="card col" style="gap:4px;padding:10px 14px"><div class="row between small"><b>반주</b><span class="muted" id="bmBalT">${balTxt(tk.bal)}</span><b>내 소리</b></div><input type="range" min="0" max="100" step="1" value="${tk.bal}" id="bmBal" style="width:100%"></div>
      <div class="ctl-row">${stepCtlHTML('bmSy', '박자 맞춤', syncTxt(tk.sync))}</div>

    const cv = $('#bmTr', el), bar = $('#bmBar', el), fill = $('#bmFill', el), head = $('#bmHead', el), T = $('#bmT', el), msg = $('#bmMsg', el);

    function curPos() { return playing ? Math.min(tk.dur, p0 + Math.max(0, ctx.currentTime - t0c)) : pos; }

    const loop = () => { if (!alive) return; raf = requestAnimationFrame(loop); const x = curPos(), f = tk.dur ? clamp(x / tk.dur * 100, 0, 100) : 0; fill.style.width = f + '%'; head.style.left = f + '%'; T.textContent = fmtSec(x); if (playing) drawG(); };
    function stopAll() { [bs, vs].forEach(s => { if (s) { s.onended = null; try { s.stop(); } catch (e) { } try { s.disconnect(); } catch (e) { } } }); bs = vs = null; }

    }

    $('#bmBeg', el).onclick = () => seek(0);
    $('#bmDl', el).onclick = async e => {

/* ================= 녹음 저장소 (폰 안에만 저장) ================= */
const RecDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('저장 공간을 쓸 수 없어요'));
      const r = indexedDB.open('nanjang_rec', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('recs', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('recs', mode); const st = t.objectStore('recs'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); },
  async all() { const r = await this.tx('readonly', st => st.getAll()); return (r || []).sort((a, b) => b.t - a.t); },
  put(rec) { return this.tx('readwrite', st => st.put(rec)); },
  del(id) { return this.tx('readwrite', st => st.delete(id)); }
};
function drawRecGraph(cv, rec, playT) {
  const dpr = window.devicePixelRatio || 1; const r = cv.getBoundingClientRect(); cv.width = Math.max(10, r.width * dpr); cv.height = Math.max(10, r.height * dpr);
  const g = cv.getContext('2d'); const w = cv.width, h = cv.height; const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  g.clearRect(0, 0, w, h);
  const vs = rec.trace.filter(p => p[1] > 0).map(p => p[1]);
  if (!vs.length) { g.fillStyle = css('--ink-3'); g.font = `${13 * dpr}px sans-serif`; g.fillText('음정이 기록되지 않았어요', 10 * dpr, h / 2); return; }
  let lo = Math.floor(Math.min(...vs)) - 1, hi = Math.ceil(Math.max(...vs)) + 1; if (hi - lo < 5) { const c = (hi + lo) / 2; lo = Math.floor(c - 2.5); hi = Math.ceil(c + 2.5); }
  const y = m => h - 6 * dpr - (m - lo) / (hi - lo) * (h - 12 * dpr); const L = 30 * dpr;
  g.font = `${11 * dpr}px sans-serif`; g.textBaseline = 'middle';
  for (let m = lo; m <= hi; m++) { if (!PIPES.includes(m)) continue; g.strokeStyle = css('--line'); g.lineWidth = 1; g.beginPath(); g.moveTo(L, y(m)); g.lineTo(w, y(m)); g.stroke(); g.fillStyle = css('--ink-2'); g.fillText(KO[pc(m)] + (octOf(m) > 5 ? '↑' : octOf(m) < 5 ? '↓' : ''), 4 * dpr, y(m)); }
  const dur = Math.max(0.5, rec.dur);
  for (const [t, m] of rec.trace) { if (!m) continue; const c = (m - Math.round(m)) * 100; g.fillStyle = Math.abs(c) <= S().tol ? css('--jade') : c > 0 ? css('--warm') : css('--cool'); g.fillRect(L + t / dur * (w - L) - dpr, y(m) - 1.5 * dpr, 2.5 * dpr, 3 * dpr); }
  if (playT != null) { const x = L + playT / dur * (w - L); g.strokeStyle = css('--peony'); g.lineWidth = 2 * dpr; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
}

/* 마이크 감도: 소음 기준값(0.0015~0.03)을 0~100 눈금으로 (오른쪽일수록 예민) */
const NZ_LO = 0.0015, NZ_HI = 0.03;
function sensOf(nz) { return Math.round(100 * (1 - Math.log(clamp(nz, NZ_LO, NZ_HI) / NZ_LO) / Math.log(NZ_HI / NZ_LO))); }
function noiseOf(v) { return +(NZ_LO * Math.pow(NZ_HI / NZ_LO, 1 - clamp(v, 0, 100) / 100)).toFixed(4); }
function noiseTxt() { const n = S().noise, at = S().noiseAt; const d = at ? new Date(at) : null; return `${n > 0.015 ? '시끄러운 곳' : n > 0.006 ? '보통' : '조용한 곳'} · 감도 ${sensOf(n)}${d ? ` (${d.getMonth() + 1}/${d.getDate()} 맞춤)` : ''}`; }

/* ================= 오늘의 연습 순서 (설정 → 추가 기능에서 켤 때만) =================
   정해 둔 연습을 차례로 열어 주고, 시간이 되면 알려 주기만 함 (넘어갈지는 사용자가 정함) */
const ROUTINE_DEF = [{ k: 'longtone', m: 3 }, { k: 'scale', m: 3 }, { k: 'match', m: 3 }, { k: 'songs:follow', m: 5 }];
const allItems = () => STAGES.flatMap(sg => sg.items);
const itemByKey = k => allItems().find(it => itemKey(it) === k);
function routineList() { const v = pref('routine', null); const L = Array.isArray(v) ? v.filter(x => x && itemByKey(x.k)) : []; return L.length ? L : ROUTINE_DEF; }
function routineTxt() { return routineList().map(x => `${itemByKey(x.k).t} ${x.m}분`).join(' → '); }
const Routine = {
  on: false, i: 0, t0: 0, timer: 0, rang: false,
  list: null, course: false,
  L() { return this.list || routineList(); },
  itemOf(st) { return st && st.id ? st : st ? itemByKey(st.k) : null; },
  start() { this.on = true; this.i = 0; this.begin(); },
  begin() { const L = this.L(); if (this.i >= L.length) { this.finish(); return; } const it = this.itemOf(L[this.i]); this.t0 = Date.now(); this.rang = false; go(it.id, it.p || {}); clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 1000); this.paint(); },
  left() { const st = this.L()[this.i]; return st ? st.m * 60 - (Date.now() - this.t0) / 1000 : 0; },
  tick() { if (!this.on) return; if (this.left() <= 0 && !this.rang) { this.rang = true; chime(true); const nx = this.L()[this.i + 1]; toast(nx ? `${this.L()[this.i].m}분이 지났어요. 다음은 ‘${this.itemOf(nx).t}’예요. 위의 ‘다음’을 누르면 넘어가요` : '마지막 연습 시간이 다 됐어요. 수고하셨어요!', 4500); } this.paint(); },
  next() { this.i++; this.begin(); },
  finish() { const c = this.course; this.stop(); chime(true); toast(c ? '오늘의 5분 코스를 마쳤어요. 수고하셨어요!' : '오늘의 연습 순서를 모두 마쳤어요. 수고하셨어요!', 4000); if (c) award('course'); },
  stop() { this.on = false; clearInterval(this.timer); this.list = null; this.course = false; this.paint(); },
  paint() {

      $$('[data-pref]', el).forEach(c => c.onchange = () => { setPref(c.dataset.pref, c.checked); toast(`${c.closest('.row').querySelector('b').textContent}: ${c.checked ? '켰어요' : '껐어요'}`); });
      $$('[data-feat]', el).forEach(c => c.onchange = () => { setPref('feat_' + c.dataset.feat, c.checked); if (c.dataset.feat === 'routine' && !c.checked) Routine.stop(); render(); });
      bindSeg(el, 'goal', v => setPref('goalMin', +v));
      const rt = $('#stRt', el); if (rt) rt.onclick = () => routineSheet(() => render());
      PipeMap($('#stPrev', el), { compact: true, onTap: m => playTone(m, 0.8) });
      fillMicSel($('[data-micsel]', el));
      const oc = $('#stOut', el);
      const drawOut = () => {
        const o = curOut(), base = o.id === S().outs[0].id;
        oc.innerHTML = `<p class="small muted" style="margin:0">블루투스 이어폰은 소리가 보통 0.1~0.3초 늦게 들려요. 장치마다 소리 지연을 따로 저장하니, 이어폰을 바꿔 낄 때는 장치만 고르면 돼요.</p>${outListHTML()}
          <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn sm" id="oAdd">${ICONS.plus}장치 추가</button><button class="btn sm" id="oRen">이름 바꾸기</button>${base ? '' : '<button class="btn sm ghost" id="oDel">삭제</button>'}</div>
          <div class="row"><span class="grow"><b>소리 지연</b><div class="tiny muted">${typeof o.lat === 'number' ? Math.round(o.lat * 1000) + 'ms (측정함)' : Math.round(latencySec() * 1000) + 'ms (추정값, 재 두면 정확해져요)'}</div></span><button class="btn sm" data-go="latency">재기</button></div>
          <div class="row"><span class="grow"><b>화면 늦춤 ${visOf(o)}ms${o.vis == null ? ' (자동)' : ''}</b><div class="tiny muted">흐르는 악보와 박 표시를 소리에 맞춰 늦춰요</div></span><button class="btn sm" data-go="sync">화면 맞추기</button></div>
          ${base ? '' : `<div class="row"><span class="grow"><b>블루투스 장치</b><div class="tiny muted">블루투스가 연결되면 이 장치로 바꿔요</div></span><label class="switch"><input type="checkbox" id="oBt" ${o.bt ? 'checked' : ''}><span></span></label></div>`}
          <div class="row"><span class="grow"><b>블루투스 연결 자동 감지</b><div class="tiny muted">마이크를 한 번 허용해야 동작해요</div></span><label class="switch"><input type="checkbox" id="oAu" ${S().autoOut ? 'checked' : ''}><span></span></label></div>`;
        $('.olist', oc).onclick = e => { const r = e.target.closest('[data-oid]'); if (!r) return; if (setOut(r.dataset.oid)) { drawOut(); needCal(); } };
        $('#oAdd', oc).onclick = async () => { const n = await askText('장치 이름', '', '예: 갤럭시 버즈'); if (!n) return; const x = { id: 'o' + uid(), name: n, bt: true, lat: null, rep: null, vis: null }; S().outs.push(x); saveDB(); setOut(x.id); drawOut(); needCal(); };
        $('#oRen', oc).onclick = async () => { const n = await askText('장치 이름', o.name); if (!n) return; o.name = n; saveDB(); drawOut(); drawOutBtns(); };
        const del = $('#oDel', oc); if (del) del.onclick = async () => { if (!(await confirmSheet(`‘${o.name}’ 장치를 지울까요?`, '지우기', true))) return; const id = o.id; setOut(S().outs[0].id); S().outs = S().outs.filter(x => x.id !== id); saveDB(); drawOut(); };
        const bt = $('#oBt', oc); if (bt) bt.onchange = e => { o.bt = e.target.checked; saveDB(); };
        $('#oAu', oc).onchange = e => { S().autoOut = e.target.checked; saveDB(); if (e.target.checked) autoOut(); };
      };
      drawOut();
      const mk = $('#stMk', el), mkT = $('#stMkT', el), lv = $('#stLv i', el); let mtest = null;
      if (mk) mk.onclick = async () => {
        if (mtest) { mtest(); return; }
        const ok = await Mic.acquire(); if (!ok) { toast('마이크를 쓸 수 없어요. 마이크 문제 해결을 봐 주세요', 3500); return; }
        mk.textContent = '확인 끝내기';
        const un = Mic.sub(fr => { if (!document.body.contains(mk)) { if (mtest) mtest(); return; } lv.style.width = Math.min(100, Math.sqrt(fr.rms) * 260) + '%'; mkT.textContent = `${fr.voiced ? '들리는 음: ' + nFull(fr.midi) : '소리를 기다려요'} · 지금 마이크: ${Mic.label || '기본'}`; });
        mtest = () => { un(); Mic.release(300); mtest = null; if (document.body.contains(mk)) { mk.textContent = '마이크 확인'; lv.style.width = '0'; mkT.textContent = '마이크 확인을 누르고 팬플룻을 불어 보세요'; } };
      };
      const reflute = () => { refreshPipes(); saveDB(); render(); };
      $('#stPm', el).onclick = () => { s.flute.pipes = clamp(s.flute.pipes - 1, 8, 32); reflute(); };
      $('#stPp', el).onclick = () => { s.flute.pipes = clamp(s.flute.pipes + 1, 8, 32); reflute(); };
      bindSeg(el, 'key', v => { s.flute.key = v; if (!inKey(s.flute.low, v)) { let m = s.flute.low; while (!inKey(m, v)) m++; s.flute.low = m; } reflute(); });
      $('#stLow', el).onchange = e => { s.flute.low = +e.target.value; reflute(); };
      bindSeg(el, 'flip', v => { s.flip = v === '1'; saveDB(); render(); });
      bindSeg(el, 'stfr', v => { s.staffReal = v === '1'; saveDB(); });
      bindSeg(el, 'tol', v => { s.tol = +v; saveDB(); });
      $('#stAm', el).onclick = () => { s.a4 = clamp(s.a4 - 1, 430, 450); saveDB(); render(); };
      $('#stAp', el).onclick = () => { s.a4 = clamp(s.a4 + 1, 430, 450); saveDB(); render(); };
      bindSeg(el, 'fs', v => { s.fontScale = +v; saveDB(); applyTheme(); });
      bindSeg(el, 'th', v => { s.theme = v; saveDB(); applyTheme(); });
      bindSeg(el, 'ns', v => { s.noteStyle = v; saveDB(); render(); });
      bindSeg(el, 'smode', v => { setPref('scoreMode', v); toast(v === 'line' ? '악보를 한 줄씩 보여 드려요' : '악보가 흘러가게 보여 드려요'); });
      $('#stNo', el).onchange = e => { s.showPipeNo = e.target.checked; saveDB(); render(); };
      $('#stSv', el).oninput = e => { s.synthVol = +e.target.value; saveDB(); };
      $('#stSt', el).onclick = () => playTone(PIPES.includes(72) ? 72 : PIPES[3], 1);
      $('#stMv', el).oninput = e => { s.metroVol = +e.target.value; saveDB(); };
      $('#stMt', el).onclick = () => { const c = AudioEng.ensure(); tick(c.currentTime + 0.05, true); tick(c.currentTime + 0.55, false); };
      $('#stFs', el).onchange = e => { s.autoFS = e.target.checked; saveDB(); if (!s.autoFS && FS.on()) FS.exit(); };
      $('#stWl', el).onchange = e => { s.wakeLock = e.target.checked; saveDB(); };
      $('#stSens', el).oninput = e => { s.noise = noiseOf(+e.target.value); s.noiseAt = Date.now(); saveDB(); Mic.setGate(); };
      $('#stSens', el).onchange = () => render();
      const inst = $('#stInst', el);
      if (FS.standalone()) inst.innerHTML = '<div class="small muted">지금 홈 화면 앱으로 실행 중이에요.</div>';
      else { inst.innerHTML = `<div class="row wrap" style="gap:8px"><button class="btn primary grow" id="stI">${ICONS.install}홈 화면에 설치하기</button><button class="btn grow" id="stF">${FS.on() ? ICONS.fsOff + '전체화면 끄기' : ICONS.fsOn + '전체화면'}</button></div>`; $('#stI', el).onclick = async () => { await startInstall(); render(); }; $('#stF', el).onclick = async () => { await toggleFS(); render(); }; }
      micStatusText().then(r => { const p = $('#stMic', el); if (p) { p.className = 'status-pill ' + r.cls; p.innerHTML = `<i></i>${r.t}`; } });
    }
    render();
  }
});

/* ================= 시작 ================= */
function initShell() {
  $('#hBack').innerHTML = ICONS.back; $('#hBack').onclick = back;
  $('#hHelp').innerHTML = ICONS.info; $('#hHelp').onclick = showHelp;
  $('#hOpt').onclick = openOpts;
  $('#hSet').innerHTML = ICONS.gear; $('#hSet').onclick = () => go('settings');
  $('#hFS').onclick = () => toggleFS();
  $('#fBack').innerHTML = ICONS.back; $('#fBack').onclick = back;
  $('#fMenu').innerHTML = ICONS.sliders + '<span>메뉴</span>'; $('#fMenu').onclick = openOpts;
  $('#nav').innerHTML = TABS.map(t => `<button data-id="${t.id}">${ICONS[t.icon]}<span>${t.label}</span></button>`).join('');
  $('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.id); });
  FS.paint();
}
applyTheme();
initShell();
runSplash(() => go(S().onboarded ? 'home' : 'onboard'));
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { })); }

</script>
</body>
</html>
