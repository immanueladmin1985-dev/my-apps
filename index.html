<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>내 앱</title>
  <!-- 홈 화면 앱 설정 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="내 앱">
  <meta name="theme-color" content="#2f6fed">
  <style>
    :root { --bg: #f6f7fb; --fg: #1b1f2a; --card: #fff; --accent: #2f6fed; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12141a; --fg: #e8eaf0; --card: #1d2029; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg); color: var(--fg);
      padding: max(24px, env(safe-area-inset-top)) 16px 24px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    .card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .count { font-size: 4rem; font-weight: 700; text-align: center; margin: 12px 0; }
    button {
      width: 100%; padding: 16px; border: 0; border-radius: 12px; font-size: 1.1rem;
      background: var(--accent); color: #fff; margin-top: 8px;
    }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  </style>
</head>
<body>
  <h1>내 첫 홈 화면 앱</h1>
  <div class="card">
    <p>버튼을 누르면 숫자가 올라가고, 앱을 닫아도 기억돼요.</p>
    <div class="count" id="count">0</div>
    <button id="plus">+1</button>
    <button id="reset" class="secondary">초기화</button>
  </div>
  <script>
    const el = document.getElementById('count');
    let n = 0;
    try { n = Number(localStorage.getItem('count')) || 0; } catch (e) {}
    const render = () => { el.textContent = n; try { localStorage.setItem('count', n); } catch (e) {} };
    document.getElementById('plus').onclick = () => { n++; render(); };
    document.getElementById('reset').onclick = () => { n = 0; render(); };
    render();
  </script>
</body>
</html>
