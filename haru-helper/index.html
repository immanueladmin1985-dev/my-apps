<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>하루 도우미</title>
<!-- 홈 화면 앱 설정 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루 도우미">
<meta name="theme-color" content="#f4f3fb">
<style>
:root{
  --bg:#f4f3fb; --bg2:#ebe8fb; --card:#ffffff; --field:#f1f0f8; --text:#1d1b2e; --sub:#727089; --line:#e8e6f2;
  --accent:#5b5bd6; --accent-soft:#ecebfd; --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#c084fc 100%);
  --good:#16a34a; --good-soft:#e3f6e9; --warn:#e5484d; --warn-soft:#fdeced;
  --amber:#c2730a; --amber-soft:#fff1dc; --teal:#0e9aa7; --teal-soft:#dff5f6; --rose:#d9466f; --rose-soft:#fde8ef;
  --sky:#2f80ed; --sky-soft:#e3eefd; --green:#2f9e5b; --green-soft:#e2f5ea; --violet:#7c4ddb; --violet-soft:#efe8fc;
  --shadow:0 1px 2px rgba(40,30,90,.04),0 8px 24px rgba(40,30,90,.07);
  --shadow2:0 10px 30px rgba(91,91,214,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121220; --bg2:#1b1a33; --card:#1c1c2c; --field:#26263a; --text:#efeef8; --sub:#a09eb8; --line:#2d2c42;
    --accent:#9b9bff; --accent-soft:#2a2a4a;
    --good:#4ad07f; --good-soft:#173324; --warn:#ff6b70; --warn-soft:#3a1f25;
    --amber:#f3b14e; --amber-soft:#3a2c17; --teal:#4fd1db; --teal-soft:#15333a; --rose:#ff7b9c; --rose-soft:#3c1d2a;
    --sky:#6aa8ff; --sky-soft:#1a2b45; --green:#5ad08b; --green-soft:#183225; --violet:#b69bff; --violet-soft:#2b2245;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --shadow2:0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121220; --bg2:#1b1a33; --card:#1c1c2c; --field:#26263a; --text:#efeef8; --sub:#a09eb8; --line:#2d2c42;
  --accent:#9b9bff; --accent-soft:#2a2a4a;
  --good:#4ad07f; --good-soft:#173324; --warn:#ff6b70; --warn-soft:#3a1f25;
  --amber:#f3b14e; --amber-soft:#3a2c17; --teal:#4fd1db; --teal-soft:#15333a; --rose:#ff7b9c; --rose-soft:#3c1d2a;
  --sky:#6aa8ff; --sky-soft:#1a2b45; --green:#5ad08b; --green-soft:#183225; --violet:#b69bff; --violet-soft:#2b2245;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow2:0 10px 30px rgba(0,0,0,.4);
}
html{font-size:16px}
html[data-font="1"]{font-size:18px}
html[data-font="2"]{font-size:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);height:100%;overflow:hidden}
body{font-family:"Pretendard","SamsungOneKorean","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;line-height:1.45;letter-spacing:-.01em;
  background:radial-gradient(120% 60% at 50% -10%,var(--bg2) 0%,var(--bg) 60%) fixed}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea{border:1.5px solid transparent;outline:none;background:var(--field);border-radius:14px;padding:.75rem .9rem;width:100%;min-width:0;transition:border-color .15s,background .15s}
input:focus,textarea:focus{border-color:var(--accent);background:var(--card)}
textarea{resize:vertical;min-height:6rem;line-height:1.5}
.hidden{display:none!important}

.app{height:var(--appH,100dvh);display:flex;flex-direction:column}
.hd{flex:none;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 10px 4px 20px;max-width:1040px;width:100%;margin:0 auto}
.hd h1{flex:1;font-size:1.3rem;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--sub);flex:none}
.ibtn:active{background:var(--field)}
.ibtn svg{width:22px;height:22px}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{max-width:1040px;margin:0 auto;padding:6px 16px 28px;display:grid;grid-template-columns:1fr;gap:14px;align-items:start;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@media (min-width:760px){ .view{grid-template-columns:1fr 1fr} .view > .wide{grid-column:1 / -1} }

.card{background:var(--card);border-radius:24px;padding:16px 18px 18px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ch h2{flex:1;font-size:1.02rem;font-weight:800;letter-spacing:-.02em}
.ch h2 small{font-size:.78rem;color:var(--sub);font-weight:700;margin-left:4px}
.ch .link{font-size:.82rem;font-weight:800;color:var(--accent);padding:6px 10px;border-radius:10px;background:var(--accent-soft)}
.ico{width:2.2rem;height:2.2rem;border-radius:12px;display:grid;place-items:center;font-size:1.1rem;flex:none;background:var(--accent-soft)}
.c-indigo{background:var(--accent-soft);color:var(--accent)} .c-amber{background:var(--amber-soft);color:var(--amber)}
.c-teal{background:var(--teal-soft);color:var(--teal)} .c-rose{background:var(--rose-soft);color:var(--rose)}
.c-sky{background:var(--sky-soft);color:var(--sky)} .c-green{background:var(--green-soft);color:var(--green)}
.c-violet{background:var(--violet-soft);color:var(--violet)}
.sub{color:var(--sub);font-size:.86rem}
.note{font-size:.8rem;color:var(--sub);margin-top:10px;line-height:1.55}

.row{display:flex;gap:8px;align-items:center}
.row > input{flex:1}
.btn{height:2.85rem;padding:0 1.05rem;border-radius:14px;font-weight:800;font-size:.94rem;background:var(--field);color:var(--text);white-space:nowrap;flex:none;transition:transform .1s,filter .1s}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.3)}
.btn.good{background:var(--good);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.block{width:100%;margin-top:10px}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1 1 auto}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{height:2.4rem;padding:0 .9rem;border-radius:99px;background:var(--field);font-size:.9rem;font-weight:700;white-space:nowrap;transition:background .15s,color .15s}
.chip.on{background:var(--accent);color:#fff}

/* 목록 */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.item .tx small{display:block;color:var(--sub);font-size:.78rem;margin-top:2px;font-weight:500}
.item.done .tx{color:var(--sub);text-decoration:line-through;font-weight:500}
.item.due{background:var(--warn-soft);border-radius:16px;padding:11px 12px;border-top:0;margin:3px 0}
.mini{min-width:2.4rem;height:2.4rem;padding:0 .55rem;border-radius:12px;display:grid;place-items:center;font-size:.85rem;font-weight:800;color:var(--sub);flex:none}
.mini:active{background:var(--field)}
.mini.txt{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.check{width:1.7rem;height:1.7rem;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:.9rem;font-weight:900;transition:background .15s,border-color .15s}
.on > .check, .check.on{background:var(--good);border-color:var(--good)}
.empty{color:var(--sub);font-size:.9rem;padding:6px 0;line-height:1.55}
.more{font-size:.85rem;color:var(--accent);font-weight:800;padding:10px 0 0}

/* 세그먼트 · 아래 탭 */
.seg{display:flex;background:var(--card);border-radius:18px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{flex:1;height:2.6rem;border-radius:14px;font-size:.88rem;font-weight:800;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--grad);color:#fff}
.tabs{flex:none;display:flex;background:var(--card);margin:0 12px calc(8px + env(safe-area-inset-bottom));border-radius:24px;padding:6px;box-shadow:0 -2px 20px rgba(40,30,90,.08),var(--shadow);max-width:560px;width:calc(100% - 24px);align-self:center}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0 5px;border-radius:18px;color:var(--sub);font-size:.72rem;font-weight:800;position:relative;transition:background .2s,color .2s}
.tabs button b{font-size:1.3rem;line-height:1.25;filter:grayscale(1);opacity:.6;transition:filter .2s,opacity .2s,transform .2s}
.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.tabs button.on b{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;padding:0 5px;font-weight:800}

/* 첫 화면 */
.banner{background:var(--card);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);border:1.5px solid var(--accent-soft)}
.banner img{width:44px;height:44px;border-radius:12px;flex:none}
.banner b{display:block;font-size:.92rem}
.banner p{font-size:.78rem;color:var(--sub);margin-top:2px}
.banner .btns{margin-top:10px}
.banner .btn{height:2.3rem;font-size:.82rem;padding:0 .8rem;flex:0 0 auto}
.banner .btn.ghost{background:none;color:var(--sub)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 16px;color:#fff;background:var(--grad);box-shadow:var(--shadow2)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.hero::before{width:180px;height:180px;right:-50px;top:-70px}
.hero::after{width:110px;height:110px;right:60px;bottom:-60px;background:rgba(255,255,255,.09)}
.hero .date{font-size:.85rem;font-weight:700;opacity:.85;position:relative}
.hero .hi{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;margin-top:2px;position:relative}
.stats{display:flex;gap:8px;margin-top:16px;position:relative}
.stats button{flex:1;background:rgba(255,255,255,.18);border-radius:16px;padding:9px 6px;color:#fff;font-size:.76rem;font-weight:700;backdrop-filter:blur(4px)}
.stats b{display:block;font-size:1.35rem;font-weight:800;line-height:1.2}
.capbox{display:flex;gap:8px;align-items:center;background:var(--field);border-radius:16px;padding:4px 4px 4px 14px;border:1.5px solid transparent;transition:border-color .15s,background .15s}
.capbox:focus-within{border-color:var(--accent);background:var(--card)}
.capbox input{background:none;border:0;padding:.7rem 0;font-size:1rem}
.capbox input:focus{background:none}
.capbox .btn{height:2.6rem}
.capto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.capto button{height:2.7rem;border-radius:14px;font-weight:800;font-size:.9rem}
.focus{position:relative;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;padding:16px 64px 16px 16px;background:linear-gradient(135deg,var(--amber-soft),var(--rose-soft));border-radius:18px;overflow-wrap:anywhere;min-height:4.2rem;display:flex;align-items:center}
.focus .done{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:3rem;height:3rem;border-radius:50%;background:var(--good);color:#fff;font-size:1.3rem;font-weight:900;box-shadow:0 6px 14px rgba(22,163,74,.35)}
.focus .done:active{transform:translateY(-50%) scale(.92)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbtn{position:relative;overflow:hidden;border-radius:24px;padding:18px 16px;text-align:left;font-weight:800;font-size:1.02rem;min-height:6.4rem;color:#fff;box-shadow:var(--shadow)}
.qbtn .e{display:block;font-size:1.6rem;margin-bottom:6px}
.qbtn small{display:block;font-weight:600;font-size:.76rem;opacity:.9;margin-top:2px}
.qbtn.mind{background:linear-gradient(135deg,#14b8a6,#0ea5e9)}
.qbtn.talk{background:linear-gradient(135deg,#f59e0b,#f43f5e)}
.qbtn.sos{background:linear-gradient(135deg,#f43f5e,#be123c)}
.qbtn.urge{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
@media (min-width:760px){ .quick.wide{grid-template-columns:repeat(4,1fr)} }
details summary{list-style:none} details summary::-webkit-details-marker{display:none}
.qbtn::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.15);right:-25px;bottom:-35px}
.foot{text-align:center;padding:2px 0 6px}

/* 마음 */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{border-radius:20px;padding:14px;text-align:left;font-weight:800;font-size:.95rem;min-height:6rem;transition:transform .1s}
.tool:active{transform:scale(.97)}
.tool .e{display:block;font-size:1.5rem;margin-bottom:4px}
.tool small{display:block;font-weight:600;font-size:.74rem;opacity:.75;margin-top:2px;color:var(--text)}
.tool.hot{outline:2.5px solid currentColor;animation:glow 1.6s infinite}
@keyframes glow{50%{outline-color:transparent}}
.lv{display:flex;align-items:center;gap:10px;margin-top:14px}
.lv input{flex:1;padding:0;background:none;accent-color:var(--accent);height:2rem;border:0}
.lv b{font-size:1.5rem;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.help{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--teal-soft);color:var(--teal);font-size:.88rem;font-weight:700}
.crisis{font-size:.8rem;color:var(--sub);line-height:1.6;background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.crisis b{color:var(--text)}
.bars{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.bars div{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700}
.bars span{width:4.6rem;flex:none}
.bars i{display:block;height:10px;border-radius:5px;background:var(--grad);min-width:6px}

/* 대화 */
.big{font-size:3.2rem;font-weight:800;text-align:center;letter-spacing:-.03em;line-height:1.1}
.ratio{height:12px;border-radius:6px;background:var(--teal-soft);overflow:hidden;margin:14px 0 6px}
.ratio i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#f43f5e);transition:width .3s;border-radius:6px}
.rl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--sub);font-weight:800}
.talkring{width:min(68vw,250px);aspect-ratio:1;border-radius:50%;margin:18px auto 4px;padding:9px;background:var(--teal-soft)}
.talkbtn{width:100%;height:100%;border-radius:50%;font-size:1.25rem;font-weight:800;background:var(--card);color:var(--teal);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;transition:background .3s,color .3s}
.talkbtn .e{font-size:2.4rem}
.talkbtn small{font-size:.8rem;font-weight:700;opacity:.85}
.talkbtn.me{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff}
.talkbtn.long{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(.97)}}
.tip{background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:12px 14px;font-weight:800;font-size:.92rem;margin-top:14px;text-align:center}
.tips{list-style:none}
.tips li{padding:9px 0 9px 1.9rem;font-size:.9rem;font-weight:600;border-top:1px solid var(--line);position:relative}
.tips li:first-child{border-top:0}
.tips li::before{content:"✓";position:absolute;left:0;top:8px;width:1.35rem;height:1.35rem;border-radius:50%;background:var(--amber-soft);color:var(--amber);font-size:.75rem;font-weight:900;display:grid;place-items:center}

/* 창 */
.idim{position:fixed;inset:0;background:rgba(15,12,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.isheet{background:var(--card);width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
.isheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@media (min-width:600px){ .idim{align-items:center} .isheet{border-radius:28px;padding-top:20px} .isheet::before{display:none} }
.isheet h3{font-size:1.2rem;font-weight:800;margin-bottom:10px;letter-spacing:-.02em}
.isheet p{font-size:.92rem;margin-bottom:8px}
.isheet ol,.isheet ul{margin:6px 0 10px 1.3rem;font-size:.92rem}
.isheet li{margin-bottom:6px}
.isheet label.f{display:block;font-size:.8rem;color:var(--sub);font-weight:800;margin:14px 0 7px}
.kbd{display:inline-block;padding:0 6px;border-radius:6px;background:var(--field);font-weight:800}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.srow > span{flex:1;font-weight:800;font-size:.95rem}
.srow small{display:block;font-weight:500;font-size:.78rem;color:var(--sub)}
.switch{position:relative;width:52px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;z-index:1;cursor:pointer;padding:0}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(21px)}
.remcard{border-radius:18px;padding:14px;background:var(--warn-soft);margin-bottom:10px}
.remcard .t{font-size:1.2rem;font-weight:800;overflow-wrap:anywhere}

/* 전체 화면 도구 (숨 고르기 등) */
.over{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 80% at 50% 0%,var(--teal-soft),var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));text-align:center;animation:fade .25s}
.over h3{font-size:1.4rem;font-weight:800}
.over p{color:var(--sub);font-size:1rem;max-width:26rem}
.orbwrap{position:relative;width:min(66vw,42vh,300px);aspect-ratio:1;display:grid;place-items:center}
.orbwrap::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed var(--teal);opacity:.3}
.orb{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#b9f3f7,#14b8a6 60%,#0e7490);transform:scale(.45);box-shadow:0 18px 50px rgba(20,184,166,.4)}
.phase{font-size:2rem;font-weight:800;color:var(--teal);min-height:2.6rem}
.ring{width:min(62vw,42vh,280px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:3rem;font-weight:800;background:var(--teal-soft)}
.ring div{width:86%;aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.gnum{font-size:5.5rem;font-weight:900;color:var(--teal);line-height:1}
.dots{display:flex;gap:10px;justify-content:center}
.dots i{width:20px;height:20px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.dots i.on{background:var(--teal);transform:scale(1.15)}
.over .btns{width:100%;max-width:26rem}
.osub{font-size:.95rem;color:var(--sub);font-weight:800}

/* 집중 타이머 · 체크인 · 계획 */
.disc{width:min(70vw,40vh,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow);transition:background .5s}
.disc div{width:78%;aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-items:center;align-content:center;gap:2px}
.disc b{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.disc small{font-size:.8rem;color:var(--sub);font-weight:700}
.ftask{font-size:1.25rem;font-weight:800;max-width:24rem;overflow-wrap:anywhere}
.fbar{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--violet-soft),var(--accent-soft));border-radius:18px;padding:12px 14px;font-weight:800}
.fbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckrow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ckrow > b{width:4.6rem;font-size:.86rem;flex:none}
.ckrow .chip{height:2.1rem;padding:0 .7rem;font-size:.84rem}
.ckdone{display:flex;align-items:center;gap:12px;font-weight:800;font-size:.95rem;flex-wrap:wrap}
.week{width:100%;border-collapse:collapse;font-size:.82rem;text-align:center}
.week th{font-weight:700;color:var(--sub);padding:4px 2px;font-size:.75rem}
.week td{padding:6px 2px;border-top:1px solid var(--line);font-weight:700}
.week td:first-child,.week th:first-child{text-align:left}
.plan{border-radius:16px;background:var(--field);padding:11px 12px;margin-top:8px;display:flex;gap:10px;align-items:flex-start}
.plan .tx{flex:1;min-width:0;font-size:.9rem;line-height:1.5;overflow-wrap:anywhere}
.plan .tx b{color:var(--accent)}
.stepn{width:4.2rem;height:4.2rem;border-radius:50%;background:var(--violet-soft);color:var(--violet);font-size:2.2rem;font-weight:900;display:grid;place-items:center}
.vmeter{height:8px;border-radius:4px;background:var(--field);overflow:hidden;margin-top:6px}
.vmeter i{display:block;height:100%;width:0;background:var(--teal);transition:width .15s}
.auto{display:flex;align-items:center;gap:8px;justify-content:center;font-size:.86rem;font-weight:800;color:var(--sub);margin-top:10px}
.auto .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.auto .dot.me{background:#f59e0b}.auto .dot.other{background:var(--teal)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:#25233a;color:#fff;border-radius:16px;padding:11px 12px 11px 16px;display:flex;gap:10px;align-items:center;font-size:.9rem;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 28px rgba(0,0,0,.28);animation:up .2s ease}
.toast button{color:#b9b5ff;font-weight:800;padding:4px 8px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hd">
    <h1 id="title">하루 도우미</h1>
    <button class="ibtn" id="hFS" aria-label="전체화면"></button>
    <button class="ibtn" id="hSet" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="scroll" id="scroll"><div class="view" id="view"></div></div>
  <nav class="tabs" id="tabs">
    <button data-tab="today"><b>🏠</b>오늘</button>
    <button data-tab="mem"><b>🧠</b>기억</button>
    <button data-tab="mind"><b>💗</b>마음</button>
    <button data-tab="talk"><b>🗣</b>대화</button>
  </nav>
</div>
<div id="overRoot"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<script>
(function(){
  'use strict';
  // Artifact 로 게시하면 head 태그가 body 로 들어가므로 다시 head 로 옮김
  document.querySelectorAll('body > link[rel="manifest"], body > link[rel~="icon"], body > link[rel="apple-touch-icon"], body > meta').forEach(function(n){ document.head.appendChild(n); });

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
  var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var MIN = 60000, HOUR = 3600000, DAY = 86400000;
  // 안드로이드 앱(위젯·워치) 안에서 열렸을 때 쓰는 연결 통로
  var NATIVE = window.HaruNative || null;

  // ===== 저장 =====
  var KEY = 'haru-helper-v1', UIKEY = 'haru-helper-ui-v1';
  var DEF_LISTS = [
    { id: 'out', name: '🎒 나가기 전', items: ['휴대폰', '지갑', '열쇠', '이어폰', '약', '가스·전기 끄기'] },
    { id: 'night', name: '🌙 자기 전', items: ['내일 일정 보기', '휴대폰 충전', '약 먹기', '알람 맞추기'] }
  ];
  function freshState(){
    return {
      notes: [], tasks: [], focus: null, reminders: [], moods: [], unsent: [], talks: [], parked: [],
      plans: DEF_PLANS.map(function(p){ return { id: uid(), area: p[0], when: p[1], then: p[2] }; }),
      focusLog: [], estLog: [], checkins: {}, thoughts: [], session: null,
      routine: JSON.parse(JSON.stringify(DEF_ROUTINE)), sos: JSON.parse(JSON.stringify(DEF_SOS)), urges: [], routineAcks: {},
      lists: DEF_LISTS.map(function(l){ return { id: l.id, name: l.name, items: l.items.map(function(t){ return { id: uid(), text: t, on: false }; }) }; })
    };
  }
  // 만약-그러면 계획(실행 의도) 예시
  var DEF_PLANS = [
    ['mind', '화가 확 올라오면', '대답하기 전에 숨을 길게 세 번 내쉰다'],
    ['mind', '메시지를 세게 쓰고 싶어지면', '‘보내지 않는 글’에 먼저 쓰고 20분 뒤에 다시 읽는다'],
    ['talk', '상대 말을 끊고 싶어지면', '키워드만 적어 두고 끝까지 듣는다'],
    ['talk', '내 말이 길어졌다고 느끼면', '“너는 어떻게 생각해?”라고 묻는다'],
    ['life', '현관문 손잡이를 잡으면', '‘나가기 전’ 목록을 연다']
  ];
  // 하루 일과 알림 기본값 (처음에는 꺼져 있음)
  var DEF_ROUTINE = { on: false, workOn: true, days: [1, 2, 3, 4, 5], start: '09:00', end: '18:00', lunch: '12:00', lunchEnd: '13:00', focus: 50, rest: 10,
    alerts: { start: true, rest: true, lunch: true, end: true }, target: 'watch',
    events: [
      { id: 'sun', name: '주일예배', time: '11:00', days: [0], before: 30, on: true, msg: '' },
      { id: 'wed', name: '수요예배', time: '19:30', days: [3], before: 30, on: true, msg: '' },
      { id: 'kitchen', name: '주방 마감', time: '21:00', days: [0, 1, 2, 3, 4, 5, 6], before: 0, on: false, msg: '양치하고 따뜻한 차 한 잔 마셔요. 오늘 먹는 건 여기까지!' }
    ] };
  var DEF_SOS = [
    { id: 'notice', on: true, e: '🚨', t: '알아차리기', b: '지금 화가 많이 났어요. 이대로 말하거나 메시지를 보내면 나중에 후회하기 쉬워요.', ok: '알아차렸어요' },
    { id: 'stop', on: true, e: '✋', t: '말 멈추기', b: '하던 말과 쓰던 메시지를 지금 멈춰요. 보내기 버튼은 누르지 않아요.', ok: '멈췄어요' },
    { id: 'move', on: true, e: '🚶', t: '자리 옮기기', b: '할 수 있다면 지금 그 자리를 떠나요. “잠깐 화장실 다녀올게요” 한마디면 충분해요.', ok: '옮겼어요', alt: '지금은 못 옮겨요' },
    { id: 'cold', on: true, e: '💧', t: '찬물 · 물 한 컵', b: '찬물로 손이나 얼굴을 적시거나, 물 한 컵을 천천히 마셔요. 몸이 먼저 식어야 마음도 식어요.', ok: '했어요', alt: '건너뛰기' },
    { id: 'breath', on: true, e: '🌬', t: '길게 내쉬기 5번', b: '4초 들이쉬고 6초 내쉬기를 다섯 번 해요. 진동에 맞춰 따라 해요.', ok: '다 했어요', alt: '건너뛰기', breath: 5 },
    { id: 'plan', on: true, e: '🧭', t: '내가 정한 계획', b: '', ok: '기억했어요' },
    { id: 'check', on: true, e: '🌡', t: '지금은 어떤가요?', b: '화가 조금 가라앉았나요? 돌아가서 할 말은 “아까는 내가 감정이 커서…”로 시작하면 좋아요.', ok: '가라앉았어요', alt: '아직 커요' }
  ];
  var state = freshState();
  try{ var s0 = JSON.parse(localStorage.getItem(KEY)); if(s0 && typeof s0 === 'object') for(var k0 in s0) state[k0] = s0[k0]; }catch(e){}
  // 예전 버전에서 저장한 기록에 새 항목 채우기
  (function(){ var f = freshState(); ['plans', 'focusLog', 'estLog', 'thoughts', 'sos', 'urges'].forEach(function(k){ if(!Array.isArray(state[k])) state[k] = f[k]; }); ['checkins', 'routineAcks'].forEach(function(k){ if(!state[k] || typeof state[k] !== 'object') state[k] = {}; }); if(!state.routine || typeof state.routine !== 'object') state.routine = f.routine; })();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} nativeSync(); }

  var ui = { tab: 'today', mem: 'notes', autoFS: true, installDismissed: false, theme: 'auto', font: 0, vib: true, sound: true, talkSec: 45, talkSound: false, focusMin: 20, autoTalk: false, autoSens: 1, voice: null, feat: {} };
  try{ var u0 = JSON.parse(localStorage.getItem(UIKEY)); if(u0) for(var k1 in u0) ui[k1] = u0[k1]; }catch(e){}
  if(!ui.feat || typeof ui.feat !== 'object') ui.feat = {};
  function saveUI(){ try{ localStorage.setItem(UIKEY, JSON.stringify(ui)); }catch(e){} }
  function applyLook(){
    var r = document.documentElement;
    if(ui.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', ui.theme);
    r.setAttribute('data-font', String(ui.font || 0));
    if(NATIVE){ try{ var cs = getComputedStyle(r); NATIVE.bars(cs.getPropertyValue('--bg').trim(), cs.getPropertyValue('--card').trim(), isDark()); }catch(e){} }
  }
  function isDark(){ return ui.theme === 'dark' || (ui.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); }

  // ===== 안드로이드 앱 연결: 위젯·워치에 보여 줄 요약을 보내고, 위젯·워치에서 누른 것을 받아 반영 =====
  var syncT = 0;
  function nativeSync(){
    if(!NATIVE) return;
    clearTimeout(syncT);
    syncT = setTimeout(function(){
      var f = state.tasks.find(function(t){ return t.id === state.focus && !t.done; });
      var snap = {
        v: 1, ts: Date.now(), talkSec: ui.talkSec, vib: ui.vib,
        focus: f ? { id: f.id, text: f.text } : null,
        tasks: state.tasks.filter(function(t){ return !t.done; }).slice(0, 30).map(function(t){ return { id: t.id, text: t.text }; }),
        reminders: state.reminders.filter(function(r){ return !r.done; }).map(function(r){ return { id: r.id, text: r.text, at: r.at, daily: !!r.daily }; }),
        lists: state.lists.map(function(l){ return { id: l.id, name: l.name, items: l.items.map(function(i){ return { id: i.id, text: i.text, on: !!i.on }; }) }; }),
        notes: state.notes.length,
        feat: { routine: F('routine'), sos: F('sos'), urge: F('urge'), focus: F('focus'), checkin: F('checkin'), plans: F('plans') },
        // 워치가 스스로 알람을 걸 수 있도록 일과 설정을 통째로 보냄
        routine: Object.assign({}, state.routine, { on: !!state.routine.on && F('routine') }),
        flows: { sos: F('sos') ? sosSteps() : [], urge: F('urge') ? urgeSteps('food') : [] }
      };
      try{ NATIVE.sync(JSON.stringify(snap)); }catch(e){}
    }, 120);
  }
  function applyAction(a){
    var t, r, l, it;
    switch(a.type){
      case 'taskDone': t = state.tasks.find(function(x){ return x.id === a.id; }); if(t && !t.done){ t.done = true; t.doneAt = a.t || Date.now(); if(state.focus === t.id) state.focus = null; } break;
      case 'remDone': r = state.reminders.find(function(x){ return x.id === a.id; }); if(r) remDone(r); break;
      case 'remSnooze': r = state.reminders.find(function(x){ return x.id === a.id; }); if(r){ r.at = a.at; r.fired = false; r.done = false; } break;
      case 'listTog': l = state.lists.find(function(x){ return x.id === a.list; }); it = l && l.items.find(function(x){ return x.id === a.item; }); if(it) it.on = !!a.on; break;
      case 'listReset': l = state.lists.find(function(x){ return x.id === a.list; }); if(l) l.items.forEach(function(x){ x.on = false; }); break;
      case 'note': if(a.text) state.notes.push({ id: uid(), text: String(a.text), t: a.t || Date.now(), from: a.from || '' }); break;
      case 'focus': if(state.tasks.some(function(x){ return x.id === a.id; })) state.focus = a.id; break;
      case 'flowDone': state.urges.push({ id: uid(), t: a.t || Date.now(), kind: a.kind === 'sos' ? 'anger' : 'food', outcome: a.outcome || 'passed', from: a.from || 'watch' }); break;
      case 'talkLog': if(a.dur > 15000){ state.talks.push({ id: uid(), t: a.t, dur: a.dur, me: a.me, longest: a.longest, alerts: a.alerts, from: 'watch' }); if(state.talks.length > 100) state.talks.shift(); } break;
    }
  }
  function pullActions(){
    if(!NATIVE) return;
    var list = [];
    try{ list = JSON.parse(NATIVE.takeActions() || '[]'); }catch(e){}
    if(!list.length) return;
    list.forEach(applyAction);
    var notes = list.filter(function(a){ return a.type === 'note'; }).length;
    save(); refreshSoft();
    if(notes) toast('워치에서 메모 ' + notes + '개가 들어왔어요');
  }
  // 열린 창이 없을 때만 화면을 다시 그림 (입력 중인 내용 보호)
  function refreshSoft(){ if(!$('sheetRoot').children.length && !(document.activeElement && document.activeElement.matches('input,textarea'))) render(); }
  window.haruPull = pullActions;
  // 위젯·워치·알림에서 앱을 열 때 바로 갈 화면
  window.haruOpen = function(what){
    closeOver(); $('sheetRoot').innerHTML = '';
    switch(what){
      case 'capture': ui.tab = 'today'; render(); setTimeout(function(){ var c = $('cap'); if(c) c.focus(); }, 150); break;
      case 'focus': ui.tab = 'today'; render(); pickFocusSheet(); break;
      case 'breath': ui.tab = 'mind'; render(); breathRun(0, 2); break;
      case 'pause': ui.tab = 'mind'; render(); pauseRun(); break;
      case 'mind': ui.tab = 'mind'; render(); break;
      case 'talk': talkStart(); break;
      case 'lists': ui.tab = 'mem'; ui.mem = 'lists'; render(); break;
      case 'rem': ui.tab = 'mem'; ui.mem = 'rem'; render(); break;
      case 'notes': ui.tab = 'mem'; ui.mem = 'notes'; render(); break;
      default: ui.tab = 'today'; render();
    }
    saveUI(); $('scroll').scrollTop = 0;
  };
  // 안드로이드 뒤로 가기: 열린 창부터 닫고, 닫을 것이 없으면 false
  window.haruBack = function(){
    var dims = $('sheetRoot').children;
    if(dims.length){ var d = dims[dims.length - 1]; if(d.close) d.close(); else d.remove(); return true; }
    if(over){ closeOver(); render(); return true; }
    if(ui.tab !== 'today'){ ui.tab = 'today'; saveUI(); render(); return true; }
    return false;
  };
  applyLook();

  // ===== 시간 표시 =====
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function hm(d){ var h = d.getHours(), m = d.getMinutes(); return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m; }
  function dayStart(t){ var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function fmtAt(t){
    var d = new Date(t), diff = Math.round((dayStart(t) - dayStart(Date.now())) / DAY);
    if(diff === 0) return '오늘 ' + hm(d);
    if(diff === 1) return '내일 ' + hm(d);
    if(diff === -1) return '어제 ' + hm(d);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + WD[d.getDay()] + ') ' + hm(d);
  }
  function fmtAgo(t){
    var g = Date.now() - t;
    if(g < MIN) return '방금';
    if(g < HOUR) return Math.floor(g / MIN) + '분 전';
    if(dayStart(t) === dayStart(Date.now())) return Math.floor(g / HOUR) + '시간 전';
    return fmtAt(t);
  }
  function fmtLeft(t){
    var g = t - Date.now();
    if(g <= 0) return '지금';
    if(g < HOUR) return Math.ceil(g / MIN) + '분 뒤';
    if(g < DAY) return Math.floor(g / HOUR) + '시간 ' + (Math.floor(g / MIN) % 60) + '분 뒤';
    return fmtAt(t);
  }
  function mmss(ms){ var s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function localInput(t){ var d = new Date(t - new Date(t).getTimezoneOffset() * MIN); return d.toISOString().slice(0, 16); }

  // ===== 소리 · 진동 · 알림 =====
  var actx = null;
  function beep(times, freq){
    if(!ui.sound) return;
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      for(var i = 0; i < (times || 1); i++){
        var t = actx.currentTime + i * 0.35, o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = freq || 880;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.3);
      }
    }catch(e){}
  }
  function buzz(p){
    if(!ui.vib) return;
    var arr = [].concat(p);
    if(NATIVE){ try{ NATIVE.vibrate(arr.join(',')); }catch(e){} return; }
    if(navigator.vibrate){ try{ navigator.vibrate(arr); }catch(e){} }
  }
  function notify(title, body){
    try{
      if(!('Notification' in window) || Notification.permission !== 'granted') return;
      var opt = { body: body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'haru-' + uid(), vibrate: [300, 150, 300] };
      if(navigator.serviceWorker && navigator.serviceWorker.controller){
        navigator.serviceWorker.ready.then(function(reg){ return reg.showNotification(title, opt); }).catch(function(){ try{ new Notification(title, opt); }catch(e){} });
      } else new Notification(title, opt);
    }catch(e){}
  }

  // ===== 화면 꺼짐 방지 =====
  var wake = null, wakeWant = 0;
  function wakeOn(){ wakeWant++; if(NATIVE){ try{ NATIVE.keepScreen(true); }catch(e){} } reqWake(); }
  function wakeOff(){
    wakeWant = Math.max(0, wakeWant - 1);
    if(wakeWant) return;
    if(NATIVE){ try{ NATIVE.keepScreen(false); }catch(e){} }
    if(wake){ try{ wake.release(); }catch(e){} wake = null; }
  }
  function reqWake(){
    if(!wakeWant || wake || !navigator.wakeLock || document.hidden) return;
    navigator.wakeLock.request('screen').then(function(w){ wake = w; w.addEventListener('release', function(){ wake = null; }); }).catch(function(){});
  }

  // ===== 작은 창 · 알림 줄 =====
  function openModal(html, onClose){
    var dim = document.createElement('div');
    dim.className = 'idim';
    dim.innerHTML = '<div class="isheet" role="dialog">' + html + '</div>';
    dim.close = function(){ if(dim.parentNode){ dim.remove(); if(onClose) onClose(); } };
    dim.addEventListener('click', function(e){ if(e.target === dim || e.target.closest('[data-close]')) dim.close(); });
    $('sheetRoot').appendChild(dim);
    var f = dim.querySelector('[autofocus]'); if(f) setTimeout(function(){ try{ f.focus(); }catch(e){} }, 60);
    return dim;
  }
  var toastT = 0;
  function toast(msg, undo){
    clearTimeout(toastT);
    var r = $('toastRoot');
    r.innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (undo ? '<button>되돌리기</button>' : '') + '</div>';
    if(undo) r.querySelector('button').onclick = function(){ undo(); r.innerHTML = ''; };
    toastT = setTimeout(function(){ r.innerHTML = ''; }, undo ? 5000 : 2600);
  }
  // 지우기 전에 상태를 저장해 두었다가 되돌리기
  function withUndo(msg, fn){
    var snap = JSON.stringify(state);
    fn(); save(); render();
    toast(msg, function(){ try{ state = JSON.parse(snap); save(); render(); }catch(e){} });
  }

  // ===== 홈 화면 앱 판단 =====
  // 브라우저의 전체화면(Fullscreen API)도 크롬은 display-mode: fullscreen 으로 알려 주므로, 처음 열렸을 때의 상태로 판단
  var BOOT_STANDALONE = !!NATIVE || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true;
  function isStandalone(){
    if(NATIVE || navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) return true;
    if(document.fullscreenElement || document.webkitFullscreenElement) return BOOT_STANDALONE;
    return BOOT_STANDALONE || matchMedia('(display-mode: fullscreen)').matches;
  }
  var inFrame = false; try{ inFrame = window.self !== window.top; }catch(e){ inFrame = true; }

  // ===== 화면 그리기 =====
  var TITLES = { today: '하루 도우미', mem: '기억', mind: '마음', talk: '대화' };
  var draft = { emo: null, lv: 5 };
  // 집중 타이머가 앱 밖에서도 울리도록 넣어 두는 알림(kind: timer)은 알림 목록에 보이지 않게 함
  function userRems(){ return state.reminders.filter(function(r){ return r.kind !== 'timer'; }); }
  function dueReminders(){ var n = Date.now(); return userRems().filter(function(r){ return !r.done && r.at <= n; }); }
  function head(icon, color, title, right){ return '<div class="ch"><span class="ico c-' + color + '">' + icon + '</span><h2>' + title + '</h2>' + (right || '') + '</div>'; }

  function render(){
    $('title').innerHTML = esc(TITLES[ui.tab]);
    [].forEach.call($('tabs').children, function(b){ b.classList.toggle('on', b.getAttribute('data-tab') === ui.tab); });
    var due = dueReminders().length, tb = $('tabs').querySelector('[data-tab="mem"]');
    tb.innerHTML = '<b>🧠</b>기억' + (due ? '<span class="badge">' + due + '</span>' : '');

    v.innerHTML = ui.tab === 'mem' ? viewMem() : ui.tab === 'mind' ? viewMind() : ui.tab === 'talk' ? viewTalk() : viewToday();
    v.style.animation = 'none'; void v.offsetWidth; v.style.animation = '';
    paintInstall();
  }

  function installFoot(){ return isStandalone() ? '' : '<div class="foot wide"><button class="btn soft" data-a="install">📲 홈 화면에 설치하기</button></div>'; }

  // ----- 오늘 -----
  function viewToday(){
    var h = '';

      '<div class="btns"><button class="btn primary" data-a="install">설치하기</button><button class="btn" data-a="fs" id="bFs">전체화면</button><button class="btn ghost" data-a="later">다음에</button></div></div></div>';

      '<div class="stats"><button data-a="goMem" data-sub="tasks"><b>' + openN + '</b>할 일</button><button data-a="goMem" data-sub="rem"><b>' + remN + '</b>알림</button><button data-a="goMem" data-sub="notes"><b>' + state.notes.length + '</b>메모</button></div></div>';

    if(NATIVE && !ui.widgetLater && widgetCount() === 0){
      h += '<div class="card wide">' + head('📱', 'violet', '홈 화면에 위젯 놓기') + '<p class="sub">위젯을 놓아 두면 앱을 열지 않아도 지금 할 일과 다음 알림이 홈 화면에 보여요.</p>' +

      '<div class="capto"><button class="c-indigo" data-a="cap" data-to="note">📝 메모</button><button class="c-green" data-a="cap" data-to="task">✅ 할 일</button><button class="c-amber" data-a="cap" data-to="rem">⏰ 알림</button></div>' +
      '<p class="note">일단 적어 두면 머릿속에서 내려놓을 수 있어요. 정리는 나중에 ‘기억’에서 해요.</p></div>';

    if(state.session) h += '<button class="fbar wide" data-a="focusOpen">⏱ <span>집중 중 · ' + esc(state.session.text) + '</span><b id="fbLeft">' + mmss(state.session.end - Date.now()) + '</b></button>';
    var f = state.tasks.find(function(t){ return t.id === state.focus && !t.done; });
    h += '<div class="card">' + head('🎯', 'amber', '지금 할 일 하나', f ? '<button class="link" data-a="pickFocus">바꾸기</button>' : '');

    else h += '<p class="empty">여러 가지를 한꺼번에 붙잡고 있으면 더 쉽게 잊어요. 지금 할 일 하나만 골라 두세요.</p><button class="btn soft block" data-a="pickFocus">하나 고르기</button>';

    else h += '<div class="list">' + up.slice(0, 4).map(remItem).join('') + '</div>' + (up.length > 4 ? '<button class="more" data-a="goMem" data-sub="rem">알림 ' + up.length + '개 모두 보기 ›</button>' : '');

    h += '<div class="card">' + head('🧾', 'sky', '챙길 것') + '<div class="chips">' + state.lists.map(function(l){
      var n = l.items.filter(function(i){ return i.on; }).length;
      return '<button class="chip" data-a="openList" data-id="' + l.id + '">' + esc(l.name) + ' <span class="sub">' + n + '/' + l.items.length + '</span></button>';
    }).join('') + '</div><p class="note">문을 나서기 전에 열어서 하나씩 눌러 보세요.</p></div>';

    var qb = [];

  function remItem(r){

    return '<div class="item' + (due ? ' due' : '') + '"><div class="tx">' + esc(r.text) +
      '<small>' + (due ? '⏰ ' + fmtAt(r.at) + ' · 시간이 됐어요' : fmtAt(r.at) + ' · ' + fmtLeft(r.at)) + (r.daily ? ' · 매일' : '') + '</small></div>' +
      (due ? '<button class="mini txt" data-a="remOk" data-id="' + r.id + '">확인</button>' : (NATIVE ? '' : '<button class="mini" data-a="remIcs" data-id="' + r.id + '" title="캘린더에 넣기">📅</button>')) +

        '<div class="capbox"><input id="addNote" placeholder="떠오른 생각 적기" enterkeyhint="done" autocomplete="off"><button class="btn primary" data-a="addNote">추가</button></div>';
      h += state.notes.length ? '<div class="list" style="margin-top:8px">' + state.notes.slice().reverse().map(function(n){

          '<button class="mini" data-a="noteDel" data-id="' + n.id + '" aria-label="지우기">✕</button></div>';

      }).join('') + '</div><p class="note">🎯를 누르면 첫 화면에 ‘지금 할 일 하나’로 크게 보여요.</p>' : '<p class="empty" style="margin-top:8px">남은 할 일이 없어요. 👏</p>';

          : '<p class="note">앱을 열어 두거나 잠깐 내려 둔 동안 울려요. 앱을 완전히 닫으면 늦게 울리거나 안 울릴 수 있으니, 꼭 지켜야 하는 일은 📅를 눌러 휴대폰 캘린더에도 넣어 두세요.</p>' + notifHint()) + '</div>';

  function todayKey(t){ var d = new Date(t || Date.now()); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  // ===== 자동 말하기 감지 (실험) =====
  // 마이크 소리의 크기와 목소리 높이(기본 주파수)를 ‘내 목소리 등록’ 값과 비교해 내가 말하는 중인지 추정한다.
  // 소리는 저장하거나 보내지 않고, 이 기기 안에서 바로 계산만 한다.
  function micOpen(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error('no mic'));
    return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function(stream){
      var C = window.AudioContext || window.webkitAudioContext, ctx = new C();
      var an = ctx.createAnalyser(); an.fftSize = 2048;
      ctx.createMediaStreamSource(stream).connect(an);
      if(ctx.state === 'suspended') ctx.resume();
      return { stream: stream, ctx: ctx, an: an, buf: new Float32Array(2048), hist: [], iv: 0 };
    });
  }
  function micClose(v){
    if(!v) return;
    clearInterval(v.iv);
    try{ v.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    try{ v.ctx.close(); }catch(e){}
  }
  // 정규화 자기상관으로 목소리 높이(Hz) 찾기. 목소리가 아니면 0
  function detectPitch(b, sr){
    var n = b.length >> 1, x = new Float32Array(n), sr2 = sr / 2, i, L;
    for(i = 0; i < n; i++) x[i] = (b[2 * i] + b[2 * i + 1]) / 2;
    var minL = Math.floor(sr2 / 400), maxL = Math.min(n - 64, Math.ceil(sr2 / 70)), W = n - maxL;
    var e0 = 0; for(i = 0; i < W; i++) e0 += x[i] * x[i];
    if(e0 <= 0) return 0;
    var rs = [], best = 0;
    for(L = minL; L <= maxL; L++){
      var c = 0, e1 = 0;
      for(i = 0; i < W; i++){ var y = x[i + L]; c += x[i] * y; e1 += y * y; }
      var r = c / Math.sqrt(e0 * e1 + 1e-12); rs.push(r); if(r > best) best = r;
    }
    if(best < 0.55) return 0;
    // 한 옥타브 낮게 읽지 않도록, 가장 큰 값에 가까운 첫 봉우리를 고름
    for(L = 1; L < rs.length - 1; L++) if(rs[L] >= best * 0.88 && rs[L] >= rs[L - 1] && rs[L] >= rs[L + 1]) return sr2 / (L + minL);
    return 0;
  }
  function micFrame(v){
    v.an.getFloatTimeDomainData(v.buf);
    var b = v.buf, sum = 0;
    for(var i = 0; i < b.length; i++) sum += b[i] * b[i];
    var db = 20 * Math.log10(Math.sqrt(sum / b.length) + 1e-9);
    v.hist.push(db); if(v.hist.length > 300) v.hist.shift();
    var sorted = v.hist.slice().sort(function(a, c){ return a - c; }), floor = sorted[Math.floor(sorted.length * 0.15)];
    var pitch = db > floor + 8 && db > -70 ? detectPitch(b, v.ctx.sampleRate) : 0;
    return { db: db, floor: floor, pitch: pitch, voiced: pitch > 0 };
  }

    else if(ios) how = '<ol><li>사파리 아래(또는 위) ' + kbd('공유 ⬆') + ' 단추를 누르세요</li><li>메뉴를 올려 <b>홈 화면에 추가</b>를 누르세요</li><li>오른쪽 위 <b>추가</b>를 누르세요</li></ol>';
    else if(samsung) how = '<ol><li>아래 ' + kbd('≡') + ' 메뉴를 누르세요</li><li><b>현재 페이지 추가</b> → <b>홈 화면</b>을 누르세요</li></ol>';
    else if(mobile) how = '<ol><li>오른쪽 위 ' + kbd('⋮') + ' 메뉴를 누르세요</li><li><b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요</li><li>뜨는 창에서 <b>설치</b>를 누르세요</li></ol>';
    else how = '<ol><li>크롬·엣지 주소창 오른쪽의 ' + kbd('설치 ⊕') + ' 아이콘을 누르세요</li><li>없으면 ' + kbd('⋮') + ' 메뉴 → <b>앱 설치</b>(또는 <b>앱</b> → <b>이 사이트를 앱으로 설치</b>)를 누르세요</li></ol>';
    openModal('<h3>홈 화면에 설치하기</h3><p>설치하면 아이콘으로 바로 열리고, 주소창 없이 화면을 넓게 쓸 수 있어요. 인터넷이 잘 안 되는 곳에서도 열려요.</p>' + how +
      '<button class="btn primary block" data-close>알겠어요</button>');
  }

  $('hFS').addEventListener('click', FS.toggle);
  $('hSet').addEventListener('click', settingsSheet);
  // 자동 전체화면: 화면을 처음 누를 때 (버튼으로 직접 끈 뒤에는 다시 켜지 않음)
  document.addEventListener('click', function(e){
    if(!ui.autoFS || FS.userExit || FS.on() || !FS.supported()) return;
    if(e.target.closest && e.target.closest('#hFS, #hSet, #banner, .idim')) return;
    FS.enter();
  }, true);
  document.addEventListener('fullscreenchange', paintInstall);
  document.addEventListener('webkitfullscreenchange', paintInstall);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyLook);

  // 휴대폰 키보드가 올라올 때 화면 높이 맞추기
  function fit(){ if(window.visualViewport) document.documentElement.style.setProperty('--appH', Math.round(visualViewport.height) + 'px'); }
  if(window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit();

  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    reqWake(); pullActions(); checkReminders(); showDue();
    if(ui.tab !== 'talk') refreshSoft();
  });

  if(!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  render();
  pullActions();
  nativeSync();
  if(state.session) focusTick();
  checkReminders(); showDue();
})();
</script>
</body>
</html>
