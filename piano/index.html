<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>난장이의 피아노 교실</title>
<meta name="description" content="코드(화음)를 차근차근 익히는 왕초보 피아노 연습실">
<meta name="theme-color" content="#F2ECE3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Great+Vibes&family=Nanum+Pen+Script&family=Noto+Music&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{
  --fs:18px;
  --serif:'Song Myung','Noto Serif KR','Noto Serif CJK KR',serif;
  --sans:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hand:'Great Vibes','Nanum Pen Script',cursive;
  --bg:#F2ECE3; --bg-deep:#E7DED1; --surface:#FFFCF7; --surface-2:#F6F0E7; --line:#E2D7C7; --paper:#FFFDF8;
  --ink:#3A2E24; --ink-2:#6D5F51; --ink-3:#A29382;
  --peony:#8A5A3B; --peony-ink:#FFF8EF; --peony-soft:#F1E5D6;
  --btn:#6E4A31;
  --bamboo:#C9A46A; --bamboo-2:#E9D5A9; --bamboo-dark:#8C6A3A;
  --jade:#5B8C68; --jade-soft:#E1ECE1; --warm:#BE733A; --warm-soft:#F6E6D5; --cool:#52779D; --cool-soft:#E1E9F1; --bad:#AE4F45;
  --s1:#F1E5D6; --s1i:#8A5A3B; --s2:#EEE6D3; --s2i:#806A3B; --s3:#E2E9DE; --s3i:#56775C; --s4:#ECE2DD; --s4i:#7A5250;
  --pearl:linear-gradient(135deg,#FBF7F0 0%,#EEE3D2 100%);
  --shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.07);
  --nav-h:70px; --hdr-h:60px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1D1814; --bg-deep:#16120F; --surface:#27211B; --surface-2:#2F2820; --line:#3E352B; --paper:#2A231D;
  --ink:#F2EAE0; --ink-2:#C4B6A6; --ink-3:#8A7D6F;
  --peony:#D9B27C; --peony-ink:#2A1E12; --peony-soft:#3A3024;
  --btn:#D9B27C;
  --bamboo:#D2AE72; --bamboo-2:#E9D5A9; --bamboo-dark:#8C6A3A;
  --jade:#8FC29C; --jade-soft:#26372B; --warm:#E3A06A; --warm-soft:#3E2E21; --cool:#8EB1D6; --cool-soft:#243142; --bad:#E08A80;
  --s1:#3A3024; --s1i:#D9B27C; --s2:#363020; --s2i:#D7C08A; --s3:#26372B; --s3i:#9CCBA6; --s4:#382C2A; --s4i:#D6A9A3;
  --pearl:linear-gradient(135deg,#2E2620 0%,#3A2F25 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(var(--fs) * var(--k,1));height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:root[data-theme="dark"] body{background:var(--bg)}
:focus-visible{outline:3px solid var(--peony);outline-offset:2px;border-radius:10px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-weight:400}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 80% at 50% 36%,#FCF8F1 0%,#F0E6D7 58%,#E3D4BF 100%);color:#3A2E24;overflow:hidden;
  padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);transition:opacity .8s ease,visibility .8s}
#splash.out{opacity:0;visibility:hidden}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
.sp-emblem{position:relative;width:min(190px,50vw);margin-bottom:16px;opacity:0;transform:translateY(10px);animation:spEmb 1.2s .05s ease forwards}
.sp-emblem svg{width:100%;height:auto;display:block}
@keyframes spEmb{to{opacity:1;transform:none}}
.sp-title{position:relative;text-align:center;font-family:var(--serif);line-height:1.15}
.sp-small{display:block;font-size:clamp(20px,5.6vw,28px);letter-spacing:.22em;margin-bottom:.25em;color:#8C7660}
.sp-big{display:block;font-size:clamp(40px,12.5vw,64px);letter-spacing:.04em}
.sp-ch{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(10px) scale(1.35);animation:resolve 1.05s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes resolve{60%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
.sp-big .sp-ch{background:linear-gradient(100deg,#3A2E24 0%,#3A2E24 38%,#B8915A 45%,#F1DDB0 50%,#B8915A 55%,#3A2E24 62%,#3A2E24 100%);
  background-size:320% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:resolve 1.05s cubic-bezier(.2,.7,.2,1) forwards,sheen 1.6s 1.25s ease-in-out forwards}
@keyframes sheen{to{background-position:0% 0}}
.sp-line{width:0;height:1px;margin:16px auto 10px;background:linear-gradient(90deg,transparent,#B8915A,transparent);animation:spLine 1s 1.2s ease forwards}
@keyframes spLine{to{width:min(240px,62vw)}}
.sp-credit{font-family:var(--hand);font-size:clamp(32px,9vw,42px);color:#8A5A3B;clip-path:inset(0 100% 0 0);animation:write 1.4s 1.75s steps(30,end) forwards;padding:0 6px}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.sp-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:.78rem;color:#9C8B78;opacity:0;animation:spEmb .6s 2.4s forwards}
@media (prefers-reduced-motion:reduce){
  .sp-ch,.sp-big .sp-ch{animation:fadeIn .8s forwards;filter:none;transform:none}
  .sp-credit{animation:fadeIn .8s .6s forwards;clip-path:none;opacity:0}
  .sp-line{animation:none;width:min(240px,62vw)}
}
@keyframes fadeIn{to{opacity:1}}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;min-height:calc(var(--hdr-h) + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 10px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#hdr h1{flex:1;font-size:1.12rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
#hdr h1.brand{font-family:var(--serif);font-weight:400;font-size:1.25rem;letter-spacing:.02em}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--bg-deep)}
.icon-btn svg{width:26px;height:26px}
#view{flex:1;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));width:100%;max-width:640px;margin:0 auto}
body.has-nav #view{padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
body.has-dock #view{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
body.has-nav.has-dock #view{padding-bottom:calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px))}
.screen{animation:scrIn .28s ease}
@keyframes scrIn{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.04)}
#nav button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);font-size:.78rem;font-weight:700}
#nav button svg{width:27px;height:27px}
#nav button.on{color:var(--peony)}
#nav button.on svg{transform:translateY(-1px)}

/* dock: fixed bottom action bar for practice screens */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 70%,color-mix(in srgb,var(--bg) 0%,transparent));display:flex;gap:10px;justify-content:center}
body.has-nav .dock{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:12px}
.dock>*{max-width:560px}

/* ---------- Buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:14px;font-weight:700;font-size:1rem;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--btn);color:var(--peony-ink);border-color:transparent}
.btn.soft{background:var(--peony-soft);color:var(--peony);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.big{min-height:64px;font-size:1.12rem;border-radius:20px}
.btn.wide{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.stop{background:var(--ink);color:var(--surface)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row>.grow{flex:1}
.row.wrap>.btn.grow{flex:1 1 40%}
.stack{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.mt{margin-top:14px}.mt2{margin-top:24px}.mb{margin-bottom:14px}

.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.flat{box-shadow:none;border:1.5px solid var(--line)}
.card+.card{margin-top:14px}
.sec-title{font-family:var(--serif);font-size:1.3rem;margin:26px 2px 10px}
.label{font-size:.86rem;color:var(--ink-2);font-weight:700;margin:0 0 6px 2px;display:block}

.seg{display:flex;background:var(--bg-deep);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:46px;border-radius:11px;font-weight:700;color:var(--ink-2);font-size:.95rem;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--btn);color:var(--peony-ink);border-color:var(--btn)}
.switch{position:relative;width:60px;height:34px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span::after{content:'';position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--jade)}
.switch input:checked+span::after{transform:translateX(26px)}
.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;min-height:64px;width:100%;text-align:left;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
button.li:active{background:var(--surface-2)}
.li .t{font-weight:700}
.li .d{font-size:.84rem;color:var(--ink-2);line-height:1.4}
.li .grow{flex:1;min-width:0}
.li .chev{color:var(--ink-3);width:20px;height:20px;flex:none}
.li-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.li-ic svg{width:26px;height:26px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:54px;height:54px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:1.5rem;font-weight:700;display:grid;place-items:center}
.stepper button:active{background:var(--bg-deep)}
.stepper .val{min-width:96px;text-align:center}
.stepper .val b{display:block;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stepper .val small{color:var(--ink-2);font-size:.8rem}
input[type=range]{width:100%;accent-color:var(--peony);height:36px}
select.sel{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-weight:700}
input.txt,textarea.txt{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px}

/* ---------- Home ---------- */
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;background:var(--pearl);background-size:200% 100%;color:var(--ink);box-shadow:var(--shadow)}
:root[data-theme="dark"] .hero{color:#F6EFE8}
.hero .greet{position:relative;font-family:var(--serif);font-size:1.45rem;line-height:1.3;padding-right:96px}
.hero .stat{margin-top:6px;font-size:.95rem;opacity:.85;padding-right:80px}
.hero .art{position:absolute;right:-6px;top:2px;width:118px;pointer-events:none}
.hero .art svg{width:100%;height:auto;display:block}
.hero .btn{margin-top:14px;background:var(--btn);border:0;color:var(--peony-ink)}

.banner{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:14px 14px;margin-top:14px;background:var(--warm-soft)}
.banner.info{background:var(--cool-soft)}
.banner svg{width:26px;height:26px;flex:none;margin-top:2px}
.banner .grow{flex:1}
.banner b{display:block}
.stage{margin-top:22px}
.stage-h{display:flex;align-items:center;gap:12px;margin:0 4px 10px}
.stage-h .pip{width:40px;height:40px;flex:none}
.stage-h .n{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.stage-h h2{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
.stage-h p{margin:0;font-size:.84rem;color:var(--ink-2)}

/* ---------- Notes ---------- */
.nt{position:relative;display:inline-block}
.nt .od{position:absolute;left:50%;transform:translateX(-50%);font-size:max(5px,.12em);line-height:1;letter-spacing:.1em;white-space:nowrap}
.nt .od.up{top:-4%}
.nt .od.dn{bottom:-6%}

/* ---------- Pipe map ---------- */
.pipes-wrap{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:4px 2px 6px;-webkit-overflow-scrolling:touch}
.pipes-wrap svg{display:block}
.pipe-hit{cursor:pointer}
.pipe-lbl{font-family:var(--sans);font-weight:700;fill:var(--ink)}
.pipe-no{font-family:var(--sans);fill:var(--ink-3)}

/* ---------- Tuner ---------- */
.tuner{padding:16px 14px 18px;text-align:center;position:relative}
.tuner svg.gauge{width:100%;max-width:420px;display:block;margin:0 auto}
.t-note{font-family:var(--serif);font-size:5rem;line-height:1.05;margin-top:-6px;position:relative;min-height:1em}
.t-oct{font-size:1rem;color:var(--ink-2);height:1.4em;font-weight:700;margin-top:-4px}
.t-sub{font-size:1rem;color:var(--ink-2);margin-top:8px;font-variant-numeric:tabular-nums}
.t-hint{margin-top:10px;min-height:3.1em;font-size:1.02rem;font-weight:700;padding:8px 12px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.t-hint.good{background:var(--jade-soft);color:var(--jade)}
.t-hint.high{background:var(--warm-soft);color:var(--warm)}
.t-hint.low{background:var(--cool-soft);color:var(--cool)}
canvas.trace{width:100%;height:120px;display:block;border-radius:14px;background:var(--surface-2)}
.meter{position:relative;height:46px;border-radius:14px;background:linear-gradient(90deg,var(--cool-soft),var(--surface-2) 40%,var(--surface-2) 60%,var(--warm-soft));overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--jade-soft);border-left:2px solid var(--jade);border-right:2px solid var(--jade);opacity:.9}
.meter .mk{position:absolute;top:6px;bottom:6px;width:10px;margin-left:-5px;border-radius:6px;background:var(--ink);transition:left .08s linear,opacity .2s}
.meter .lab{position:absolute;bottom:2px;font-size:.7rem;color:var(--ink-3);font-weight:700}

/* ---------- Big target card ---------- */
.target{text-align:center;padding:18px 14px}
.target .q{font-size:.95rem;color:var(--ink-2);font-weight:700}
.target .big{font-family:var(--serif);font-size:4.6rem;line-height:1.05;margin:8px 0 4px}
.target .pno{font-size:1rem;color:var(--ink-2);font-weight:700}
.target.ok{animation:okPulse .5s}
@keyframes okPulse{30%{background:var(--jade-soft)}}
.fb{min-height:2.6em;margin-top:10px;font-weight:700;font-size:1.02rem}
.fb.good{color:var(--jade)}.fb.high{color:var(--warm)}.fb.low{color:var(--cool)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--jade)}.dots i.cur{background:var(--peony)}.dots i.skip{background:var(--ink-3)}
.seq{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px;scrollbar-width:none;scroll-behavior:smooth}
.seq::-webkit-scrollbar{display:none}
.seq .sn{flex:none;min-width:52px;height:60px;padding:0 8px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.25rem;border:2px solid transparent;position:relative}
.seq .sn small{font-size:.66rem;color:var(--ink-3);font-weight:700;margin-top:2px}
.seq .sn.cur{border-color:var(--peony);background:var(--peony-soft);transform:scale(1.06)}
.seq .sn.ok{background:var(--jade-soft);color:var(--jade)}
.seq .sn.mid{background:var(--warm-soft);color:var(--warm)}
.seq .sn.miss{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.seq .sn.rest{opacity:.55}
.result{text-align:center}
.result .score{font-family:var(--serif);font-size:3.2rem;line-height:1.1}
.result .stars{font-size:2rem;letter-spacing:.1em;color:var(--bamboo)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-top:12px}
.kv div{background:var(--surface-2);border-radius:14px;padding:10px 12px;text-align:center}
.kv b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.kv span{font-size:.8rem;color:var(--ink-2);font-weight:700}

/* ---------- Ring ---------- */
.ring{position:relative;width:min(240px,64vw);aspect-ratio:1;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.ring .in span{font-size:.9rem;color:var(--ink-2);font-weight:700}
.breath{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:10px auto;display:grid;place-items:center}
.breath .ball{position:absolute;width:42%;height:42%;border-radius:50%;background:var(--pearl);box-shadow:0 0 0 10px color-mix(in srgb,var(--peony) 10%,transparent);transition:transform linear}
.breath .txt{position:relative;text-align:center;font-weight:700;font-size:1.15rem}
.breath .txt b{display:block;font-size:2.4rem;font-family:var(--serif);font-weight:400}

/* ---------- Metronome ---------- */
.beats{display:flex;gap:12px;justify-content:center;margin:18px 0 8px}
.beats i{width:30px;height:30px;border-radius:50%;background:var(--line);transition:transform .06s,background .06s}
.beats i.acc{width:38px;height:38px;margin-top:-4px}
.beats i.on{background:var(--btn);transform:scale(1.18)}
.bpm-big{font-family:var(--serif);font-size:4.8rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bpm-name{text-align:center;color:var(--ink-2);font-weight:700}
.tap{width:100%;min-height:72px;border-radius:20px;background:var(--surface-2);border:2px dashed var(--line);font-weight:700;font-size:1.05rem;color:var(--ink-2)}
.tap:active{background:var(--peony-soft)}

/* ---------- Timing lane ---------- */
.lane{position:relative;height:90px;border-radius:16px;background:var(--surface-2);overflow:hidden}
.lane .ctr{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--jade)}
.lane .band{position:absolute;top:0;bottom:0;background:var(--jade-soft)}
.lane .hit{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;opacity:.85;transition:opacity 4s}
.lane .lb{position:absolute;bottom:4px;font-size:.72rem;font-weight:700;color:var(--ink-3)}
.pulse{width:120px;height:120px;border-radius:50%;margin:14px auto;background:var(--surface-2);display:grid;place-items:center;font-family:var(--serif);font-size:2.4rem;transition:transform .05s,background .05s}
.pulse.on{background:var(--peony-soft);transform:scale(1.08)}

/* ---------- Play-along roll ---------- */
.roll{position:relative;height:170px;border-radius:18px;background:var(--surface-2);overflow:hidden}
.roll .head{position:absolute;left:28%;top:0;bottom:0;width:3px;background:var(--peony);z-index:2;border-radius:2px}
.roll .strip{position:absolute;left:0;top:0;bottom:0;will-change:transform}
.roll .nb{position:absolute;height:34px;border-radius:10px;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;padding-left:8px;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden}
.roll .nb.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.roll .nb.mid{background:var(--warm-soft);border-color:var(--warm);color:var(--warm)}
.roll .nb.miss{border-color:var(--bad);color:var(--bad)}
.roll .nb.now{border-color:var(--peony);box-shadow:0 0 0 3px color-mix(in srgb,var(--peony) 25%,transparent)}
.roll .live{position:absolute;left:28%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ink);z-index:3;transition:top .06s linear}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:4rem;z-index:4;background:color-mix(in srgb,var(--surface-2) 70%,transparent)}

/* ---------- Song list ---------- */
.song{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line);min-height:72px}
.song:first-child{border-top:0}
.song .ttl{font-weight:700;font-size:1.05rem}
.song .meta{font-size:.82rem;color:var(--ink-2)}
.song .lv{display:flex;gap:3px;flex:none}
.song .lv i{width:8px;height:18px;border-radius:3px;background:var(--line)}
.song .lv i.on{background:var(--bamboo)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);margin-right:4px}

/* ---------- Sheet / modal ---------- */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(10,14,16,.45);animation:fadeIn .2s forwards;opacity:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:88vh;overflow:auto;animation:sheetIn .26s ease;max-width:640px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-family:var(--serif);font-size:1.4rem;margin-bottom:6px}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:90;
  background:var(--ink);color:var(--surface);padding:13px 20px;border-radius:16px;font-weight:700;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Mic gate ---------- */
.micgate{position:relative;margin-top:6px}
.micgate .card{text-align:center;padding:24px 20px}
.mg-ic{width:84px;height:84px;margin:4px auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--peony-soft);color:var(--peony)}
.mg-ic.warn{background:var(--warm-soft);color:var(--warm)}
.mg-ic svg{width:42px;height:42px}
.micgate h3{font-family:var(--serif);font-size:1.45rem;line-height:1.3}
.micgate p{color:var(--ink-2);margin:10px 0 0}
.steps{counter-reset:st;text-align:left;margin:16px 0 0;padding:0;list-style:none}
.steps li{position:relative;padding:12px 12px 12px 56px;background:var(--surface-2);border-radius:14px;margin-top:8px;min-height:54px;line-height:1.45}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:12px;top:11px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700}
.kbd{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;white-space:nowrap}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-weight:700;font-size:.85rem;background:var(--surface-2)}
.status-pill i{width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.status-pill.ok i{background:var(--jade)}.status-pill.no i{background:var(--bad)}.status-pill.ask i{background:var(--warm)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--peony);animation:rot 1s linear infinite;margin:10px auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Onboarding ---------- */
.ob{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;padding:10px 4px}
.ob h2{font-family:var(--serif);font-size:1.9rem;line-height:1.3}
.ob-art{width:min(170px,46vw);margin:0 auto 6px}
.ob-art svg{width:100%;height:auto;display:block}
.ob .lead{font-size:1.05rem;color:var(--ink-2);margin-top:10px}
.ob-dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.ob-dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:.2s}
.ob-dots i.on{width:26px;background:var(--btn)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);margin-top:10px;min-height:64px}
.opt.on{border-color:var(--peony);background:var(--peony-soft)}
.opt .t{font-weight:700}
.opt .d{font-size:.84rem;color:var(--ink-2)}
.level{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.level i{display:block;height:100%;width:0;background:var(--jade);border-radius:7px;transition:width .08s}

/* ---------- Basics guide ---------- */
.acc{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px;min-height:64px;font-weight:700;font-size:1.05rem;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary .num{width:34px;height:34px;border-radius:50%;background:var(--btn);color:var(--peony-ink);display:grid;place-items:center;flex:none;font-size:.95rem}
.acc[open] summary{border-bottom:1px solid var(--line)}
.acc .body{padding:4px 18px 18px;color:var(--ink);line-height:1.7}
.acc .body ul{padding-left:1.1em;margin:8px 0}
.acc .body li{margin:6px 0}
.tipbox{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:.92rem}

/* ---------- Records ---------- */
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--bamboo);min-height:3px}
.bars .b.today i{background:var(--peony)}
.bars .b span{font-size:.66rem;color:var(--ink-3);font-weight:700}
.habit{display:flex;align-items:center;gap:10px;padding:6px 0}
.habit .nm{width:64px;font-weight:700}
.habit .tr{flex:1;position:relative;height:16px;background:var(--surface-2);border-radius:8px}
.habit .tr::before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink-3)}
.habit .tr i{position:absolute;top:2px;bottom:2px;border-radius:6px}
.habit .v{width:58px;text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* ---------- Recording ---------- */
.rec-btn{width:88px;height:88px;border-radius:50%;margin:0;flex:none;display:grid;place-items:center;background:var(--btn);color:var(--peony-ink);box-shadow:0 0 0 10px var(--peony-soft)}
.rec-btn.on{animation:recP 1.4s infinite}
.rec-btn svg{width:44px;height:44px}
@keyframes recP{50%{box-shadow:0 0 0 18px var(--peony-soft)}}
.rec-time{text-align:center;font-family:var(--serif);font-size:2.2rem;font-variant-numeric:tabular-nums}

/* ---------- Editor ---------- */
.keys{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.keys button{flex:none;width:50px;height:64px;border-radius:10px;background:linear-gradient(90deg,#9A7642,#EBD8AC 30%,#CFAA6E 62%,#8E6B3A);color:#3A2812;font-weight:700;font-size:1.15rem;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.keys button small{font-size:.62rem;opacity:.75}
.keys button:active{transform:translateY(2px)}
.ed-notes{display:flex;flex-wrap:wrap;gap:6px;min-height:70px;padding:10px;border-radius:16px;background:var(--surface-2)}
.ed-notes .en{min-width:46px;height:52px;padding:0 6px;border-radius:12px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem}
.ed-notes .en small{font-size:.62rem;color:var(--ink-3)}
.ed-notes .en.sel{border-color:var(--peony);background:var(--peony-soft)}

/* ---------- Landscape ---------- */
@media (orientation:landscape) and (max-height:560px){
  :root{--nav-h:56px;--hdr-h:50px}
  #nav button{flex-direction:row;gap:6px;font-size:.8rem}
  #view{max-width:1100px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .t-note{font-size:4rem}
  .target .big{font-size:3.4rem}
  .ob{min-height:auto}
}
@media (min-width:900px){ .split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start} #view{max-width:1000px} }

/* ---------- 한 화면 맞춤 ---------- */
@media (max-height:700px){:root{--k:.93}}
@media (max-height:620px){:root{--k:.88}}
body.fitmode #view{padding-bottom:0;padding-top:4px}
.screen.fit{display:flex;flex-direction:column;gap:9px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen.fit::-webkit-scrollbar{display:none}
.screen.fit>*,.col>*{flex:none}
.col{display:flex;flex-direction:column;gap:9px;min-height:0}
.fx{flex:1 1 auto!important;min-height:0}
.cq{container-type:size}
.screen.fit .card{padding:12px 14px}
.screen.fit .card+.card{margin-top:0}
.screen.fit .seg button{min-height:42px}
.screen.fit .chip{min-height:40px}
.screen.fit .mt{margin-top:0}
.screen.fit .micgate .card{padding:18px 16px}
.target.fx{display:flex;flex-direction:column;align-items:center;justify-content:center;container-type:size;padding:8px 10px}
.target.fx .big{font-size:clamp(2.2rem,30cqh,4.6rem);margin:2px 0}
.target.fx .fb{min-height:1.3em;margin-top:6px}
.target.fx .dots{margin-top:6px}
.meter.slim{height:32px}
.screen.fit .pm-card{padding:4px 4px 0}
.tuner.fx{container-type:size;display:flex;flex-direction:column;justify-content:center;padding:10px}
.tuner.fx svg.gauge{max-height:46cqh;width:auto;max-width:100%}
.tuner.fx .t-note{font-size:clamp(2.4rem,20cqh,5rem)}
.tuner.fx .t-hint{min-height:2.4em;margin-top:6px}
.ring-box{container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-box .ring{width:auto;height:min(230px,62cqh);aspect-ratio:1;margin:0 auto}
.ring-box .fb{min-height:1.3em;margin-top:4px}
.breath-box{container-type:size;display:grid;place-items:center}
.breath-box .breath{width:auto;height:min(260px,88cqh);aspect-ratio:1;margin:0}
.info-big{font-family:var(--serif);font-size:clamp(2.4rem,38cqh,4.6rem);line-height:1.05}
.row.between{justify-content:space-between}
.ibtns{display:flex;gap:6px}
.ibtns .btn{flex:1;min-height:50px;padding:0 4px;font-size:.8rem;flex-direction:column;gap:2px;border-radius:12px}
.ibtns .btn svg{width:19px;height:19px}
.ibtns .btn.on{background:var(--peony-soft);border-color:var(--peony);color:var(--peony)}
.cur-row{display:flex;align-items:baseline;gap:10px;padding:0 4px;min-height:2.2rem}
.cur-row b{font-family:var(--serif);font-size:2.1rem;font-weight:400;line-height:1}
.cur-row .s{color:var(--ink-2);font-weight:700;font-size:.88rem;white-space:nowrap}
.cur-row .fb{margin:0 0 0 auto;min-height:0;font-size:.84rem;text-align:right;line-height:1.3}
.kv.tight{margin-top:0;grid-template-columns:repeat(4,1fr);gap:6px}
.kv.tight div{padding:6px 4px;border-radius:12px}
.kv.tight b{font-size:1.08rem}
.kv.tight span{font-size:.7rem}
.stepper.sm button{width:44px;height:44px;font-size:1.25rem;border-radius:12px}
.stepper.sm .val{min-width:56px}
.stepper.sm .val b{font-size:1.45rem}
.tap.sm{min-height:52px;font-size:.92rem}
.pulse.sm{width:46px;height:46px;margin:0;font-size:1rem;flex:none}
.lane.fx{min-height:64px;height:auto}
.screen.fit .beats{margin:2px 0}
.lenbars{display:flex;align-items:flex-end;gap:6px;position:relative;padding-top:6px}
.lenbars .lb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.lenbars .lb i{display:block;width:100%;border-radius:6px 6px 3px 3px;min-height:4px}
.lenbars .lb span{font-size:.7rem;color:var(--ink-3);font-weight:700}
.lenbars .guide{position:absolute;left:0;right:0;border-top:2px dashed var(--jade);opacity:.7}
.phase{position:relative;border-radius:14px;background:var(--surface-2);min-height:70px;overflow:hidden}
.phase .zone{position:absolute;top:0;bottom:0;background:var(--jade-soft);border-left:2px solid var(--jade);border-right:2px solid var(--jade)}
.phase .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink-3)}
.phase .lbl{position:absolute;bottom:4px;font-size:.7rem;font-weight:700;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.phase .pd{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;opacity:.85}
.helpbody{line-height:1.7}
.helpbody p{margin:8px 0}
.helpbody ul{padding-left:1.1em;margin:6px 0}

/* ---------- 키·빠르기 조절 ---------- */
.ctl-row{display:flex;gap:6px}
.sctl{flex:1;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px 4px 3px 10px;min-height:46px;min-width:0}
.sctl .sl-l{font-size:.72rem;font-weight:700;color:var(--ink-3);white-space:nowrap}
.sctl button{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:0;font-size:1.2rem;font-weight:700;color:var(--ink);flex:none;touch-action:manipulation}
.sctl b{flex:1;text-align:center;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.presets{display:flex;gap:6px}
.presets .chip{flex:1;justify-content:center;padding:0 4px;font-size:.84rem}
.syls{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden;min-height:30px}
.syls span{flex:none;padding:4px 8px;border-radius:10px;font-size:.74rem;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.syls span.ok{background:var(--jade-soft);color:var(--jade)}
.syls span.no{background:var(--warm-soft);color:var(--warm)}
.bd-steps{display:flex;gap:8px;justify-content:center;margin-top:8px}
.bd-steps span{padding:6px 12px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:.86rem;color:var(--ink-3)}
.bd-steps span.on{background:var(--peony-soft);color:var(--peony)}
.bd-steps span.done{background:var(--jade-soft);color:var(--jade)}

/* ================= 피아노 교실 전용 ================= */
:root{--s5:#E4E4EE;--s5i:#5A5A86;--kb-h:clamp(150px,30vh,230px)}
:root[data-theme="dark"]{--s5:#2C2C3A;--s5i:#B4B4E0}
.hero .art{width:132px;right:-10px;top:8px}

/* ---------- 화면 건반 ---------- */
.kbwrap{flex:none;display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.kbbar{display:flex;align-items:center;gap:6px}
.kbbar .kbr{flex:1;text-align:center;font-size:.78rem;font-weight:700;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbbar button{min-width:44px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:700;color:var(--ink-2);display:grid;place-items:center;padding:0 8px;font-size:.82rem}
.kbbar button svg{width:18px;height:18px}
.kbbar button.on{background:var(--peony-soft);border-color:var(--peony);color:var(--peony)}
.pkb{position:relative;height:var(--kb-h);touch-action:none;border-radius:12px 12px 14px 14px;background:#2B211A;padding:8px 3px 4px;box-shadow:var(--shadow)}
.pkb-in{position:relative;width:100%;height:100%}
.wk,.bk{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-weight:700;cursor:pointer;transition:background .06s}
.wk{height:100%;background:linear-gradient(#FFFDF8,#F4EEE4);border:1px solid #CDBFAE;border-top:0;border-radius:0 0 8px 8px;color:#6D5F51;font-size:.8rem;padding-bottom:7px;box-shadow:inset 0 -5px 0 #E4DACB;z-index:1}
.bk{height:61%;background:linear-gradient(#3B302A,#16110E);border-radius:0 0 6px 6px;color:#E9DCCB;font-size:.6rem;padding-bottom:6px;z-index:2;box-shadow:inset 0 -4px 0 #000,0 2px 3px rgba(0,0,0,.35)}
.wk .kl,.bk .kl{line-height:1.05;text-align:center;pointer-events:none;white-space:nowrap}
.wk .kl small{display:block;font-size:.6rem;opacity:.7}
.wk.mid::after{content:'';position:absolute;bottom:30px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--peony);opacity:.7}
.wk.tgt{background:linear-gradient(#FFF0D9,#F5D7AA);color:#7A4A1E}
.bk.tgt{background:linear-gradient(#B8854E,#7A5226);color:#FFF4E2}
.wk.on{background:linear-gradient(#E9DCC7,#D9C8AE);box-shadow:inset 0 -2px 0 #C9B79C}
.bk.on{background:linear-gradient(#5A4A40,#2A201A);box-shadow:inset 0 -1px 0 #000}
.wk.ok,.wk.ok.on{background:linear-gradient(#E3F1E4,#B7D9BD);color:#2F6B3E}
.bk.ok,.bk.ok.on{background:linear-gradient(#6FA27B,#3E6E4A);color:#fff}
.wk.bad,.wk.bad.on{background:linear-gradient(#F8E0DC,#EDB5AD);color:#8E3A31}
.bk.bad,.bk.bad.on{background:linear-gradient(#C46A5F,#8E3A31);color:#fff}
.wk.miss{box-shadow:inset 0 0 0 3px #C9A46A,inset 0 -5px 0 #E4DACB}
.bk.miss{box-shadow:inset 0 0 0 3px #E2B979}
.fg{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--btn);color:var(--peony-ink);pointer-events:none}
.bk .fg{top:auto;bottom:22px;width:18px;height:18px;font-size:.62rem;background:#F1DDB0;color:#3A2812}
.kb-hint{font-size:.74rem;color:var(--ink-3);text-align:center;font-weight:700}

/* ---------- 코드 글자 ---------- */
.csym{font-family:var(--serif);line-height:1.05;letter-spacing:.01em}
.csym sup{font-size:.55em;vertical-align:.55em;margin-left:.04em}
.chord-big{font-family:var(--serif);font-size:clamp(2.6rem,22cqh,4.4rem);line-height:1.05}
.cnotes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}

const MIC_CANDS = (() => { const a = []; for (let r = 0; r < 12; r++) Object.keys(QUAL).forEach(q => { const pcs = Array.from(new Set(QUAL[q].iv.map(x => pc(r + x[1])))); a.push({ r, q, pcs, key: pcs.slice().sort((x, y) => x - y).join(), main: QUAL[q].lvl > 0 }); }); return a; })();

  const opt = pcs.length >= 3 && pcs.includes(pc(pcs[0] + 7)) ? pc(pcs[0] + 7) : -1;

// 들린 소리를 사람이 이해할 만큼만: 가장 잘 맞는 코드의 음, 아니면 센 음 4개까지

function micIdentify(c) {
  const n2 = c.reduce((a, x) => a + x * x, 0); if (!n2) return null;

const Mic = {
  state: 'idle', stream: null, src: null, an: null, tbuf: null, fbuf: null, hp: null,
  subs: new Set(), stateSubs: new Set(), raf: 0, relT: 0, perm: null, frame: null, zeroSince: 0, silentWarned: false, detail: '',

  embeddedBlocked() { try { const pp = document.permissionsPolicy || document.featurePolicy; if (pp && pp.allowsFeature) return !pp.allowsFeature('microphone'); } catch (e) { } return false; },
  running() { return !!(this.stream && this.stream.active && this.an); },
  setState(s, detail = '') { this.state = s; this.detail = detail; this.stateSubs.forEach(fn => { try { fn(s); } catch (e) { } }); },
  onState(fn) { this.stateSubs.add(fn); return () => this.stateSubs.delete(fn); },

  async acquire() {

    if (!this.secure()) { this.setState('insecure'); return false; }
    if (this.embeddedBlocked()) { this.setState('embedded'); return false; }
    const ctx = AudioEng.ensure();
    if (this._busy) return this._busy;
    this._busy = (async () => {

  if (st === 'denied') return `<div class="card">${ic(1, 'micOff')}<h3>마이크가 막혀 있어요</h3><p>예전에 ‘허용 안 함’을 눌러서 브라우저가 마이크를 막고 있어요.</p>
    <ol class="steps"><li>주소창 왼쪽의 <span class="kbd">${ICONS.sliders.replace('<svg', '<svg style="width:16px;height:16px"')} 아이콘</span>을 누르세요</li><li><b>권한</b>(또는 사이트 설정)을 누르세요</li><li><b>마이크</b>를 <b>허용</b>으로 바꾸세요</li></ol>
    <button class="btn primary wide mt2" data-mg="retry">다시 확인</button></div>`;

  if (st === 'busy') return `<div class="card">${ic(1, 'micOff')}<h3>다른 앱이 마이크를 쓰고 있어요</h3><p>통화, 녹음 앱 등을 끄고 다시 시도해 주세요.</p><button class="btn primary wide mt2" data-mg="retry">다시 시도</button></div>`;

// 마이크를 켜요. 안 되면 안내 시트를 띄우고 false
async function micOn() {
  AudioEng.ensure();
  if (await Mic.acquire()) return true;
  const sh = openSheet(`<div class="micgate">${gateHTML(Mic.state)}</div><button class="btn ghost wide mt" data-x="1">마이크 없이 하기</button>`);
  return new Promise(res => {
    let done = false;
    const fin = v => { if (done) return; done = true; res(v); };
    sh.addEventListener('click', async e => {
      if (e.target.closest('[data-x]')) { fin(false); sheetDone(); return; }
      const b = e.target.closest('[data-mg]'); if (!b) return;
      const ok = await Mic.acquire();
      if (ok) { fin(true); sheetDone(); } else { const g = $('.micgate', sh); if (g) g.innerHTML = gateHTML(Mic.state); }
    });
    if (sheetOpen) { const prev = sheetOpen.onClose; sheetOpen.onClose = () => { if (prev) prev(); fin(Mic.running()); }; }
  });
}
async function micStatusText() {
  if (!Mic.secure()) return { cls: 'no', t: '파일로 열려 있어 사용할 수 없음' };
  if (Mic.running()) return { cls: 'ok', t: '연결됨' };
  const q = await Mic.query();
  return q === 'granted' ? { cls: 'ok', t: '허용됨' } : q === 'denied' ? { cls: 'no', t: '막혀 있음' } : { cls: 'ask', t: '아직 허용 안 함' };
}

/* ================= 맞았는지 판정 (화면 건반·MIDI·마이크 공통) ================= */
// target: { pcs:[], bass?: pc, exact?: [midi...], label }
// on.ok(info), on.wrong(info), on.change(notes)
function Judge(on) {
  let target = null, since = 0, wrongT = 0, done = false, micOk = 0, micBad = 0, lastWrongKey = '';
  const evalExact = () => {
    if (!target || done) return;
    const ns = Input.notes(); if (on.change) on.change(ns);
    clearTimeout(wrongT);
    if (!ns.length) return;
    const pcs = Array.from(new Set(ns.map(pc)));
    const T = new Set(target.pcs);
    const extra = ns.filter(m => !T.has(pc(m)));
    const missing = target.pcs.filter(p => !pcs.includes(p));
    let ok = !extra.length && !missing.length;
    let why = '';
    if (ok && target.exact) { const ex = target.exact.slice().sort((a, b) => a - b); ok = ex.length === ns.length && ex.every((m, i) => m === ns[i]); if (!ok) why = 'voicing'; }
    else if (ok && target.bass != null && pc(ns[0]) !== target.bass) { ok = false; why = 'bass'; }
    if (ok) { done = true; on.ok({ notes: ns, ms: performance.now() - since, src: 'keys', t: Input.last, inSrc: Input.lastSrc }); return; }
    const latch = Array.from(Input.held.values()).some(h => h.src === 'screen') && S().tapMode === 'latch';
    const enough = ns.length >= target.pcs.length || extra.length > 0 || why;
    if (!enough) return;
    const report = () => { if (done) return; on.wrong({ notes: ns, extra, missing, why, src: 'keys' }); };
    if (latch || target.pcs.length === 1 || ns.length > target.pcs.length + 1) report(); else wrongT = setTimeout(report, 450);
  };
  const unIn = Input.sub(ev => { if (ev.type === 'down' || ev.type === 'up') evalExact(); });
  const unMic = Mic.sub(fr => {
    if (!target || done || !S().useMic || !fr.chroma) return;
    if (fr.onset < since - 150 || fr.pt - fr.onset > 1400) { micOk = 0; return; }
    if (fr.pt - fr.onset < 110) return;
    let r;
    if (target.single) { const c = fr.chroma; let best = 0; for (let p = 1; p < 12; p++) if (c[p] > c[best]) best = p; const second = Math.max(...c.filter((_, p) => p !== best)); r = { ok: best === target.pcs[0] && second < 0.7, heard: [best], present: [], wrong: [] }; if (r.ok) r.present = [best]; }
    else r = micChordCheck(fr.chroma, target.pcs, target.ignore || []);
    if (r.ok) { micBad = 0; if (++micOk >= 3) { done = true; on.ok({ ms: performance.now() - since, src: 'mic', heard: r.heard, t: fr.onset, inSrc: 'mic' }); } }
    else { micOk = 0; if (++micBad === 14) { const key = r.heard.join(','); if (key !== lastWrongKey) { lastWrongKey = key; on.wrong({ src: 'mic', heard: r.heard, missing: target.pcs.filter(p => !r.present.includes(p)), wrongPcs: r.wrong }); } } }
  });
  return {
    set(t) { target = t; since = performance.now(); done = false; micOk = 0; micBad = 0; lastWrongKey = ''; clearTimeout(wrongT); },
    again() { done = false; since = performance.now(); micOk = micBad = 0; },
    check: evalExact,
    get done() { return done; },
    destroy() { unIn(); unMic(); clearTimeout(wrongT); }
  };
}

/* ================= 듣는 장치·지연 시간 ================= */
// 장치마다 따로 저장: tap(화면 두드림 지연), play(피아노 MIDI·마이크 지연), vis(화면 늦춤, null이면 자동)

    { id: 'bt', name: '블루투스 이어폰', bt: true, tap: null, play: null, rep: null, vis: null }];

}
function curOut() { const s = S(); if (!Array.isArray(s.outs) || !s.outs.length) outsInit(); return s.outs.find(o => o.id === s.out) || s.outs[0]; }

function illKb(o = {}) { // 작은 건반 그림 (from~to 흰 건반)
  const from = o.from || 60, whites = o.whites || 14, W = 26, H = 86, hl = o.hl || {}, lab = o.labels || {};
  let s = '', t = '';
  for (let i = 0; i < whites; i++) { const m = whiteAt(wIndex(from) + i); s += `<rect class="${hl[m] ? 'hl' : 'w'}" x="${i * W}" y="0" width="${W}" height="${H}" rx="3"/>`; const l = lab[m] != null ? lab[m] : o.names ? noteName(m) : ''; if (l) t += `<text x="${i * W + W / 2}" y="${H - 8}">${esc(l)}</text>`; }
  for (let i = 0; i < whites - 1; i++) { const m = whiteAt(wIndex(from) + i) + 1; if (!isBlack(m)) continue; const cx = (i + 1 + BLACK_OFF[pc(m)]) * W; s += `<rect class="${hl[m] ? 'bhl' : 'b'}" x="${cx - 8}" y="0" width="16" height="${H * 0.6}" rx="2"/>`; if (lab[m]) t += `<text x="${cx}" y="${H * 0.6 + 12}" style="font-size:9px">${esc(lab[m])}</text>`; }
  return `<svg class="big-ill ill-kb" viewBox="-2 -2 ${whites * W + 4} ${H + (o.extra || 4)}">${s}${t}</svg>`;
}
function handSVG() {
  const hand = (x0, flip, label) => {
    const xs = [0, 1, 2, 3, 4].map(i => x0 + (flip ? (4 - i) : i) * 26);
    const hs = [36, 62, 70, 64, 50], ys = [62, 20, 12, 18, 34];
    let s = `<rect x="${x0 - 8}" y="78" width="${4 * 26 + 30}" height="58" rx="24" fill="var(--peony-soft)" stroke="var(--peony)" stroke-width="1.5"/>`;
    [0, 1, 2, 3, 4].forEach(i => { const x = xs[i], y = ys[i] + (i === 0 ? 14 : 0); const xx = i === 0 ? x + (flip ? 14 : -14) : x; s += `<rect x="${xx}" y="${y}" width="22" height="${hs[i] + 20}" rx="11" fill="var(--peony-soft)" stroke="var(--peony)" stroke-width="1.5"/><circle cx="${xx + 11}" cy="${y + 14}" r="9" fill="var(--btn)"/><text x="${xx + 11}" y="${y + 18.5}" text-anchor="middle" font-size="12" fill="var(--peony-ink)">${i + 1}</text>`; });
    return s + `<text x="${x0 + 50}" y="158" text-anchor="middle" font-size="13" fill="var(--ink-2)">${label}</text>`;
  };
  return `<svg class="hand" viewBox="-10 0 330 165">${hand(10, true, '왼손')}${hand(176, false, '오른손')}</svg>`;
}

    const ui = practiceShell(el, `<div class="card qcard fx" id="plCard"></div>`);
    const card = $('#plCard', el); let micT = 0;
    function showIds(r, fromMic) {
      if (!r) { card.innerHTML = `<div class="q">건반을 눌러 보세요</div><div class="chord-big" style="color:var(--ink-3)">♪</div><div class="sub">세 음 이상 누르면 코드 이름을 알려 드려요</div>`; ui.kb.mark({}); return; }
      const tag = fromMic ? '<div class="q">마이크로 들은 화음 (대략)</div>' : '';
      if (r.kind === 'note') card.innerHTML = `${tag}<div class="chord-big">${esc(noteName(r.m))}</div><div class="sub">${esc(noteFull(r.m))}${isBlack(r.m) ? ` · ${esc(blackBoth(r.m))}` : ''}</div>`;
      else if (r.kind === 'int') card.innerHTML = `${tag}<div class="q">두 음 사이</div><div class="chord-big" style="font-size:clamp(2rem,16cqh,3rem)">${esc(r.name)}</div><div class="sub">${esc(noteName(r.lo))} → ${esc(noteName(r.hi))} · 반음 ${r.semis}칸</div>`;
      else if (r.kind === 'chord' || r.kind === 'near') {
        const ch = r.ch;
        card.innerHTML = `${tag}${r.kind === 'near' ? `<div class="q">거의 ${esc(ch.sym)} 코드예요</div>` : `<div class="q">${esc(QUAL[ch.q].ko)}${r.inv > 0 ? ` · ${INV_NAME[r.inv]}` : ''}</div>`}
          <div class="chord-big">${symHTML(ch)}</div><div class="sub">${esc(chordRead(ch))}</div>${notesChips(ch.tones, ch.tones.map(t => r.missing && r.missing.some(x => spPc(x) === spPc(t)) ? 'miss' : ''), ch.tones.map((_, i) => toneRole(ch, i)))}
          ${r.kind === 'near' ? `<div class="small muted mt">${r.missing.length ? `${esc(r.missing.map(spName).join(', '))}${eun(spName(r.missing[0]))} 빠졌어요` : `${esc(r.extra.map(p => nameOfPc(p)).join(', '))}${iga(nameOfPc(r.extra[0]))} 더 들어 있어요`}</div>` : ''}
          ${r.alts && r.alts.length ? `<div class="tiny muted" style="margin-top:6px">다르게 부르면: ${r.alts.map(a => esc(a.ch.sym + (a.ch.bass ? '/' + spEn(a.ch.bass) : ''))).join(', ')}</div>` : ''}
          ${QUAL[ch.q].lvl ? `<button class="btn sm soft" style="margin-top:8px" data-dict="${esc(ch.id)}">${ICONS.book2}코드 사전에서 보기</button>` : ''}`;
        const lab = {}; Input.notes().forEach(m => { const i = ch.pcs.indexOf(pc(m)); if (i >= 0) lab[m] = spName(ch.tones[i]); }); ui.kb.setLabels(lab);
      } else card.innerHTML = `${tag}<div class="q">이름 붙은 코드가 아니에요</div><div class="chord-big" style="font-size:2rem">${esc(r.pcs.map(p => nameOfPc(p)).join(' '))}</div>`;
    }
    card.addEventListener('click', e => { const b = e.target.closest('[data-dict]'); if (b) go('chord', { id: b.dataset.dict }); });
    const upd = () => { const ns = Input.notes(400); if (!ns.length) ui.kb.setLabels({}); showIds(ns.length ? identify(ns) : null); };
    const un = Input.sub(() => requestAnimationFrame(upd));
    const unM = Mic.sub(fr => {
      if (!S().useMic || !fr.chroma || Input.notes().length) return;
      if (fr.pt - fr.onset < 110 || fr.pt - fr.onset > 1400 || fr.pt - micT < 250) return; micT = fr.pt;
      const r = micReading(fr); if (r) showIds(r, true);
    });
    showIds(null);
    return () => { un(); unM(); ui.destroy(); };
  }
});

const RELATED = { maj: ['min', 'dom7', 'sus4'], min: ['maj', 'min7', 'dim'], dom7: ['maj7', 'maj', 'min7'], maj7: ['dom7', 'maj', 'min7'], min7: ['min', 'dom7', 'm7b5'], sus4: ['maj', 'sus2'], sus2: ['maj', 'sus4'], dim: ['min', 'm7b5'], aug: ['maj'], m7b5: ['dim', 'min7'] };
defScreen('chord', {
  title: p => { const c = chordFromId(p.id); return c ? `${c.sym} 코드` : '코드'; }, fit: true, practice: 'dict', wake: true,
  render(el, p) {
    let ch = chordFromId(p.id); let inv = 0, okN = 0;
    const ui = practiceShell(el, `<div class="card qcard fx" id="cdCard"></div><div class="tools"><button class="btn" data-pl="both">${ICONS.sound}들어보기</button><button class="btn" data-pl="arp">${ICONS.arp}한 음씩</button><button class="btn" data-pl="block">${ICONS.chord}함께</button></div><div id="cdInv"></div>`, { tall: true })
    const judge = Judge({ ok: () => { okN++; chime(true); const v = voicing(ch, inv); const mk = {}; Input.notes().forEach(m => mk[m] = 'ok'); ui.kb.mark(mk); $('#cdFb', el).className = 'fb good'; $('#cdFb', el).textContent = okN > 1 ? `맞았어요! (${okN}번째)` : '맞았어요! 손 모양을 기억해 두세요'; setTimeout(() => { ui.kb.clearLatch(); showChordOnKb(ui.kb, v); judge.set({ pcs: ch.pcs }); }, 1200); }, wrong: info => { $('#cdFb', el).className = 'fb bad'; $('#cdFb', el).textContent = fixText(ch, info); } });
    function render() {
      const v = voicing(ch, inv);
      const rel = (RELATED[ch.q] || []).map(q => makeChord(ch.root, q));
      $('#cdCard', el).innerHTML = `<div class="q">${esc(QUAL[ch.q].ko)} · ${esc(QUAL[ch.q].mood)}</div><div class="chord-big">${symHTML(ch)}</div><div class="sub">${esc(chordRead(ch))}</div>
        ${notesChips(ch.tones, [], ch.tones.map((_, i) => toneRole(ch, i)))}<div class="fb" id="cdFb">건반에 표시된 대로 눌러 보세요</div>${formulaHTML(ch, voicing(ch, 0))}
        ${hintsFor(ch.tones).map(h => `<div class="tiny muted" style="margin-top:4px">${esc(h)}</div>`).join('')}
        <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center">${rel.map(r => `<button class="chip" data-rel="${esc(r.id)}" style="min-height:36px">${esc(r.sym)}${gwa(r.sym)} 비교</button>`).join('')}</div>`;
      const io = ch.semis.map((_, i) => [i, INV_SHORT[i]]);
      $('#cdInv', el).innerHTML = segHTML('inv', io, inv);
      bindSeg(el, 'inv', x => { inv = +x; ui.kb.clearLatch(); render(); demoChord(voicing(ch, inv).map(y => y.m), 'block'); });
      showChordOnKb(ui.kb, v);
      judge.set({ pcs: ch.pcs });
    }
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-pl]'); if (b) { demoChord(voicing(ch, inv).map(x => x.m), b.dataset.pl); return; }
      const r = e.target.closest('[data-rel]'); if (r) { const o = makeChord(ch.root, chordFromId(r.dataset.rel).q); compare(ch, o); }
    });
    function compare(a, b) {
      const va = voicing(a), vb = voicing(b);
      const diff = b.tones.map((t, i) => (a.tones[i] && spPc(a.tones[i]) !== spPc(t)) || !a.tones[i] ? 'bad' : '');
      const sh = openSheet(`<h3>${esc(a.sym)}${gwa(a.sym)} ${esc(b.sym)}</h3><div class="cmp mt"><div><b>${esc(a.sym)}</b>${notesChips(a.tones)}<button class="btn sm wide mt" data-c="a">${ICONS.sound}듣기</button></div><div><b>${esc(b.sym)}</b>${notesChips(b.tones, diff)}<button class="btn sm wide mt" data-c="b">${ICONS.sound}듣기</button></div></div>
        <p class="small muted">${esc(QUAL[a.q].ko)}: ${esc(QUAL[a.q].mood)}<br>${esc(QUAL[b.q].ko)}: ${esc(QUAL[b.q].mood)}</p><div class="tipbox">${esc(QUAL[b.q].how)}</div>
        <div class="row mt2"><button class="btn grow" data-c="ab">${ICONS.sound}번갈아 듣기</button><button class="btn primary grow" data-c="go">${esc(b.sym)} 보기</button></div>`);
      sh.addEventListener('click', e => {
        const c = e.target.closest('[data-c]'); if (!c) return; const k = c.dataset.c;
        if (k === 'a') demoChord(va.map(x => x.m), 'block'); else if (k === 'b') demoChord(vb.map(x => x.m), 'block');
        else if (k === 'ab') { const ctx = AudioEng.ensure(); const t = ctx.currentTime + 0.05; Synth.chord(va.map(x => x.m), { when: t, dur: 1.3 }); Synth.chord(vb.map(x => x.m), { when: t + 1.5, dur: 1.3 }); Synth.chord(va.map(x => x.m), { when: t + 3, dur: 1.3 }); Synth.chord(vb.map(x => x.m), { when: t + 4.5, dur: 1.6 }); }
        else if (k === 'go') sheetDone(() => go('chord', { id: b.id }, { replace: true }));
      });
    }
    render();
    return () => { judge.destroy(); ui.destroy(); };
  }
});

  inv: { t: '자리바꿈 배우기', pages: [
    { t: '같은 코드, 다른 순서', show: 'C', inv: 0, play: ['C'], b: '<p>C 코드(도 · 미 · 솔)를 맨 아래가 근음 도가 되도록 쌓은 것을 <b>기본 자리</b>라고 해요.</p><p>맨 아래 음을 한 옥타브 위로 올려 쌓는 것을 <b>자리바꿈(전위)</b>이라고 해요. 음은 그대로라서 여전히 C 코드예요.</p>' },
    { t: '첫째 자리바꿈: 미 · 솔 · 도', task: 'C', inv: 1, b: '<p>도를 위로 올리면 <b>미 · 솔 · 도</b>가 돼요. 맨 아래 음이 3음(미)이에요. 이것을 첫째 자리바꿈(1전위)이라고 하고, C/E라고 적기도 해요.</p><p>건반에 보이는 자리 그대로, 맨 아래 미부터 눌러 보세요.</p>' },
    { t: '둘째 자리바꿈: 솔 · 도 · 미', task: 'C', inv: 2, b: '<p>한 번 더 올리면 <b>솔 · 도 · 미</b>. 맨 아래가 5음(솔)인 둘째 자리바꿈(2전위)이에요.</p>' },
    { t: '자리바꿈을 왜 쓸까요?', show: 'F', inv: 2, seq: [['C', 0], ['F', 2], ['G', 1], ['C', 0]], b: '<p>C → F → G → C를 모두 기본 자리로 치면 손이 이리저리 크게 움직여요.</p><p>F를 <b>도 · 파 · 라</b>(둘째 자리바꿈), G를 <b>시 · 레 · 솔</b>(첫째 자리바꿈)로 치면 손가락 한두 개만 살짝 움직이면 돼요. 소리도 더 부드럽게 이어져요.</p>' },
    { t: '직접 눌러 보세요: F 둘째 자리바꿈', task: 'F', inv: 2, b: '<p>도 · 파 · 라를 눌러요. C(도미솔)를 잡은 손에서 미→파, 솔→라로 두 손가락만 옮기면 돼요.</p>' },
    { t: '직접 눌러 보세요: G 첫째 자리바꿈', task: 'G', inv: 1, b: '<p>시 · 레 · 솔을 눌러요. C(도미솔)에서 도→시, 미→레로 옮기고 솔은 그대로예요.</p>' },
    { t: '다 했어요!', end: { id: 'progs', p: {}, t: '코드 진행 연습하러 가기' }, b: '<p>‘코드 진행 연습’에서 <b>가까운 자리</b>를 고르면, 앞 코드에서 손을 가장 덜 움직이는 자리바꿈을 자동으로 보여 드려요.</p>' },
  ] },
};
defScreen('lesson', {
  title: p => (LESSONS[p.lvl] || LESSONS[1]).t, fit: true, wake: true, practice: 'lesson',
  render(el, p) {
    const L = LESSONS[p.lvl] || LESSONS[1]; let i = clamp(pref('lsn_' + p.lvl, 0), 0, L.pages.length - 1); let passed = false;
    const ui = practiceShell(el, `<div class="card fx" id="lsCard" style="overflow:auto;padding:14px 16px"></div><div class="row" style="gap:6px"><button class="btn" id="lsPrev">${ICONS.left}</button><span class="grow center"><button class="btn ghost sm hidden" id="lsNo">건너뛰기</button></span><button class="btn primary" id="lsNext">다음${ICONS.right}</button></div>`, { tall: true })
    const judge = Judge({
      ok: () => { passed = true; chime(true); const mk = {}; Input.notes().forEach(m => mk[m] = 'ok'); ui.kb.mark(mk); $('#lsFb', el).className = 'fb good'; $('#lsFb', el).textContent = '맞았어요! 다음으로 넘어가세요'; $('#lsNext', el).disabled = false; },
      wrong: info => { const pg = L.pages[i]; const ch = parseSym(pg.task); $('#lsFb', el).className = 'fb bad'; $('#lsFb', el).textContent = fixText(Object.assign(ch, pg.inv ? { bass: voicing(ch, pg.inv)[0].sp } : {}), info); }
    });
    function render() {
      const pg = L.pages[i]; passed = false; ui.kb.clearLatch();
      setPref('lsn_' + p.lvl, i);
      const sym = pg.task || pg.show; const ch = sym ? parseSym(sym) : null; const v = ch ? voicing(ch, pg.inv || 0) : null;
      $('#lsCard', el).innerHTML = `<div class="tiny muted" style="font-weight:700">${i + 1} / ${L.pages.length}${pg.task ? ' · 따라 해 보기' : ''}</div><h3 style="font-family:var(--serif);font-size:1.3rem;margin:4px 0 6px">${esc(pg.t)}</h3>
        ${ch ? `<div class="center"><div class="chord-big" style="font-size:2.6rem">${symHTML(ch)}${pg.inv ? `<span class="small muted" style="font-family:var(--sans)"> ${INV_NAME[pg.inv]}</span>` : ''}</div>${notesChips(v.map(x => x.sp), [], v.map(x => toneRole(ch, x.i)))}${pg.formula ? formulaHTML(ch, v) : ''}</div>` : ''}
        <div class="helpbody">${pg.b}</div>
        ${pg.play || pg.seq ? `<div class="row wrap mt" style="gap:6px">${(pg.play || []).map(s => `<button class="btn sm" data-ls="${esc(s)}">${ICONS.sound}${esc(s)}</button>`).join('')}${pg.play && pg.play.length > 1 ? `<button class="btn sm soft" data-ls="${esc(pg.play.join(','))}">이어서 듣기</button>` : ''}${pg.seq ? `<button class="btn sm soft" data-seq="1">${ICONS.sound}${esc(pg.seq.map(x => x[0]).join(' → '))} 듣기</button>` : ''}</div>` : ''}
        ${pg.task ? '<div class="fb" id="lsFb">건반에 표시된 대로 눌러 보세요</div>' : ''}
        ${pg.end ? `<button class="btn primary wide mt" id="lsEnd">${esc(pg.end.t)}</button>` : ''}`;
      const qt = $('#qTab', el); if (qt) qt.innerHTML = qualTable();
      $('#lsNo', el).classList.toggle('hidden', !pg.task);
      $('#lsPrev', el).disabled = i === 0;
      $('#lsNext', el).disabled = !!pg.task; $('#lsNext', el).classList.toggle('hidden', i === L.pages.length - 1);
      if (v) { showChordOnKb(ui.kb, v); if (pg.task) judge.set(pg.inv ? { pcs: ch.pcs, bass: pc(v[0].m) } : { pcs: ch.pcs }); else judge.set(null); }
      else { clearKb(ui.kb); judge.set(null); }
      if (pg.end) { DB.lessons[p.lvl] = { done: true }; saveDB(); $('#lsEnd', el).onclick = () => go(pg.end.id, pg.end.p, { replace: true }); }
      if (pg.task && pg.inv && S().useMic) $('#lsFb', el).textContent = '마이크로는 음만 확인하고, 쌓은 순서는 눈으로 확인해 주세요';
    }
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-ls]');
      if (b) { const syms = b.dataset.ls.split(','); const ctx = AudioEng.ensure(); let t = ctx.currentTime + 0.05; syms.forEach(s => { const ch = parseSym(s); Synth.chord(voicing(ch, s === (L.pages[i].show || L.pages[i].task) ? (L.pages[i].inv || 0) : 0).map(x => x.m), { when: t, dur: 1.4 }); t += 1.6; }); return; }
      if (e.target.closest('[data-seq]')) { const ctx = AudioEng.ensure(); let t = ctx.currentTime + 0.05; L.pages[i].seq.forEach(([s, inv]) => { Synth.chord(voicing(parseSym(s), inv, inv ? 53 : 60).map(x => x.m).map(m => m < 55 ? m + 12 : m), { when: t, dur: 1.2 }); t += 1.3; }); }
    });
    $('#lsPrev', el).onclick = () => { if (i > 0) { i--; render(); } };
    $('#lsNext', el).onclick = () => { if (i < L.pages.length - 1) { i++; render(); } };
    $('#lsNo', el).onclick = () => { if (i < L.pages.length - 1) { i++; render(); } };
    render();
    return () => { judge.destroy(); ui.destroy(); };
  }
});

defScreen('find', {
  title: '건반 찾기', fit: true, wake: true, practice: 'find',
  help: '<p>위에 나온 음 이름의 건반을 찾아 눌러요. 건반에는 이름이 숨겨져 있어요.</p><p><b>아무 자리</b>는 어느 옥타브의 건반이든 맞아요. <b>정확한 자리</b>는 ‘가온 도’, ‘높은 레’처럼 정확한 높이를 찾아야 해요.</p><p>마이크로 들을 때는 음 이름만 확인해요.</p>',
  render(el) {
    let range = pref('findR', 'white'), exact = pref('findX', 'pc'), N = 10, qi = 0, res = [], cur = null, t0 = 0, tries = 0, times = [], timer = 0;
    const ui = practiceShell(el, `<div class="card qcard fx" id="fdCard"></div><div class="row" style="gap:6px">${segHTML('fr', [['white', '흰 건반'], ['all', '검은 건반도']], range)}${segHTML('fx', [['pc', '아무 자리'], ['exact', '정확한 자리']], exact)}</div>`, { kb: { start: 60 } });
    ui.kb.setLabels(Object.fromEntries(Array.from({ length: 61 }, (_, k) => [36 + k, ''])));
    const judge = Judge({
      ok: () => { const ms = performance.now() - t0; if (!tries) res[qi] = 1; else res[qi] = 0; times.push(ms); chime(true); const mk = {}; mk[cur] = 'ok'; Input.notes().forEach(m => mk[m] = 'ok'); ui.kb.mark(mk); const lab = {}; Object.keys(mk).forEach(m => lab[m] = noteName(+m)); ui.kb.setLabels(Object.assign(Object.fromEntries(Array.from({ length: 61 }, (_, k) => [36 + k, ''])), lab)); fb('good', `맞았어요! ${(ms / 1000).toFixed(1)}초`); timer = setTimeout(next, 800); },
      wrong: info => { tries++; if (info.src === 'mic') { fb('bad', `${info.heard.length ? nameOfPc(info.heard[0]) + '처럼 들려요' : '잘 안 들려요'}`); return; } const m = info.notes[info.notes.length - 1]; const mk = {}; mk[m] = 'bad'; ui.kb.mark(mk); fb('bad', exact === 'exact' && pc(m) === pc(cur) ? '이름은 맞았어요. 높이(옥타브)가 달라요' : `그건 ${noteName(m)}${ieyo(noteName(m))}`); setTimeout(() => { if (!judge.done) { ui.kb.clearLatch(); ui.kb.mark({}); } }, 600); }
    });
    const fb = (c, t) => { const f = $('#fdFb', el); if (f) { f.className = 'fb ' + c; f.textContent = t; } };
    function pool() { const r = ui.kb.range(); const [lo, hi] = exact === 'exact' ? [Math.max(r[0], 48), Math.min(r[1], 84)] : [60, 71]; const a = []; for (let m = lo; m <= hi; m++) if (range === 'all' || !isBlack(m)) a.push(m); return a; }
    function next() {
      ui.kb.clearLatch(); ui.kb.mark({}); ui.kb.setLabels(Object.fromEntries(Array.from({ length: 61 }, (_, k) => [36 + k, ''])));
      if (cur != null) qi++;
      if (qi >= N) return finish();
      if (exact === 'exact' && !cur) ui.kb.fit([55, 79]);
      let m; do { m = pick(pool()); } while (m === cur && pool().length > 1); cur = m; tries = 0; t0 = performance.now();
      const sp = isBlack(m) ? (Math.random() < 0.5 ? DEF_SP[pc(m)] : ALT_SP[pc(m)]) : DEF_SP[pc(m)];
      $('#fdCard', el).innerHTML = `<div class="q">이 건반을 찾아 누르세요</div><div class="chord-big">${esc(spName(sp))}</div><div class="sub">${exact === 'exact' ? esc(noteFull(m, sp)) : `어느 자리의 ${esc(spKo(sp))}${hasBatchim(spKo(sp)) ? '이든' : '든'} 괜찮아요`}</div>${isBlack(m) ? `<div class="tiny muted">${esc(sameKeyHint(sp))}</div>` : ''}<div class="fb" id="fdFb"></div>${dotsHTML(N, qi, res)}`;
      if (exact !== 'exact') ui.kb.fit([60, 71]);
      judge.set(exact === 'exact' ? { pcs: [pc(m)], single: true, exact: [m] } : { pcs: [pc(m)], single: true });
    }
    function finish() {
      judge.set(null); const ok = res.filter(x => x === 1).length; const avg = mean(times) / 1000;
      const key = `find_${range}_${exact}`; const nb = setBest(key, ok * 100 - Math.round(avg * 10));
      sessionNote(`${ok}/${N} · 평균 ${avg.toFixed(1)}초`);
      resultSheet('건반 찾기 결과', `<div class="result"><div class="score">${ok} / ${N}</div><div class="kv"><div><b>${avg.toFixed(1)}초</b><span>평균 시간</span></div><div><b>${ok}</b><span>한 번에 맞힘</span></div></div>${nb ? '<p class="small" style="color:var(--jade);font-weight:700">최고 기록이에요!</p>' : ''}</div>`, [{ id: 'again', label: '다시 하기', primary: true }, { id: 'home', label: '끝내기' }], a => { if (a === 'again') restart(); else back(); });
    }
    function restart() { qi = 0; res = []; times = []; cur = null; next(); }
    bindSeg(el, 'fr', v => { range = v; setPref('findR', v); restart(); });
    bindSeg(el, 'fx', v => { exact = v; setPref('findX', v); restart(); });
    restart();
    return () => { clearTimeout(timer); judge.destroy(); ui.destroy(); };
  }
});

defScreen('steps', {
  title: '반음·온음 세기', fit: true, wake: true, practice: 'steps',
  help: '<p>표시된 건반에서 시작해 반음(바로 옆 건반)을 몇 칸 가면 어디인지 찾아 눌러요. 검은 건반도 한 칸으로 세요.</p><p>코드는 반음 칸 수로 만들어요. 장3화음은 4칸 + 3칸, 단3화음은 3칸 + 4칸이에요.</p>',
  render(el) {
    let lvl = pref('stL', '12'), dir = pref('stD', 'up'), N = 10, qi = 0, res = [], cur = null, timer = 0, tries = 0;
    const ui = practiceShell(el, `<div class="card qcard fx" id="stCard"></div><div class="row" style="gap:6px">${segHTML('sl', [['12', '반음·온음'], ['34', '3칸·4칸'], ['mix', '1~7칸']], lvl)}${segHTML('sd', [['up', '위로'], ['both', '위아래']], dir)}</div>`);
    const judge = Judge({
      ok: () => { if (!tries) res[qi] = 1; else res[qi] = 0; chime(true); const f = {}; const s = Math.sign(cur.n); for (let k = 1; k <= Math.abs(cur.n); k++) f[cur.m0 + s * k] = k; ui.kb.setFingers(f); const mk = {}; mk[cur.m0] = 'tgt'; mk[cur.m0 + cur.n] = 'ok'; ui.kb.mark(mk); fb('good', `맞았어요! ${noteName(cur.m0)}에서 반음 ${Math.abs(cur.n)}칸 ${cur.n > 0 ? '위' : '아래'}는 ${noteName(cur.m0 + cur.n)}`); timer = setTimeout(next, 1500); },
      wrong: info => { tries++; if (info.src === 'mic') { fb('bad', info.heard.length ? `${nameOfPc(info.heard[0])}처럼 들려요` : '잘 안 들려요'); return; } const m = info.notes[info.notes.length - 1]; const d = m - cur.m0; const mk = {}; mk[cur.m0] = 'tgt'; mk[m] = 'bad'; ui.kb.mark(mk); fb('bad', d === 0 ? '시작한 건반이에요. 거기서부터 세어 보세요' : `거기는 반음 ${Math.abs(d)}칸 ${d > 0 ? '위' : '아래'}예요`); setTimeout(() => { if (!judge.done) { ui.kb.clearLatch(); const k = {}; k[cur.m0] = 'tgt'; ui.kb.mark(k); } }, 700); }
    });
    const fb = (c, t) => { const f = $('#stFb', el); if (f) { f.className = 'fb ' + c; f.textContent = t; } };
    function next() {
      ui.kb.clearLatch(); ui.kb.setFingers({});
      if (cur) qi++; if (qi >= N) return finish();
      const ns = lvl === '12' ? [1, 2] : lvl === '34' ? [3, 4] : [1, 2, 3, 4, 5, 6, 7];
      let n = pick(ns); if (dir === 'both' && Math.random() < 0.5) n = -n;
      const m0 = pick(Array.from({ length: 12 }, (_, k) => 60 + k).filter(m => !isBlack(m) || lvl === 'mix'));
      cur = { m0, n }; tries = 0;
      const word = Math.abs(n) === 2 && lvl === '12' ? '온음 하나' : `반음 ${Math.abs(n)}칸`;
      $('#stCard', el).innerHTML = `<div class="q">${esc(noteName(m0))}에서</div><div class="chord-big" style="font-size:clamp(2rem,18cqh,3.4rem)">${word} ${n > 0 ? '위' : '아래'}는?</div><div class="sub">${Math.abs(n) === 1 ? '바로 옆 건반이에요' : Math.abs(n) === 2 ? '반음 두 칸이에요' : '검은 건반도 한 칸으로 세요'}</div><div class="fb" id="stFb"></div>${dotsHTML(N, qi, res)}`;

const PRESS_DEF = {
  1: { t: '코드 짚기', q: ['maj', 'min'], roots: 'white', mode: 'any', hint: 'wrong', n: 10 },
  2: { t: '7화음 짚기', q: ['dom7', 'maj7', 'min7'], roots: 'white', mode: 'any', hint: 'wrong', n: 10 },

function pressCfg(set) { return Object.assign({}, PRESS_DEF[set] || PRESS_DEF[1], pref('press_' + set, {})); }
function pressSetupSheet(set, onDone) {

  bindChips(sh, 'q', v => c.q = v); bindSeg(sh, 'r', v => c.roots = v); bindSeg(sh, 'm', v => c.mode = v); bindSeg(sh, 'h', v => c.hint = v); bindSeg(sh, 'n', v => c.n = +v);
  sh.addEventListener('click', e => { if (e.target.closest('[data-ok]')) { setPref('press_' + set, c); sheetDone(onDone); } });
}
defScreen('press', {
  title: p => (PRESS_DEF[p.set] || PRESS_DEF[1]).t, fit: true, wake: true, practice: 'press',
  help: '<p>위에 나온 코드를 건반에서 찾아 눌러요. 맞으면 자동으로 다음 문제로 넘어가요.</p><p><b>콕콕</b> 모드에서는 건반을 하나씩 눌러 켜 두면 돼요. 틀린 건반(빨간색)은 다시 눌러 끄세요.</p><p><b>아무 자리나</b>는 음만 맞으면 순서·옥타브와 관계없이 맞아요. <b>기본 자리만</b>은 근음이 맨 아래여야 하고, <b>자리바꿈 문제</b>는 알려 준 음이 맨 아래여야 해요.</p><p>마이크로 들을 때는 음만 확인해요.</p>',
  render(el, p) {
    const set = p.set || 1; let c = pressCfg(set);
    let qi = 0, res = [], cur = null, prevId = '', t0 = 0, tries = 0, anyWrong = false, shown = false, times = [], timer = 0, slow = [];
    const ui = practiceShell(el, `<div class="card qcard fx" id="prCard"></div><div class="tools"><button class="btn" id="prPlay">${ICONS.sound}소리</button><button class="btn" id="prShow">${ICONS.eye}정답 보기</button><button class="btn" id="prSet">${ICONS.sliders}문제 고르기</button></div>`);
    const judge = Judge({
      ok: info => {
        const ms = performance.now() - t0; const first = !anyWrong && !shown; res[qi] = first ? 1 : 0; times.push(ms); slow.push({ sym: cur.label, ms });
        chordStat(cur.ch.sym, first, ms); chime(true);
        const mk = {}; (info.notes || cur.v.map(x => x.m)).forEach(m => mk[m] = 'ok'); ui.kb.mark(mk);
        const lab = {}; (info.notes || []).forEach(m => { const i = cur.ch.pcs.indexOf(pc(m)); if (i >= 0) lab[m] = spName(cur.ch.tones[i]); }); ui.kb.setLabels(lab); ui.kb.setFingers({});
        reveal('ok'); fb('good', `맞았어요! ${(ms / 1000).toFixed(1)}초${first ? '' : ''}`);
        $('#prCard', el).classList.add('ok');
        timer = setTimeout(next, 1100);
      },
      wrong: info => {
        anyWrong = true; if (info.src === 'mic' || info.notes.length >= cur.ch.pcs.length) tries++; fb('bad', fixText(Object.assign({}, cur.ch, cur.bass ? { bass: cur.bass } : {}), info));
        if (info.src !== 'mic') { const mk = {}; const T = new Set(cur.ch.pcs); info.notes.forEach(m => mk[m] = T.has(pc(m)) && info.why !== 'bass' ? 'ok' : 'bad'); if (info.why === 'bass') info.notes.forEach(m => mk[m] = 'tgt'); if (shown) cur.v.forEach(x => { if (!mk[x.m]) mk[x.m] = 'miss'; }); ui.kb.mark(mk); }
        if (c.hint === 'wrong' && tries >= 2 && !shown) showAnswer();
      }
    });
    const fb = (cl, t) => { const f = $('#prFb', el); if (f) { f.className = 'fb ' + cl; f.textContent = t; } };
    function reveal(state) { const box = $('#prNotes', el); if (box) box.innerHTML = notesChips(cur.v.map(x => x.sp), cur.v.map(() => state === 'ok' ? 'ok' : ''), cur.v.map(x => toneRole(cur.ch, x.i))); }
    function showAnswer() { shown = true; showChordOnKb(ui.kb, cur.v); reveal(); const h = hintsFor(cur.v.map(x => x.sp)); if (h.length) fb('', h[0]); }
    function makeQ() {
      const roots = c.roots === 'all' ? ROOT_PCS : WHITE_PCS;
      let ch, guard = 0; do { ch = makeChord(pick(roots), pick(c.q)); } while (ch.id === prevId && guard++ < 20);
      prevId = ch.id;
      let inv = 0; if (c.mode === 'inv') inv = Math.floor(Math.random() * ch.semis.length);
      const v = voicing(ch, inv, inv ? 55 : 60);
      const bass = c.mode === 'inv' ? v[0].sp : c.mode === 'root' ? ch.root : null;
      return { ch, inv, v, bass, label: ch.sym + (inv ? '/' + spEn(v[0].sp) : '') };
    }
    function next() {
      ui.kb.clearLatch(); $('#prCard', el).classList.remove('ok');
      if (cur) qi++;
      if (c.n && qi >= c.n) return finish();
      cur = makeQ(); tries = 0; anyWrong = false; shown = false; t0 = performance.now();
      const N = c.n || 0;
      $('#prCard', el).innerHTML = `<div class="q">${c.mode === 'inv' ? '맨 아래 음까지 맞춰 짚어 보세요' : '이 코드를 짚어 보세요'}</div><div class="chord-big">${symHTML(cur.ch)}</div>
        <div class="sub">${esc(chordRead(cur.ch))}${cur.bass && c.mode === 'inv' ? ` · ${INV_NAME[cur.inv]} (맨 아래 ${esc(spName(cur.bass))})` : c.mode === 'root' ? ' · 기본 자리 (맨 아래 근음)' : ''}</div>
        <div id="prNotes"><div class="cnotes">${cur.v.map(() => '<span>?</span>').join('')}</div></div><div class="fb" id="prFb"></div>${N ? dotsHTML(N, qi, res) : `<div class="tiny muted">${qi}문제째 · 한 번에 맞힘 ${res.filter(x => x === 1).length}</div>`}`;
      clearKb(ui.kb); ui.kb.fit(cur.v.map(x => x.m), true);
      if (c.hint === 'show') showAnswer();
      judge.set({ pcs: cur.ch.pcs, bass: cur.bass ? spPc(cur.bass) : null });
    }
    function finish() {
      judge.set(null);
      const N = qi; const ok = res.filter(x => x === 1).length; const avg = mean(times) / 1000;
      const sl = slow.slice().sort((a, b) => b.ms - a.ms).slice(0, 3);
      const nb = N >= 10 && setBest('press_' + set, Math.round(ok / N * 1000 - avg * 10));
      sessionNote(`${ok}/${N} · 평균 ${avg.toFixed(1)}초`);
      resultSheet('코드 짚기 결과', `<div class="result"><div class="score">${ok} / ${N}</div><div class="kv"><div><b>${avg.toFixed(1)}초</b><span>평균 시간</span></div><div><b>${ok}</b><span>한 번에 맞힘</span></div></div>
        ${sl.length ? `<p class="small muted mt">오래 걸린 코드: <b style="color:var(--ink)">${sl.map(x => esc(x.sym)).join(', ')}</b></p>` : ''}${nb ? '<p class="small" style="color:var(--jade);font-weight:700">최고 기록이에요!</p>' : ''}</div>`,
        [{ id: 'again', label: '다시 하기', primary: true }, { id: 'home', label: '끝내기' }], a => { if (a === 'again') restart(); else back(); });
    }
    function restart() { qi = 0; res = []; times = []; slow = []; cur = null; next(); }
    $('#prPlay', el).onclick = () => demoChord(cur.v.map(x => x.m));
    $('#prShow', el).onclick = () => showAnswer();
    $('#prSet', el).onclick = () => pressSetupSheet(set, () => { c = pressCfg(set); restart(); });
    restart();
    return () => { clearTimeout(timer); judge.destroy(); ui.destroy(); };
  }
});

const NAME_SETS = { 1: ['maj', 'min'], 2: ['dom7', 'maj7', 'min7'], 3: ['sus4', 'sus2', 'dim', 'aug', 'm7b5'] };
defScreen('name', {
  title: p => p.set == 2 ? '7화음 이름 맞히기' : '코드 이름 맞히기', fit: true, practice: 'name',
  help: '<p>건반에 표시된 코드의 이름을 아래 네 개 중에서 골라요. 건반 이름을 숨기면 더 어려워져요.</p><p>표시된 건반을 직접 눌러 소리를 들어 봐도 돼요.</p>',
  render(el, p) {
    const qs = NAME_SETS[p.set] || NAME_SETS[1]; const N = 10;
    let qi = 0, res = [], cur = null, prevId = '', names = pref('nmNames', 1), roots = pref('nmRoots', 'white'), timer = 0;
    const ui = practiceShell(el, `<div class="card qcard fx" id="nmCard"></div><div class="choices" id="nmCh"></div><div class="tools"><button class="btn" id="nmPlay" style="flex:none;padding:0 14px">${ICONS.sound}소리</button><div style="flex:1">${segHTML('nn', [[1, '건반 이름 보기'], [0, '이름 숨기기']], names)}</div></div>`, { bar: false, tall: true, kb: { latch: false, latchBar: false } });
    function opts(ch) {
      const pool = [];
      qs.forEach(q => { if (q !== ch.q) pool.push(makeChord(ch.root, q)); });
      [1, -1, 2, -2, 5, 7].forEach(d => pool.push(makeChord(pc(spPc(ch.root) + d), ch.q)));
      if (qs.length < 3) [1, -1].forEach(d => qs.forEach(q => pool.push(makeChord(pc(spPc(ch.root) + d), q))));
      const uniq = []; shuffle(pool).forEach(x => { if (x.sym !== ch.sym && !uniq.some(u => u.sym === x.sym)) uniq.push(x); });
      const same = uniq.filter(x => spPc(x.root) === spPc(ch.root)).slice(0, 1), other = uniq.filter(x => !same.includes(x));
      return shuffle([ch].concat(same, other).slice(0, 4));
    }

      const o = cur.opts[+b.dataset.i]; const ok = o.sym === cur.ch.sym; res[qi] = ok ? 1 : 0; chordStat(cur.ch.sym, ok, 0);
      $$('#nmCh .btn', el).forEach((x, i) => { if (cur.opts[i].sym === cur.ch.sym) x.classList.add('ok'); else if (x === b) x.classList.add('no'); });

      const ct = chordNotesTxt(cur.ch); f.textContent = ok ? `맞았어요! ${ct}` : `${o.sym}${eun(o.sym)} ${chordNotesTxt(o)}, 정답 ${cur.ch.sym}${eun(cur.ch.sym)} ${ct}${ieyo(ct)}`;
      const lab = {}; cur.v.forEach(x => lab[x.m] = spName(x.sp)); ui.kb.setLabels(lab);
      if (ok) chime(true); timer = setTimeout(next, ok ? 1100 : 2600);

  }
});

        : `<div class="q">준비하세요</div><div class="chord-big" style="color:var(--ink-3)">♪</div><div class="sub">못갖춘마디예요. 다음 박부터 코드를 쳐요</div><div class="fb" id="rnFb"></div>`;

    function playMel(from, to, at, spb, vol = 1) {

        const late = (hit - (t0 + it.start * spb)) / spb; const prevSame = idx > 0 && seq[idx - 1].ch && seq[idx - 1].ch.id === it.ch.id;
        const tol = 0.3, ms = Math.round(Math.abs(late) * spb * 1000);

          if (i >= seq.length) { if (pos >= seq.total + 0.2) { cancelAnimationFrame(raf); finish(); } return; }

        }

  }
});

      const rep = d => { setB(M.bpm + d); holdT = setTimeout(() => { holdI = setInterval(() => setB(M.bpm + d * 5), 160); }, 450); };
      const end = () => { clearTimeout(holdT); clearInterval(holdI); };
      [['#mtM', -1], ['#mtP', 1]].forEach(([s, d]) => { const b = $(s, el); b.addEventListener('pointerdown', e => { e.preventDefault(); rep(d); }); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, end)); });
      $('#mtR', el).oninput = e => setB(+e.target.value);
      bindSeg(el, 'mb', v => { M.beats = +v; saveDB(); const was = !!tk; stop(); render(); if (was) start(); });
      $('#mtTap', el).addEventListener('pointerdown', () => { const t = performance.now(); taps = taps.filter(x => t - x < 2500); taps.push(t); if (taps.length >= 3) { const iv = []; for (let i = 1; i < taps.length; i++) iv.push(taps[i] - taps[i - 1]); setB(60000 / median(iv)); } });
      $('#mtV', el).oninput = e => { S().metroVol = +e.target.value; saveDB(); };
    }
    function setB(v) { M.bpm = clamp(Math.round(v), 30, 200); saveDB(); $('#mtB', el).textContent = M.bpm; $('#mtN', el).textContent = tempoName(M.bpm); $('#mtR', el).value = M.bpm; if (tk) tk.setBpm(M.bpm); }
    const dock = setDock(`<button class="btn primary big wide" id="mtGo">${ICONS.play}시작</button>`);
    const btn = $('#mtGo', dock);
    btn.onclick = () => tk ? stop() : start();
    function start() { tk = new Ticker({ bpm: M.bpm, beats: M.beats, onBeat: ev => $$('#mtBeats i', el).forEach((d, i) => d.classList.toggle('on', i === ev.beat)) }); tk.start(); btn.className = 'btn stop big wide'; btn.innerHTML = ICONS.stop + '멈추기'; }
    function stop() { if (tk) tk.stop(); tk = null; btn.className = 'btn primary big wide'; btn.innerHTML = ICONS.play + '시작'; $$('#mtBeats i', el).forEach(d => d.classList.remove('on')); }
    render();
    return () => { stop(); clearTimeout(holdT); clearInterval(holdI); };
  }
});
