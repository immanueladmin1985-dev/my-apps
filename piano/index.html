/* ================= 시작 화면 ================= */
function runSplash(after) {
  const sp = $('#splash');
  const emb = $('#spEmb'); if (emb) emb.innerHTML = pianoArt();
  const put = (el, txt, d0, big) => { el.innerHTML = Array.from(txt).map((ch, i) => { if (ch === ' ') return '<span style="display:inline-block;width:.32em"></span>'; const d = (d0 + i * 0.09).toFixed(2); const delay = big ? `${d}s, ${(1.3 + i * 0.05).toFixed(2)}s` : `${d}s`; return `<span class="sp-ch" style="animation-delay:${delay}">${esc(ch)}</span>`; }).join(''); };
  const cv = $('#spCanvas'); const cx = cv.getContext('2d'); let raf = 0; const dpr = window.devicePixelRatio || 1;
  const parts = []; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const cols = ['201,164,106', '184,145,90', '233,213,169'];
  for (let i = 0; i < 36; i++) parts.push({ x: Math.random(), y: Math.random(), r: (Math.random() * 1.4 + .5) * dpr, v: Math.random() * 0.00022 + 0.00006, a: Math.random() * Math.PI * 2, c: cols[i % 3], note: i % 9 === 0 });
  const t0 = performance.now();
  function draw(t) {
    raf = requestAnimationFrame(draw); const k = Math.min(1, (t - t0) / 1500);
    cx.clearRect(0, 0, cv.width, cv.height);
    for (const p of parts) {
      p.y -= p.v * 16; p.a += 0.02; if (p.y < -0.02) p.y = 1.02;
      const al = (0.28 + 0.25 * Math.sin(p.a)) * k; const x = (p.x + Math.sin(p.a * .3) * 0.005) * cv.width, y = p.y * cv.height;
      cx.fillStyle = `rgba(${p.c},${al.toFixed(3)})`;
      if (p.note) { cx.font = `${14 * dpr}px serif`; cx.fillText('♪', x, y); } else { cx.beginPath(); cx.arc(x, y, p.r, 0, Math.PI * 2); cx.fill(); }
    }
  }
  let finished = false, timer = 0;
  function finish() { if (finished) return; finished = true; clearTimeout(timer); sp.classList.add('out'); splashDone = true; setTimeout(() => { cancelAnimationFrame(raf); sp.remove(); }, 900); maybeInstallOnStart(); }
  const start = () => { put($('#spSmall'), '난장이의', 0.15, false); put($('#spBig'), '피아노 교실', 0.5, true); raf = requestAnimationFrame(draw); timer = setTimeout(finish, matchMedia('(prefers-reduced-motion: reduce)').matches ? 2200 : 4300); after(); };
  sp.addEventListener('click', () => { if (performance.now() - t0 > 300) finish(); });
  const fontsReady = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('40px "Song Myung"', '피아노교실난장이의'), document.fonts.load('30px "Great Vibes"', 'Made by &')]) : Promise.resolve();
  Promise.race([fontsReady, sleep(1300)]).then(start, start);
}

        <div class="card mt"><b>피아노로 쳐서 재기</b><p class="small muted" style="margin:6px 0 0">디지털피아노(MIDI)를 연결했거나 마이크를 켠 상태에서, ‘틱’ 소리에 맞춰 아무 건반이나 짧게 16번 쳐 주세요.</p><button class="btn wide mt" id="lPlay">${ICONS.keys}피아노로 쳐서 재기</button></div>
        <div id="lRun"></div>
        <div class="card mt"><b>화면 늦춤</b><p class="small muted" style="margin:6px 0 0">블루투스 이어폰은 소리가 늦게 들려서 박 표시가 먼저 움직여요. 시작을 누르고, 동그라미가 깜빡이는 순간 ‘틱’이 같이 들리게 맞춰 주세요. 화면이 먼저 보이면 늘리고, 늦게 보이면 줄여요.</p>
          <div class="row mt" style="justify-content:center;gap:14px"><div class="pulse sm" id="lDot" style="width:64px;height:64px"></div><div class="stepper sm"><button id="lVm">−</button><div class="val"><b id="lV">${visOf(o)}</b><small>ms</small></div><button id="lVp">+</button></div></div>
          <div class="row mt"><button class="btn grow" id="lVgo">${ICONS.play}보면서 맞추기</button><button class="btn ghost" id="lVa">자동값 ${visAuto(o)}ms</button></div></div>
        <div class="card mt"><b>장치 관리</b>${outListHTML()}<div class="row wrap" style="gap:6px"><button class="btn sm" id="oAdd">${ICONS.plus}장치 추가</button><button class="btn sm" id="oRen">이름 바꾸기</button>${o.id === S().outs[0].id ? '' : '<button class="btn sm ghost" id="oDel">삭제</button>'}<button class="btn sm ghost" id="lReset">이 장치 값 지우기</button></div>
          <div class="row mt"><span class="grow"><b>블루투스 연결 자동 감지</b><div class="tiny muted">마이크를 한 번 허용해야 동작해요</div></span><label class="switch"><input type="checkbox" id="oAu" ${S().autoOut ? 'checked' : ''}><span></span></label></div></div>`;
      $('#lTap', el).onclick = () => run('tap');
      $('#lPlay', el).onclick = () => run('play');
      const setV = v => { o.vis = clamp(v, 0, 500); saveDB(); $('#lV', el).textContent = o.vis; };
      $('#lVm', el).onclick = () => setV(visOf(o) - 10); $('#lVp', el).onclick = () => setV(visOf(o) + 10);
      $('#lVa', el).onclick = () => { o.vis = null; saveDB(); render(); toast('자동값으로 되돌렸어요'); };
      $('#lVgo', el).onclick = () => { if (tk) { stopAll(); $('#lVgo', el).innerHTML = ICONS.play + '보면서 맞추기'; return; } preview(); $('#lVgo', el).innerHTML = ICONS.stop + '멈추기'; };
      $('.olist', el).onclick = e => { const r = e.target.closest('[data-oid]'); if (r) setOut(r.dataset.oid); };
      $('#oAdd', el).onclick = () => nameSheet('', n => { const x = { id: 'o' + uid(), name: n, bt: true, tap: null, play: null, rep: null, vis: null }; S().outs.push(x); saveDB(); if (!setOut(x.id)) render(); });
      $('#oRen', el).onclick = () => nameSheet(o.name, n => { o.name = n; saveDB(); render(); drawOutBtns(); });
      const del = $('#oDel', el); if (del) del.onclick = async () => { if (!(await confirmSheet(`‘${o.name}’ 장치를 지울까요?`, '지우기', true))) return; const id = o.id; setOut(S().outs[0].id); S().outs = S().outs.filter(x => x.id !== id); saveDB(); render(); };
      $('#lReset', el).onclick = () => { o.tap = o.play = o.rep = null; saveDB(); render(); toast('이 장치의 값을 지웠어요'); };
      $('#oAu', el).onchange = e => { S().autoOut = e.target.checked; saveDB(); if (e.target.checked) autoOut(); };
    }
    function nameSheet(v, done) {
      const sh = openSheet(`<h3>장치 이름</h3><input class="txt mt" id="nmIn" maxlength="30" placeholder="예: 갤럭시 버즈" value="${esc(v)}"><div class="row mt2"><button class="btn grow" data-a="no">취소</button><button class="btn primary grow" data-a="ok">저장</button></div>`);
      setTimeout(() => { const i = $('#nmIn', sh); if (i) i.focus(); }, 50);
      sh.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; const n = ($('#nmIn', sh).value || '').trim(); if (b.dataset.a === 'ok' && n) sheetDone(() => done(n)); else if (b.dataset.a === 'no') sheetDone(); });
    }
    function stopAll() { if (tk) tk.stop(); tk = null; clearTimeout(timer); cancelAnimationFrame(raf); if (unIn) unIn(); if (unMic) unMic(); unIn = unMic = null; }
    function preview() {
      stopAll(); let T0 = 0; const per = 60 / 80;
      tk = new Ticker({ bpm: 80, beats: 4, onSched: ev => { if (!T0) T0 = ev.time; } }); tk.start();
      const step = () => { raf = requestAnimationFrame(step); if (!T0) return; const ph = (audibleNow() - T0) / per; const d = $('#lDot', el); if (d) d.classList.toggle('on', ph >= 0 && (ph % 1) < 0.14); };
      step();
    }
    async function run(mode) {
      stopAll(); const box = $('#lRun', el);
      if (mode === 'play' && Midi.state !== 'ready') {
        if (!S().useMic) { box.innerHTML = `<div class="card mt center small">디지털피아노가 연결되지 않았어요. 마이크로 들을게요.</div>`; }
        const ok = await micOn(); if (!ok) { box.innerHTML = `<div class="card mt center small">MIDI 연결이나 마이크가 있어야 잴 수 있어요.</div>`; return; }
      }
      AudioEng.ensure();
      const N = 16, PRE = 4, bpm = 90, I = 60 / bpm; const clicks = [], hits = [];
      box.innerHTML = `<div class="card mt center">${mode === 'tap' ? `<button class="tap" id="lPad" style="min-height:150px;font-size:1.2rem;touch-action:manipulation">‘틱’에 맞춰 여기를 두드리세요</button>` : `<div style="font-family:var(--serif);font-size:1.6rem;margin:10px 0">‘틱’에 맞춰 건반을 치세요</div>`}<div class="small muted mt" id="lCnt">준비 ${PRE}</div></div>`;
      if (mode === 'tap') $('#lPad', el).addEventListener('pointerdown', e => { e.preventDefault(); hits.push(perfToCtx(e.timeStamp || performance.now())); const c = $('#lCnt', el); if (c && clicks.length) c.textContent = `${hits.length}번 두드렸어요`; });
      else {
        unIn = Input.sub(ev => { if (ev.type === 'down' && ev.src === 'midi') { hits.push(perfToCtx(ev.t)); const c = $('#lCnt', el); if (c) c.textContent = `${hits.length}번 들었어요`; } });
        let lastOn = -1;
        unMic = Mic.sub(fr => { if (Midi.state === 'ready') return; if (fr.onset > 0 && fr.onset !== lastOn && fr.pt - fr.onset > 110 && fr.pt - fr.onset < 260 && fr.loud && fr.chroma) { lastOn = fr.onset; hits.push(perfToCtx(fr.onset)); const c = $('#lCnt', el); if (c) c.textContent = `${hits.length}번 들었어요`; } });
      }
      tk = new Ticker({ bpm, beats: 4, onSched: ev => { if (ev.idx >= PRE && ev.idx < PRE + N) clicks.push(ev.time); if (ev.idx >= PRE + N - 1) tk.sound = false; }, onBeat: ev => { const c = $('#lCnt', el); if (c && ev.idx < PRE) c.textContent = `준비 ${PRE - ev.idx}`; else if (c && ev.idx === PRE && !hits.length) c.textContent = '지금부터 맞춰 주세요'; } });
      tk.start();
      timer = setTimeout(() => {
        stopAll(); if (!clicks.length) return;
        const t0 = clicks[0], tl = clicks[clicks.length - 1];
        const xs = hits.filter(t => t > t0 - 0.25 && t < tl + 0.6).map(t => t - t0);
        const v = offsetFrom(xs, I); const o = curOut();
        if (v !== null) {
          o[mode] = +clamp(v, -0.05, 0.6).toFixed(3); o.rep = +AudioEng.outLat().toFixed(3); saveDB();
          render();
          $('#lRun', el).innerHTML = `<div class="card mt center"><b>다 됐어요!</b><br>‘${esc(o.name)}’ 장치의 ${mode === 'tap' ? '화면 두드림' : '피아노'} 지연은 <b>${Math.round(o[mode] * 1000)}ms</b>예요. 박자 판정에 이 값을 빼고 계산해요.</div>`;
        } else $('#lRun', el).innerHTML = `<div class="card mt center"><b>박자가 고르지 않았어요.</b><br>화면은 보지 말고 ‘틱’ 소리에만 맞춰 다시 해 보세요.${mode === 'play' && Midi.state !== 'ready' ? '<br><span class="small muted">마이크로 잴 때는 건반을 짧고 또렷하게 쳐 주세요.</span>' : ''}</div>`;
      }, (PRE + N) * I * 1000 + 900);
    }
    render();
    return () => { stopAll(); unHook(); };
  }
});
// 박자대로 연습 전에 지연 시간을 아직 안 쟀으면 한 번 권해요
const askedCal = new Set();
function calPrompt(src) {
  return new Promise(res => {
    const o = curOut(); const key = o.id + src;
    if (measured(src) || askedCal.has(key)) return res(false);
    askedCal.add(key);
    const sh = openSheet(`<h3>지연 시간을 먼저 재 볼까요?</h3><p class="small muted">‘${esc(o.name)}’ 장치는 아직 ${src === 'screen' ? '화면 두드림' : '피아노'} 지연을 재지 않았어요. 30초만 재 두면 ‘딱 맞음’, ‘늦음’ 판정이 정확해져요. 블루투스 이어폰을 쓰신다면 꼭 재 주세요.</p><div class="row mt2"><button class="btn grow" data-a="no">그냥 하기</button><button class="btn primary grow" data-a="go">지금 재기</button></div>`, () => res(false));
    sh.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; if (b.dataset.a === 'go') { sheetDone(() => { res(true); go('latency'); }); } else sheetDone(); });
  });
}

/* ================= 홈 화면에 설치 안내 ================= */
function installSheet(manual) {
  if (FS.standalone()) { if (manual) toast('이미 홈 화면 앱으로 실행 중이에요'); return; }
  let inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  if (!manual && (inFrame || S().installNever)) return;
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const samsung = /SamsungBrowser/i.test(ua), kakao = /KAKAOTALK/i.test(ua), naver = /NAVER/i.test(ua);
  const kbd = t => `<span class="kbd">${t}</span>`;
  let how;
  if (installEvt) how = `<p>아래 <b>설치하기</b>를 누르고, 뜨는 창에서 <b>설치</b>를 누르면 끝이에요.</p>`;
  else if (kakao || naver) how = `<ol class="steps"><li>오른쪽 아래(또는 위) ${kbd('⋮')} 메뉴를 누르세요</li><li><b>다른 브라우저로 열기</b>(크롬·사파리)를 누르세요</li><li>열린 화면에서 이 안내가 다시 나오면 따라 해 주세요</li></ol>`;
  else if (ios) how = `<ol class="steps"><li>사파리 아래(또는 위) ${kbd('공유 ⬆')} 단추를 누르세요</li><li>메뉴를 올려 <b>홈 화면에 추가</b>를 누르세요</li><li>오른쪽 위 <b>추가</b>를 누르세요</li></ol>`;
  else if (samsung) how = `<ol class="steps"><li>아래 ${kbd('≡')} 메뉴를 누르세요</li><li><b>현재 페이지 추가</b> → <b>홈 화면</b>을 누르세요</li></ol>`;
  else how = `<ol class="steps"><li>오른쪽 위 ${kbd('⋮')} 메뉴를 누르세요</li><li><b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요</li><li>뜨는 창에서 <b>설치</b>를 누르세요</li></ol>`;
  const sh = openSheet(`<div class="center"><div style="width:96px;margin:0 auto 6px">${pianoArt()}</div><h3>홈 화면에 앱으로 설치하세요</h3></div>
    <p class="small muted">설치하면 아이콘으로 바로 열리고, 주소창 없이 <b>가로 화면 전체</b>를 건반으로 쓸 수 있어요. 인터넷이 없어도 열려요.</p>${how}
    <div class="row mt2">${installEvt ? '<button class="btn grow" data-a="later">나중에</button><button class="btn primary grow" data-a="inst">설치하기</button>' : '<button class="btn primary grow" data-a="later">알겠어요</button>'}</div>
    ${manual ? '' : '<button class="btn ghost wide mt" data-a="never">다시 묻지 않기</button>'}`);
  sh.addEventListener('click', async e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
    if (a === 'inst') { sheetDone(); await doInstall(); }
    else if (a === 'never') { S().installNever = true; saveDB(); sheetDone(); toast('설정에서 언제든 설치 방법을 다시 볼 수 있어요'); }
    else sheetDone();
  });
}
function maybeInstallOnStart() {
  if (FS.standalone()) return;
  let waited = 0;
  const tryShow = () => { if (installEvt || waited >= 2500) { if (!sheetOpen) installSheet(false); return; } waited += 250; setTimeout(tryShow, 250); };
  setTimeout(tryShow, 300);
}

</script>
</body>
