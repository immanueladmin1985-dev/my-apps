name: baseball-relay APK 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'baseball-relay/**'
      - '.github/workflows/baseball-relay-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 테스트와 빌드 (서명은 따로 한다)
        run: |
          gradle -p baseball-relay --no-daemon \
            -PversionCode=${{ github.run_number }} \
            :app:testReleaseUnitTest :app:assembleRelease :wear:assembleRelease
          mkdir -p dist
          cp baseball-relay/app/build/outputs/apk/release/*.apk dist/phone-unsigned.apk
          cp baseball-relay/wear/build/outputs/apk/release/*.apk dist/wear-unsigned.apk
          echo "${{ github.run_number }}" > dist/version.txt
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: baseball-relay-unsigned
          path: dist
          retention-days: 14
