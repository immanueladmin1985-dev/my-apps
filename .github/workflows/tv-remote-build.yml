name: tv-remote APK 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tv-remote/**'
      - '.github/workflows/tv-remote-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 테스트와 빌드 (서명은 따로 한다)
        run: |
          gradle -p tv-remote --no-daemon \
            -PversionCode=${{ github.run_number }} \
            :app:testReleaseUnitTest :app:assembleRelease :wear:assembleRelease
          mkdir -p dist
          cp tv-remote/app/build/outputs/apk/release/*.apk dist/phone-unsigned.apk
          cp tv-remote/wear/build/outputs/apk/release/*.apk dist/wear-unsigned.apk
          echo "${{ github.run_number }}" > dist/version.txt
          ls -la dist

      - name: 서명 전 APK 를 tv-remote-build 브랜치에 올리기
        run: |
          cd dist
          git init -q -b tv-remote-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "빌드 ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tv-remote-build
